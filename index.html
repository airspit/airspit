async function dbRegister(email,password,handle,role){
  // 1. Create auth user
  const{data:authData,error:authErr}=await sb.auth.signUp({email,password});
  if(authErr) return{error:authErr.message};
  const authId=authData.user?.id;
  // 2. Save profile
  const{data,error}=await sb.from("users").insert([{email,handle,role,auth_id:authId}]).select().single();
  if(error&&error.code==="23505") return{error:"El usuario o email ya existe."};
  if(error) return{error:error.message};
  return{data:{...data,handle,role}};
}
async function dbLogin(email,password){
  const{data:authData,error:authErr}=await sb.auth.signInWithPassword({email,password});

  // Get profile

// Detect user location
async function getUserLocation(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){resolve({lat:0,lon:0});return;}
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude,lon:p.coords.longitude}),
      ()=>resolve({lat:0,lon:0}),
      {timeout:5000}
    );
  });
}

// ── Translation ───────────────────────────────────────────────────────────────
async function translateText(text,targetLang,sourceLang){
  const src=sourceLang?.split("-")[0],tgt=targetLang?.split("-")[0];
  if(!src||!tgt||src===tgt)return null;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:500,
        messages:[{role:"user",content:`Translate to ${tgt}. Return ONLY the translation:\n\n${text}`}]})
    });
    const data=await res.json();
    return data.content?.[0]?.text?.trim()||null;
  }catch{return null;}
}

// ── Player ────────────────────────────────────────────────────────────────────
function Player({duration}){
  const[playing,setPlaying]=useState(false);
  const[cur,setCur]=useState(0);
  const[speed,setSpeed]=useState(1);
  const intRef=useRef(null);
  const barRef=useRef(null);

  useEffect(()=>{
    if(playing){
      intRef.current=setInterval(()=>{
        setCur(s=>{const n=s+speed;if(n>=duration){setPlaying(false);clearInterval(intRef.current);return duration;}return n;});
      },1000);
    }else clearInterval(intRef.current);
    return()=>clearInterval(intRef.current);
  },[playing,speed,duration]);

  const skip=d=>setCur(s=>Math.min(duration,Math.max(0,s+d)));
  const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
  const pct=duration>0?(cur/duration)*100:0;
  const seek=e=>{const r=barRef.current.getBoundingClientRect();setCur(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*duration);};
  const btnS={background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,color:"#999",padding:"4px 6px"};

  return(
    <div style={{background:"#fafafa",borderRadius:12,padding:"12px 14px"}}>
      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:10}}>
        <button onClick={()=>skip(-10)} style={btnS}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
          <span style={{fontSize:8,color:"#bbb"}}>10</span>
        </button>
        <button onClick={()=>setPlaying(p=>!p)} style={{width:40,height:40,borderRadius:"50%",border:"none",cursor:"pointer",background:playing?RAUSCH:"#fff",boxShadow:playing?`0 2px 10px rgba(255,56,92,0.4)`:"0 1px 4px rgba(0,0,0,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,color:playing?"#fff":"#333",transition:"all 0.2s",flexShrink:0}}>
          {playing?"⏸":"▶"}
        </button>
        <button onClick={()=>skip(10)} style={btnS}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-4.5"/></svg>
          <span style={{fontSize:8,color:"#bbb"}}>10</span>
        </button>
        <div style={{display:"flex",alignItems:"center",gap:2,height:24,flex:1,paddingLeft:4}}>
          {[0.6,1,0.8,1.2,0.7,1.1,0.9].map((h,i)=>(
            <div key={i} style={{width:3,borderRadius:2,background:RAUSCH,height:playing?`${h*20}px`:"4px",transition:"height 0.15s ease",animation:playing?`wave ${0.4+i*0.1}s ease-in-out infinite alternate`:"none"}}/>
          ))}
        </div>
        <span style={{fontSize:11,color:"#aaa",flexShrink:0}}>{fmt(cur)}/{fmt(duration)}</span>
        <button onClick={()=>setSpeed(s=>{const i=SPEEDS.indexOf(s);return SPEEDS[(i+1)%SPEEDS.length];})} style={{background:speed!==1?"#fff0f3":"#f0f0f0",border:`1.5px solid ${speed!==1?RAUSCH:"#e8e8e8"}`,borderRadius:6,padding:"3px 7px",cursor:"pointer",fontSize:11,fontWeight:700,color:speed!==1?RAUSCH:"#888",transition:"all 0.15s",flexShrink:0}}>
          {speed===1?"1x":speed===1.5?"1.5x":"2x"}
        </button>
      </div>
      <div ref={barRef} onClick={seek} style={{height:4,background:"#e8e8e8",borderRadius:2,cursor:"pointer",position:"relative"}}>
        <div style={{height:"100%",background:RAUSCH,borderRadius:2,width:`${pct}%`,transition:"width 0.8s linear",pointerEvents:"none"}}/>
        <div style={{position:"absolute",top:"50%",left:`${pct}%`,transform:"translate(-50%,-50%)",width:12,height:12,borderRadius:"50%",background:RAUSCH,opacity:cur>0?1:0,transition:"left 0.8s linear",pointerEvents:"none"}}/>
      </div>
    </div>
  );
}

                      {isFollowing?"Siguiendo":"+ Seguir"}
                    </button>
                  )}
                </div>
                <div style={{fontSize:11,color:"#aaa",marginTop:2}}>
                  {spit.role}{spit.gender&&spit.gender!=="No especifico"?` · ${spit.gender}`:""}{spit.age?` · ${spit.age}a`:""} · {spit.duration}s
                </div>
              </div>
            </div>
            <button onClick={onClose} style={{background:"#f5f5f5",border:"none",borderRadius:"50%",width:30,height:30,cursor:"pointer",fontSize:15,color:"#888",display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
          </div>
          <div style={{height:1,background:"#f5f5f5",marginBottom:14}}/>
          <div style={{marginBottom:14}}>
            {translating?(
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:15,height:15,border:`2px solid ${RAUSCH}`,borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
                <span style={{fontSize:13,color:"#aaa"}}>Traduciendo…</span>
              </div>
            ):(
              <>
                <p style={{fontSize:14,color:"#333",lineHeight:1.65,margin:0}}>{showFull?txt:preview}</p>
                {txt.length>110&&<button onClick={()=>setShowFull(p=>!p)} style={{background:"none",border:"none",color:RAUSCH,fontSize:12,fontWeight:600,cursor:"pointer",padding:0,marginTop:6}}>{showFull?"Ver menos":"Ver todo"}</button>}
                {needsTr&&<div style={{fontSize:11,color:"#ccc",marginTop:6}}>{!translated?`Audio en ${LANG_NAMES[spitLang]||spitLang}`:`Traducido del ${LANG_NAMES[spitLang]||spitLang} · audio en original`}</div>}
              </>
            )}
          </div>
          <div style={{marginBottom:14}}><Player duration={spit.duration}/></div>
          <div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
              <span style={{fontSize:11,color:"#bbb"}}>{total} reacciones</span>
              <span style={{fontSize:11,color:left===0?RAUSCH:"#ccc"}}>{left>0?`podés agregar ${left} más`:"máximo alcanzado"}</span>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {EMOJIS.map(e=>{
                const a=myR.includes(e),dis=!a&&myR.length>=MAX_REACTIONS;
                return<button key={e} onClick={()=>react(e)} style={{background:a?"#fff0f3":"#f7f7f7",border:`1.5px solid ${a?RAUSCH:"#ebebeb"}`,borderRadius:20,padding:"5px 10px",cursor:dis?"not-allowed":"pointer",fontSize:15,display:"flex",alignItems:"center",gap:5,opacity:dis?0.35:1,transition:"all 0.15s",transform:a?"scale(1.05)":"scale(1)"}}>
                  <span>{e}</span><span style={{fontSize:11,fontWeight:600,color:a?RAUSCH:"#aaa"}}>{reactions[e]||0}</span>
                </button>;
              })}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Record Modal ──────────────────────────────────────────────────────────────
function RecordModal({onClose,currentUser}){
  const[recording,setRecording]=useState(false);
  const[seconds,setSeconds]=useState(0);
  const[done,setDone]=useState(false);
  const[saving,setSaving]=useState(false);
  const[error,setError]=useState("");
  const tRef=useRef(null);
  const mediaRef=useRef(null);
  const chunksRef=useRef([]);

  const start=async()=>{
    setError("");
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const mr=new MediaRecorder(stream);
      chunksRef.current=[];
      mr.ondataavailable=e=>chunksRef.current.push(e.data);
      mr.start();
      mediaRef.current=mr;
      setRecording(true);
      tRef.current=setInterval(()=>setSeconds(s=>{
        if(s>=90){stop();return s;}return s+1;
      }),1000);
    }catch(e){setError("No se pudo acceder al micrófono.");}
  };

  const stop=()=>{
    setRecording(false);
    clearInterval(tRef.current);
    if(mediaRef.current&&mediaRef.current.state!=="inactive"){
      mediaRef.current.onstop=()=>{ if(seconds>=3)setDone(true); };
      mediaRef.current.stop();
      mediaRef.current.stream.getTracks().forEach(t=>t.stop());
    } else {
      if(seconds>=3)setDone(true);
    }
  };

  const save=async()=>{
    setSaving(true);
    setError("");
    try{
      const blob=new Blob(chunksRef.current,{type:"audio/webm"});
      const filename=`${currentUser.handle}_${Date.now()}.webm`;
      const audioUrl=await dbUploadAudio(blob,filename);
      const loc=await getUserLocation();
      const lang=(navigator.language||"es").split("-")[0];
      const{error:err}=await dbInsertSpit({
        handle:currentUser.handle,
        role:currentUser.role,
        duration:seconds,
        lang,
        lat:loc.lat||(-34.6+Math.random()*0.1),
        lon:loc.lon||(-58.4+Math.random()*0.1),
        audio_url:audioUrl||"",
        transcript:"",
      });
      if(err){setError("Error al guardar. Intentá de nuevo.");setSaving(false);return;}
      setSaving(false);
      onClose();
    }catch(e){setError("Error al guardar.");setSaving(false);}
  };

  useEffect(()=>()=>{clearInterval(tRef.current);},[]);

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:2000,display:"flex",alignItems:"flex-end",justifyContent:"center",backdropFilter:"blur(4px)"}}>
      <div style={{background:"#fff",borderRadius:"24px 24px 0 0",padding:"8px 28px 40px",width:"100%",maxWidth:480,boxShadow:"0 -8px 40px rgba(0,0,0,0.12)",animation:"slideSheet 0.3s ease"}}>
        <div style={{width:40,height:4,background:"#e0e0e0",borderRadius:2,margin:"12px auto 24px"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
          <div>
            <div style={{fontSize:20,fontWeight:700,color:"#222"}}>Escupí</div>
            <div style={{fontSize:12,color:"#aaa",marginTop:2}}>grabando como {currentUser.handle}</div>
          </div>
          <button onClick={onClose} style={{background:"#f5f5f5",border:"none",borderRadius:"50%",width:32,height:32,cursor:"pointer",fontSize:16,color:"#888"}}>×</button>
        </div>
        {error&&<div style={{fontSize:12,color:RAUSCH,background:"#fff0f3",padding:"8px 12px",borderRadius:8,marginBottom:16}}>{error}</div>}
        {!done?(
          <div style={{textAlign:"center",paddingBottom:8}}>
            <div style={{fontSize:60,fontWeight:700,letterSpacing:-2,color:recording?RAUSCH:"#ddd",marginBottom:4,transition:"color 0.3s"}}>
              {String(Math.floor(seconds/60)).padStart(2,"0")}:{String(seconds%60).padStart(2,"0")}
            </div>
            <div style={{fontSize:12,color:"#bbb",marginBottom:28}}>mín. 3s · máx. 1:30</div>
            <div style={{height:4,background:"#f0f0f0",borderRadius:2,marginBottom:36}}>
              <div style={{height:"100%",background:RAUSCH,borderRadius:2,width:`${(seconds/90)*100}%`,transition:"width 1s linear"}}/>
            </div>
            <button onClick={recording?stop:start} style={{width:80,height:80,borderRadius:"50%",background:recording?RAUSCH:"#fff",border:recording?"none":"2px solid #e8e8e8",cursor:"pointer",fontSize:28,boxShadow:recording?`0 0 0 12px rgba(255,56,92,0.1),0 4px 20px rgba(255,56,92,0.4)`:"0 2px 12px rgba(0,0,0,0.1)",transition:"all 0.3s"}}>
              {recording?"⏹":"🎙"}
            </button>
            <div style={{fontSize:13,color:"#bbb",marginTop:14}}>{recording?"Tocá para terminar":"Tocá para grabar"}</div>
          </div>
        ):(
          <div style={{textAlign:"center",paddingBottom:8}}>
            <div style={{width:64,height:64,borderRadius:"50%",background:"#fff0f3",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,margin:"0 auto 16px"}}>🔥</div>
            <div style={{fontSize:22,fontWeight:700,color:"#222",marginBottom:6}}>¡Escupido!</div>
            <div style={{fontSize:13,color:"#aaa",marginBottom:28}}>{seconds}s · {currentUser.handle} · {currentUser.role}</div>
            <button onClick={save} disabled={saving} style={{width:"100%",padding:16,borderRadius:12,background:saving?"#ffb3c0":RAUSCH,border:"none",color:"#fff",fontSize:15,fontWeight:700,cursor:saving?"not-allowed":"pointer",boxShadow:"0 4px 16px rgba(255,56,92,0.3)"}}>
              {saving?"Guardando...":"Publicar en el mapa 🗺️"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Leaflet Map ───────────────────────────────────────────────────────────────
function WorldMap({spits,onSpitClick,activeSpit}){
  const mapDivRef=useRef(null);
  const mapRef=useRef(null);
  const markersRef=useRef([]);
  const[mapReady,setMapReady]=useState(false);

  // Init Leaflet once
  useEffect(()=>{
    if(mapRef.current||!mapDivRef.current)return;
    const L=window.L;
    if(!L)return;

    const map=L.map(mapDivRef.current,{
      center:[20,10],zoom:2,
      zoomControl:false,
      minZoom:2,maxZoom:16,
    });

    // OpenStreetMap tiles - free, no key needed
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'© OpenStreetMap',
      maxZoom:19,
    }).addTo(map);

    L.control.zoom({position:'bottomright'}).addTo(map);
    mapRef.current=map;
    setMapReady(true);

    return()=>{
      map.remove();
      mapRef.current=null;
    };
  },[]);

  // Update markers when spits or activeSpit changes
  useEffect(()=>{
    const L=window.L;
    const map=mapRef.current;
    if(!map||!L||!mapReady)return;

    // Remove old markers
    markersRef.current.forEach(m=>m.remove());
    markersRef.current=[];

    spits.forEach(spit=>{
      if(!spit.lat||!spit.lon)return;
      const isActive=activeSpit?.id===spit.id;
      const size=isActive?20:14;
      const icon=L.divIcon({
        html:`<div style="
          width:${size}px;height:${size}px;border-radius:50%;
          background:${RAUSCH};
          border:${isActive?'3px':'2px'} solid #fff;
          box-shadow:0 0 0 ${isActive?5:3}px rgba(255,56,92,${isActive?0.3:0.15}),0 2px 8px rgba(255,56,92,0.5);
          animation:hbDot 1.6s ease-in-out infinite;
          cursor:pointer;
        "></div>`,
        className:'',
        iconSize:[size,size],
        iconAnchor:[size/2,size/2],
      });

      const marker=L.marker([spit.lat,spit.lon],{icon});
      marker.on('click',e=>{
        L.DomEvent.stopPropagation(e);
        onSpitClick([spit]);
      });
      marker.addTo(map);
      markersRef.current.push(marker);
    });
  },[mapReady,spits,activeSpit]);

  return(
    <div style={{width:'100%',height:'100%',position:'relative'}}>
      <div ref={mapDivRef} style={{width:'100%',height:'100%'}}/>
      <style>{`
        .leaflet-container{background:#1a1a2e}
        @keyframes hbDot{
          0%,100%{box-shadow:0 0 0 3px rgba(255,56,92,0.15),0 1px 6px rgba(255,56,92,0.4)}
          14%{box-shadow:0 0 0 7px rgba(255,56,92,0.25),0 1px 10px rgba(255,56,92,0.6)}
          42%{box-shadow:0 0 0 5px rgba(255,56,92,0.2),0 1px 8px rgba(255,56,92,0.5)}
        }
      `}</style>
    </div>
  );
}

// ── Map View ──────────────────────────────────────────────────────────────────
function MapView({currentUser,onLogout}){
  const[activeSpit,setActiveSpit]=useState(null);
  const[clusterList,setClusterList]=useState(null); // list of spits in a cluster
  const[showRecord,setShowRecord]=useState(false);
  const[following,setFollowing]=useState([]);
  const[showFollowingOnly,setShowFollowingOnly]=useState(false);
  const[spits,setSpits]=useState([]);
  const[loading,setLoading]=useState(true);

  const hour=new Date().getHours();
  const isDay=hour>=6&&hour<20;
  const hBg=isDay?"rgba(255,255,255,0.88)":"rgba(10,16,28,0.85)";
  const hBorder=isDay?"rgba(0,0,0,0.06)":"rgba(255,255,255,0.06)";
  const hText=isDay?"#222":"#fff";
  const hMuted=isDay?"rgba(0,0,0,0.4)":"rgba(255,255,255,0.3)";
  const hPill=isDay?"rgba(0,0,0,0.07)":"rgba(255,255,255,0.08)";
  const hPillText=isDay?"rgba(0,0,0,0.6)":"rgba(255,255,255,0.7)";
  const counterBg=isDay?"rgba(255,255,255,0.85)":"rgba(10,16,28,0.75)";
  const counterText=isDay?"rgba(0,0,0,0.4)":"rgba(255,255,255,0.5)";
  const counterBorder=isDay?"rgba(0,0,0,0.06)":"rgba(255,255,255,0.06)";

  // Load spits from Supabase
  const loadSpits=async()=>{
    const data=await dbGetSpits();
    setSpits(data.map(s=>({...s,reactions:{}})));
    setLoading(false);
  };
  useEffect(()=>{loadSpits();},[]);

  // Realtime subscription
  useEffect(()=>{
    const channel=sb.channel("spits-changes")
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"spits"},payload=>{
        setSpits(prev=>[{...payload.new,reactions:{}}, ...prev]);
      }).subscribe();
    return()=>sb.removeChannel(channel);
  },[]);

  const visibleSpits=showFollowingOnly?spits.filter(s=>following.includes(s.handle)):spits;
  const toggleFollow=h=>setFollowing(p=>p.includes(h)?p.filter(x=>x!==h):[...p,h]);

  const handleSpitClick=(group)=>{
    if(!group||group.length===0)return;
    if(group.length===1){
      setActiveSpit(group[0]);
      setClusterList(null);
    } else {
      setClusterList(group);
      setActiveSpit(null);
    }
  };

  return(
    <div style={{width:"100vw",height:"100vh",position:"relative",overflow:"hidden"}}>
      <WorldMap spits={visibleSpits} onSpitClick={handleSpitClick} activeSpit={activeSpit} following={following}/>

      {/* Header */}
      <div style={{position:"absolute",top:0,left:0,right:0,zIndex:500,background:hBg,backdropFilter:"blur(16px)",borderBottom:`1px solid ${hBorder}`,padding:"0 20px",height:58,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{fontSize:20,fontWeight:800,letterSpacing:-0.8}}>
          <span style={{color:RAUSCH}}>air</span><span style={{color:hText}}>spit</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {following.length>0&&(
            <button onClick={()=>setShowFollowingOnly(p=>!p)} style={{padding:"6px 14px",borderRadius:20,fontSize:12,fontWeight:600,cursor:"pointer",background:showFollowingOnly?RAUSCH:hPill,border:`1.5px solid ${showFollowingOnly?RAUSCH:hBorder}`,color:showFollowingOnly?"#fff":hText,transition:"all 0.2s"}}>
              Siguiendo ({following.length})
            </button>
          )}
          <div style={{fontSize:13,fontWeight:600,color:hPillText,background:hPill,padding:"6px 12px",borderRadius:20}}>{currentUser.handle}</div>
          <button onClick={onLogout} style={{background:"none",border:"none",fontSize:12,color:hMuted,cursor:"pointer"}}>Salir</button>
        </div>
      </div>

      {/* Escupir */}
      <button onClick={()=>setShowRecord(true)} style={{position:"absolute",bottom:40,right:24,zIndex:500,background:RAUSCH,border:"none",color:"#fff",padding:"14px 22px",borderRadius:50,fontSize:14,fontWeight:700,cursor:"pointer",boxShadow:"0 4px 24px rgba(255,56,92,0.5)",display:"flex",alignItems:"center",gap:8,transition:"transform 0.15s"}}
        onMouseOver={e=>e.currentTarget.style.transform="scale(1.04)"}
        onMouseOut={e=>e.currentTarget.style.transform="scale(1)"}>
        🎙 Escupir
      </button>

      {/* Counter */}
      <div style={{position:"absolute",bottom:40,left:"50%",transform:"translateX(-50%)",background:counterBg,backdropFilter:"blur(8px)",borderRadius:20,padding:"8px 16px",fontSize:12,color:counterText,zIndex:500,display:"flex",alignItems:"center",gap:6,border:`1px solid ${counterBorder}`}}>
        <span style={{color:RAUSCH,fontSize:8}}>●</span>
        {visibleSpits.length} spits · arrastrá para navegar · scroll para zoom
      </div>

      {activeSpit&&<SpitCard spit={activeSpit} onClose={()=>setActiveSpit(null)} following={following} onFollowToggle={toggleFollow} currentUser={currentUser}/>}
      {clusterList&&(
        <div style={{position:"fixed",bottom:0,left:0,right:0,display:"flex",justifyContent:"center",zIndex:1000,animation:"slideSheet 0.3s ease"}}>
          <div style={{width:"100%",maxWidth:480,background:"#fff",borderRadius:"20px 20px 0 0",boxShadow:"0 -8px 40px rgba(0,0,0,0.12)",maxHeight:"60vh",overflow:"hidden",display:"flex",flexDirection:"column"}}>
            <div style={{height:3,background:`linear-gradient(90deg,${RAUSCH},#ff7a8a)`}}/>
            <div style={{width:40,height:4,background:"#e0e0e0",borderRadius:2,margin:"12px auto 0"}}/>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 20px 8px"}}>
              <span style={{fontSize:15,fontWeight:700,color:"#222"}}>{clusterList.length} spits en esta zona</span>
              <button onClick={()=>setClusterList(null)} style={{background:"#f5f5f5",border:"none",borderRadius:"50%",width:28,height:28,cursor:"pointer",fontSize:14,color:"#888"}}>×</button>
            </div>
            <div style={{overflowY:"auto",padding:"0 16px 24px"}}>
              {clusterList.map(s=>(
                <div key={s.id} onClick={()=>{setActiveSpit(s);setClusterList(null);}}
                  style={{display:"flex",alignItems:"center",gap:12,padding:"12px 4px",borderBottom:"1px solid #f5f5f5",cursor:"pointer"}}>
                  <div style={{width:36,height:36,borderRadius:"50%",background:"#f5f5f5",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>
                    {s.role==="Anfitrión"?"🏠":s.role==="Huésped"?"🧳":"🗂️"}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600,color:"#222"}}>{s.handle}</div>
                    <div style={{fontSize:11,color:"#aaa"}}>{s.role} · {s.duration}s</div>
                  </div>
                  <div style={{fontSize:11,color:RAUSCH,fontWeight:600}}>▶</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
      {showRecord&&<RecordModal onClose={()=>setShowRecord(false)} currentUser={currentUser}/>}
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[checking,setChecking]=useState(true);

  // Restore session on load
  useEffect(()=>{
    dbGetSession().then(profile=>{
      if(profile) setUser({email:profile.email,handle:profile.handle,role:profile.role});
      setChecking(false);
    });
    // Listen for auth changes
    const{data:{subscription}}=sb.auth.onAuthStateChange(async(event,session)=>{
      if(event==="SIGNED_OUT") setUser(null);
    });
    return()=>subscription.unsubscribe();
  },[]);

  const handleLogout=async()=>{
    await dbLogout();
    setUser(null);
  };

  if(checking) return(
    <div style={{minHeight:"100vh",background:"#fff",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:28,fontWeight:800,letterSpacing:-1,marginBottom:16}}>
          <span style={{color:"#FF385C"}}>air</span><span style={{color:"#222"}}>spit</span>
        </div>
        <div style={{width:32,height:32,border:"3px solid #FF385C",borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite",margin:"0 auto"}}/>
      </div>
    </div>
  );

  return user
    ?<MapView currentUser={user} onLogout={handleLogout}/>
    :<AuthScreen onLogin={setUser}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
