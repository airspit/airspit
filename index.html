async function dbRegister(email,password,handle,role){
  const{data:a,error:e}=await sb.auth.signUp({email,password});
  if(e)return{error:e.message};
  await sb.from("users").insert([{email,handle,role,auth_id:a.user?.id}]);
  return{ok:true};
}
async function dbLogin(email,password){
  const{data:a,error:e}=await sb.auth.signInWithPassword({email,password});
  if(e)return{error:"Email o contraseña incorrectos."};
  const{data:u}=await sb.from("users").select("handle,role,roles,auth_id,email,country,bio,handle_changed_at").eq("email",email).single();
  return{data:u};
}
async function dbGetSession(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return null;
  const{data}=await sb.from("users").select("handle,role,roles,auth_id,email,country,bio,handle_changed_at").eq("auth_id",session.user.id).single();
  return data||null;
}
async function dbGetSpits(){
  const{data}=await sb.from("spits").select("*").order("created_at",{ascending:false});
  return(data||[]).map(s=>({...s,reactions:{}}));
}
async function dbInsertSpit(spit){
  const{data,error}=await sb.from("spits").insert([spit]).select().single();
  return{data,error};
}
async function dbUploadAudio(blob,filename){
  const{error}=await sb.storage.from("audios").upload(filename,blob,{contentType:"audio/webm",upsert:true});
  if(error)return null;
  const{data}=sb.storage.from("audios").getPublicUrl(filename);
  return data.publicUrl;
}
async function translateText(text,targetLang,sourceLang){
  const src=sourceLang?.split("-")[0],tgt=targetLang?.split("-")[0];
  if(!src||!tgt||src===tgt)return null;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:500,
        messages:[{role:"user",content:`Translate to ${tgt}. Return ONLY the translation:\n\n${text}`}]})
    });
    const d=await res.json();
    return d.content?.[0]?.text?.trim()||null;
  }catch{return null;}
}

                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>

          </div>
          {mode==="login"&&(

function ListenMode({spits,startIndex,onClose,currentUser,following,onFollowToggle}){
  const[idx,setIdx]=useState(startIndex||0);
  const[animating,setAnimating]=useState(false);
  const[direction,setDirection]=useState(null);
  const[hearts,setHearts]=useState([]);
  const[liked,setLiked]=useState({});
  const[lastTap,setLastTap]=useState(0);
  const[playing,setPlaying]=useState(true);
  const[progress,setProgress]=useState(0);
  const[duration,setDuration]=useState(0);
  const audioRef=useRef(null);
  const progressRef=useRef(null);
  const touchStartY=useRef(null);
  const touchStartX=useRef(null);

  const spit=spits[idx];

  // Emotion-based background colors
  const emotionBg={
    "😤":{from:"#2d0a0a",to:"#5c1a1a",accent:"#FF385C"},
    "😊":{from:"#0a2d1a",to:"#1a5c30",accent:"#00A699"},
    "😐":{from:"#1a1a2d",to:"#2d2d4a",accent:"#8888cc"},
  };
  const catBg={
    verdad:{from:"#2d1a0a",to:"#5c3010",accent:"#FC642D"},
    bronca:{from:"#2d0a0a",to:"#5c1a1a",accent:"#FF385C"},
    sentimiento:{from:"#2d0a1a",to:"#5c1030",accent:"#e84393"},
    historia:{from:"#1a2d0a",to:"#305c10",accent:"#7ec850"},
    momento:{from:"#1a1a0a",to:"#3a3a10",accent:"#f0c030"},
  };
  const theme=(spit?.emotion&&emotionBg[spit.emotion])||
              (spit?.category&&catBg[spit.category])||
              {from:"#0a0a0a",to:"#1a1a2d",accent:"#FF385C"};

  // Auto-play
  useEffect(()=>{
    if(audioRef.current){audioRef.current.pause();audioRef.current=null;}
    setProgress(0);setDuration(0);setPlaying(true);
    if(!spit?.audio_url)return;
    const a=new Audio(spit.audio_url);
    a.onloadedmetadata=()=>{if(isFinite(a.duration))setDuration(Math.round(a.duration));};
    a.ontimeupdate=()=>{setProgress(a.currentTime);};
    a.onended=()=>{setPlaying(false);if(idx<spits.length-1)setTimeout(()=>goTo(idx+1,"up"),800);};
    a.play().catch(()=>setPlaying(false));
    audioRef.current=a;
    return()=>{if(audioRef.current){audioRef.current.pause();audioRef.current=null;}};
  },[idx]);

  useEffect(()=>{
    if(!audioRef.current)return;
    if(playing)audioRef.current.play().catch(()=>{});
    else audioRef.current.pause();
  },[playing]);

  const goTo=(newIdx,dir)=>{
    if(animating||newIdx<0||newIdx>=spits.length)return;
    setDirection(dir);setAnimating(true);
    setTimeout(()=>{setIdx(newIdx);setDirection(null);setAnimating(false);},350);
  };

  const next=()=>goTo(idx+1,"up");
  const prev=()=>goTo(idx-1,"down");

  const doLike=async(x,y)=>{
    const id=Date.now();
    setHearts(h=>[...h,{id,x:x||window.innerWidth/2,y:y||window.innerHeight/2}]);
    setTimeout(()=>setHearts(h=>h.filter(hh=>hh.id!==id)),1000);
    if(!liked[spit.id]){
      setLiked(p=>({...p,[spit.id]:true}));
      try{await sb.from("reactions").insert([{spit_id:spit.id,handle:currentUser.handle,emoji:"❤️"}]);}catch{}
      if(spit.handle&&spit.handle!==currentUser.handle)
        try{await sb.from("notifications").insert({to_handle:spit.handle,from_handle:currentUser.handle,type:"like",spit_id:spit.id});}catch{}
    }
  };

  const handleTap=async(e)=>{
    const now=Date.now();
    if(now-lastTap<300)doLike(e.clientX||e.touches?.[0]?.clientX,e.clientY||e.touches?.[0]?.clientY);
    setLastTap(now);
  };

  const onTouchStart=e=>{touchStartY.current=e.touches[0].clientY;touchStartX.current=e.touches[0].clientX;};
  const onTouchEnd=e=>{
    if(touchStartY.current===null)return;
    const dy=touchStartY.current-e.changedTouches[0].clientY;
    const dx=Math.abs(touchStartX.current-e.changedTouches[0].clientX);
    if(Math.abs(dy)>50&&dx<80){dy>0?next():prev();}
    touchStartY.current=null;
  };

  useEffect(()=>{
    const k=e=>{if(e.key==="ArrowUp")next();if(e.key==="ArrowDown")prev();if(e.key==="Escape")onClose();if(e.key===" ")setPlaying(p=>!p);};
    window.addEventListener("keydown",k);
    return()=>window.removeEventListener("keydown",k);
  },[idx,animating]);

  if(!spit)return null;
  const isFollowing=following?.includes(spit.handle);
  const pct=duration>0?(progress/duration)*100:0;
  const fmt=s=>isFinite(s)&&s>=0?`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`:"0:00";
  const CATS_L={verdad:"🔥 Verdad",bronca:"😤 Bronca",sentimiento:"❤️ Sentimiento",historia:"😂 Historia",momento:"⚡ Momento"};

  return(
    <div style={{
      position:"fixed",inset:0,zIndex:1000,overflow:"hidden",userSelect:"none",
      background:`linear-gradient(160deg, ${theme.from} 0%, ${theme.to} 100%)`,
      transition:"background 0.8s ease",
      display:"flex",flexDirection:"column",
    }}
      onTouchStart={onTouchStart} onTouchEnd={onTouchEnd} onClick={handleTap}>

      {/* Top bar */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"52px 24px 0",zIndex:10}}>
        <button onClick={e=>{e.stopPropagation();onClose();}} style={{background:"rgba(255,255,255,0.1)",border:"none",borderRadius:20,padding:"8px 16px",color:"rgba(255,255,255,0.8)",cursor:"pointer",fontSize:13,fontWeight:600,backdropFilter:"blur(8px)"}}>
          ✕
        </button>
        <div style={{fontSize:12,color:"rgba(255,255,255,0.35)",letterSpacing:1}}>{idx+1} / {spits.length}</div>
        {spit.handle!==currentUser?.handle?(
          <button onClick={e=>{e.stopPropagation();onFollowToggle(spit.handle);}} style={{
            background:isFollowing?"rgba(255,255,255,0.08)":"rgba(255,255,255,0.18)",
            border:`1px solid ${isFollowing?"rgba(255,255,255,0.15)":"rgba(255,255,255,0.35)"}`,
            borderRadius:20,padding:"8px 16px",color:"#fff",cursor:"pointer",fontSize:12,fontWeight:600,backdropFilter:"blur(8px)"
          }}>{isFollowing?"Siguiendo":"+ Seguir"}</button>
        ):<div style={{width:80}}/>}
      </div>

      {/* Main content */}
      <div style={{
        flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
        padding:"0 32px",
        transform:animating?(direction==="up"?"translateY(-30px)":"translateY(30px)"):"translateY(0)",
        opacity:animating?0:1,

function Player({duration,audioUrl}){
  const[playing,setPlaying]=useState(false);
  const[cur,setCur]=useState(0);
  const[speed,setSpeed]=useState(1);
  const[loaded,setLoaded]=useState(false);
  const[realDur,setRealDur]=useState(duration||30);
  const audioRef=useRef(null);
  const intRef=useRef(null);
  const barRef=useRef(null);

  useEffect(()=>{
    if(audioRef.current){audioRef.current.pause();audioRef.current.src="";}
    setPlaying(false);setCur(0);setLoaded(false);setRealDur(duration||30);
    if(!audioUrl)return;
    const a=new Audio();
    a.preload="metadata";
    a.src=audioUrl;
    a.onloadedmetadata=()=>{if(a.duration&&!isNaN(a.duration)&&isFinite(a.duration))setRealDur(Math.round(a.duration));setLoaded(true);};
    a.oncanplay=()=>setLoaded(true);
    a.onended=()=>{setPlaying(false);setCur(0);};
    a.onerror=()=>{console.error("Audio error",a.error);setLoaded(false);};
    audioRef.current=a;
    return()=>{a.pause();a.src="";};
  },[audioUrl]);

  useEffect(()=>{
    const a=audioRef.current;
    if(!a)return;
    if(playing){
      a.playbackRate=speed;
      a.play().catch(()=>setPlaying(false));
      intRef.current=setInterval(()=>{setCur(a.currentTime||0);if(a.ended){setPlaying(false);setCur(0);}},250);
    }else{
      a.pause();
      clearInterval(intRef.current);
    }
    return()=>clearInterval(intRef.current);
  },[playing,speed]);

  const skip=d=>{const a=audioRef.current;const t=Math.min(realDur,Math.max(0,cur+d));setCur(t);if(a)a.currentTime=t;};
  const fmt=s=>(!s||!isFinite(s)||isNaN(s))?"0:00":`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
  const pct=realDur>0?(cur/realDur)*100:0;
  const seek=e=>{const r=barRef.current.getBoundingClientRect();const t=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*realDur;setCur(t);if(audioRef.current)audioRef.current.currentTime=t;};
  const canPlay=!audioUrl||(audioUrl&&loaded);
  const btnS={background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,color:"#999",padding:"4px 6px"};

  return(
    <div style={{background:"#fafafa",borderRadius:12,padding:"12px 14px"}}>
      {audioUrl&&!loaded&&<div style={{fontSize:11,color:"#bbb",textAlign:"center",marginBottom:8}}>Cargando audio…</div>}
      {!audioUrl&&<div style={{fontSize:11,color:"#bbb",textAlign:"center",marginBottom:8}}>Audio no disponible</div>}
      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:10}}>
        <button onClick={()=>skip(-10)} style={btnS}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
          <span style={{fontSize:8,color:"#bbb"}}>10</span>
        </button>
        <button onClick={()=>canPlay&&setPlaying(p=>!p)} style={{width:40,height:40,borderRadius:"50%",border:"none",cursor:canPlay?"pointer":"not-allowed",background:playing?RAUSCH:"#fff",boxShadow:playing?`0 2px 10px rgba(255,56,92,0.4)`:"0 1px 4px rgba(0,0,0,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,color:playing?"#fff":"#333",transition:"all 0.2s",flexShrink:0,opacity:canPlay?1:0.5}}>
          {playing?"⏸":"▶"}
        </button>
        <button onClick={()=>skip(10)} style={btnS}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-4.5"/></svg>
          <span style={{fontSize:8,color:"#bbb"}}>10</span>
        </button>
        <div style={{display:"flex",alignItems:"center",gap:2,height:24,flex:1}}>
          {[0.6,1,0.8,1.2,0.7,1.1,0.9].map((h,i)=>(
            <div key={i} style={{width:3,borderRadius:2,background:RAUSCH,height:playing?`${h*20}px`:"4px",transition:"height 0.15s ease",animation:playing?`wave ${0.4+i*0.1}s ease-in-out infinite alternate`:"none"}}/>
          ))}
        </div>
        <span style={{fontSize:11,color:"#aaa",flexShrink:0}}>{fmt(cur)}/{fmt(realDur)}</span>
        <button onClick={()=>setSpeed(s=>{const i=SPEEDS.indexOf(s);return SPEEDS[(i+1)%SPEEDS.length];})} style={{background:speed!==1?"#fff0f3":"#f0f0f0",border:`1.5px solid ${speed!==1?RAUSCH:"#e8e8e8"}`,borderRadius:6,padding:"3px 7px",cursor:"pointer",fontSize:11,fontWeight:700,color:speed!==1?RAUSCH:"#888",flexShrink:0}}>
          {speed===1?"1x":speed===1.5?"1.5x":"2x"}
        </button>
      </div>
      <div ref={barRef} onClick={seek} style={{height:4,background:"#e8e8e8",borderRadius:2,cursor:"pointer",position:"relative"}}>
        <div style={{height:"100%",background:RAUSCH,borderRadius:2,width:`${pct}%`,pointerEvents:"none"}}/>
        <div style={{position:"absolute",top:"50%",left:`${pct}%`,transform:"translate(-50%,-50%)",width:12,height:12,borderRadius:"50%",background:RAUSCH,opacity:cur>0?1:0,pointerEvents:"none"}}/>
      </div>
    </div>
  );
}

// ── SpitCard ──────────────────────────────────────────────────────────────────
function SpitCard({spit,onClose,following,onFollowToggle,currentUser}){
  const[myR,setMyR]=useState([]);
  const[reactions,setReactions]=useState({});
  const[translated,setTranslated]=useState(null);
  const[translating,setTranslating]=useState(false);
  const[showFull,setShowFull]=useState(false);
  const userLang=(navigator.language||"es").split("-")[0];
  const spitLang=spit.lang||"es";
  const needsTr=spitLang!==userLang;
  const isFollowing=following&&following.includes(spit.handle);

  // Load reactions from Supabase
  useEffect(()=>{
    setTranslated(null);setTranslating(false);setShowFull(false);setMyR([]);setReactions({});
    // Load all reactions for this spit
    sb.from("reactions").select("emoji,handle").eq("spit_id",spit.id).then(({data})=>{
      if(!data)return;
      const counts={};
      const mine=[];
      data.forEach(r=>{
        counts[r.emoji]=(counts[r.emoji]||0)+1;
        if(r.handle===currentUser?.handle)mine.push(r.emoji);
      });
      setReactions(counts);
      setMyR(mine);
    });
    if(needsTr&&spit.transcript){
      setTranslating(true);
      translateText(spit.transcript||spit.text||"",userLang,spitLang).then(t=>{setTranslated(t);setTranslating(false);});
    }
  },[spit.id]);

  const react=async(emoji)=>{
    const has=myR.includes(emoji);
    if(has){
      setMyR(r=>r.filter(e=>e!==emoji));
      setReactions(p=>({...p,[emoji]:Math.max(0,(p[emoji]||0)-1)}));
      await sb.from("reactions").delete().eq("spit_id",spit.id).eq("handle",currentUser.handle).eq("emoji",emoji);
    }else{
      if(myR.length>=MAX_REACTIONS)return;
      setMyR(r=>[...r,emoji]);
      setReactions(p=>({...p,[emoji]:(p[emoji]||0)+1}));
      await sb.from("reactions").insert([{spit_id:spit.id,handle:currentUser.handle,emoji}]);
    }
  };

  const txt=needsTr?(translated||(spit.transcript||"")):( spit.transcript||spit.text||"");
  const preview=txt.length>110?txt.slice(0,110)+"…":txt;
  const total=Object.values(reactions).reduce((a,b)=>a+b,0);
  const left=MAX_REACTIONS-myR.length;
  const icon="🙋";

  return(
    <div style={{position:"absolute",bottom:16,left:"50%",transform:"translateX(-50%)",width:"min(460px,92vw)",background:"#fff",borderRadius:16,boxShadow:"0 8px 40px rgba(0,0,0,0.12)",zIndex:100,animation:"slideUp 0.25s ease",overflow:"hidden"}}>
      <div style={{height:3,background:`linear-gradient(90deg,${RAUSCH},#ff7a8a)`}}/>
      <div style={{padding:"18px 20px 20px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:40,height:40,borderRadius:"50%",background:"#f5f5f5",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{icon}</div>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <span style={{fontSize:14,fontWeight:700,color:"#222"}}>{spit.handle||"@anónimo"}</span>
                  {VERIFIED.includes(spit.handle)&&<VerifiedBadge/>}
                {spit.handle&&spit.handle!==currentUser?.handle&&onFollowToggle&&(
                  <button onClick={()=>onFollowToggle(spit.handle)} style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:600,cursor:"pointer",background:isFollowing?"#fff":RAUSCH,border:`1.5px solid ${isFollowing?"#e0e0e0":RAUSCH}`,color:isFollowing?"#888":"#fff",transition:"all 0.2s"}}>
                    {isFollowing?"Siguiendo":"+ Seguir"}
                  </button>
                )}
              </div>
              <div style={{fontSize:11,color:"#aaa",marginTop:2}}>{spit.role}{spit.gender&&spit.gender!=="No especifico"?` · ${spit.gender}`:""}{spit.age?` · ${spit.age}a`:""} · {spit.duration}s</div>
            </div>
          </div>
          <button onClick={onClose} style={{background:"#f5f5f5",border:"none",borderRadius:"50%",width:30,height:30,cursor:"pointer",fontSize:15,color:"#888",display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
        </div>
        <div style={{height:1,background:"#f5f5f5",marginBottom:12}}/>
        <div style={{marginBottom:14}}>
          {translating?(
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:15,height:15,border:`2px solid ${RAUSCH}`,borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
              <span style={{fontSize:13,color:"#aaa"}}>Traduciendo…</span>
            </div>
          ):(
            <>
              {txt?(
                <>
                  <p style={{fontSize:14,color:"#333",lineHeight:1.65,margin:0}}>{showFull?txt:preview}</p>
                  {txt.length>110&&<button onClick={()=>setShowFull(p=>!p)} style={{background:"none",border:"none",color:RAUSCH,fontSize:12,fontWeight:600,cursor:"pointer",padding:0,marginTop:6}}>{showFull?"Ver menos":"Ver todo"}</button>}
                </>
              ):(
                <p style={{fontSize:13,color:"#bbb",fontStyle:"italic"}}>Audio sin transcripción</p>
              )}
              {needsTr&&translated&&<div style={{fontSize:11,color:"#ccc",marginTop:6}}>Traducido del {LANG_NAMES[spitLang]||spitLang}</div>}
            </>
          )}
        </div>
        <div style={{marginBottom:14}}><Player duration={spit.duration||30} audioUrl={spit.audio_url}/></div>
        <div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <span style={{fontSize:11,color:"#bbb"}}>{total} reacciones</span>
            <span style={{fontSize:11,color:left===0?RAUSCH:"#ccc"}}>{left>0?`podés agregar ${left} más`:"máximo alcanzado"}</span>
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {EMOJIS.map(e=>{
              const a=myR.includes(e),dis=!a&&myR.length>=MAX_REACTIONS;
              return<button key={e} onClick={()=>react(e)} style={{background:a?"#fff0f3":"#f7f7f7",border:`1.5px solid ${a?RAUSCH:"#ebebeb"}`,borderRadius:20,padding:"5px 10px",cursor:dis?"not-allowed":"pointer",fontSize:15,display:"flex",alignItems:"center",gap:5,opacity:dis?0.35:1,transition:"all 0.15s",transform:a?"scale(1.05)":"scale(1)"}}>
                <span>{e}</span><span style={{fontSize:11,fontWeight:600,color:a?RAUSCH:"#aaa"}}>{reactions[e]||0}</span>
              </button>;
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Record Modal ──────────────────────────────────────────────────────────────
function RecordModal({onClose,currentUser,onSaved}){
  const[recording,setRecording]=useState(false);
  const[seconds,setSeconds]=useState(0);
  const[done,setDone]=useState(false);
  const[saving,setSaving]=useState(false);
  const[error,setError]=useState("");
  const[effect,setEffect]=useState("normal");
  const[spitRole,setSpitRole]=useState("");
  const[emotion,setEmotion]=useState("");
  const[category,setCategory]=useState("");
  const[threadId,setThreadId]=useState(null);
  const[isMundial,setIsMundial]=useState(false);
  const[threadOrder,setThreadOrder]=useState(1);
  const[showThreadPicker,setShowThreadPicker]=useState(false);
  const[mySpitsForThread,setMySpitsForThread]=useState([]);
  const[city,setCity]=useState("");
  const[previewing,setPreviewing]=useState(false);
  const tRef=useRef(null);
  const mrRef=useRef(null);
  const chunksRef=useRef([]);
  const audioCtxRef=useRef(null);
  const sourceRef=useRef(null);

  const EFFECTS={
    normal:{label:"Normal",emoji:"🎙",desc:"Tu voz tal cual",rate:1,pitch:1},
    ardilla:{label:"Ardilla",emoji:"🐿️",desc:"Aguda y divertida",rate:1.4,pitch:1.4},
    sombra:{label:"Sombra",emoji:"👤",desc:"Grave y anónima",rate:0.8,pitch:0.7},
  };

  const start=async()=>{
    setError("");
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      // Use format compatible with all browsers
      const mimeType=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
        ?"audio/webm;codecs=opus"
        :MediaRecorder.isTypeSupported("audio/mp4")
        ?"audio/mp4"
        :"audio/webm";
      const mr=new MediaRecorder(stream,{mimeType});
      chunksRef.current=[];
      mr.ondataavailable=e=>{if(e.data&&e.data.size>0)chunksRef.current.push(e.data);};
      mr.start(1000); // collect data every 1 second
      mrRef.current=mr;
      setRecording(true);
      tRef.current=setInterval(()=>setSeconds(s=>{if(s>=60){stop();return s;}return s+1;}),1000);
    }catch(e){setError("No se pudo acceder al micrófono.");}
  };

  const stop=()=>{
    setRecording(false);
    clearInterval(tRef.current);
    if(mrRef.current&&mrRef.current.state!=="inactive"){
      mrRef.current.onstop=()=>{
        if(seconds>=3)setDone(true);
      };
      // Request final data chunk before stopping
      mrRef.current.requestData();
      mrRef.current.stop();
      mrRef.current.stream.getTracks().forEach(t=>t.stop());
    }else if(seconds>=3)setDone(true);
  };

  const stopPreview=()=>{
    if(sourceRef.current){
      try{sourceRef.current.stop();}catch(e){}
    }
    if(audioCtxRef.current){try{audioCtxRef.current.close();}catch(e){}}
    sourceRef.current=null;
    audioCtxRef.current=null;
    setPreviewing(false);
  };

  const preview=async()=>{
    stopPreview();
    try{
      const mimeType=chunksRef.current[0]?.type||"audio/webm";
      const blob=new Blob(chunksRef.current,{type:mimeType});

      // For Normal effect — use simple Audio element (works on iOS)
      if(effect==="normal"){
        const url=URL.createObjectURL(blob);
        const audio=new Audio(url);
        audio.onended=()=>{setPreviewing(false);URL.revokeObjectURL(url);};
        audio.onerror=()=>{setPreviewing(false);setError("No se pudo previsualizar.");};
        await audio.play();
        sourceRef.current={stop:()=>{audio.pause();URL.revokeObjectURL(url);}};
        setPreviewing(true);
        return;
      }

      // For Ardilla/Sombra — use AudioContext with playbackRate
      const arrayBuf=await blob.arrayBuffer();
      const ctx=new (window.AudioContext||window.webkitAudioContext)();
      audioCtxRef.current=ctx;
      const decoded=await ctx.decodeAudioData(arrayBuf);
      const source=ctx.createBufferSource();
      source.buffer=decoded;
      const cfg=EFFECTS[effect];
      source.playbackRate.value=cfg.rate;
      source.connect(ctx.destination);
      source.start();
      sourceRef.current=source;
      setPreviewing(true);
      source.onended=()=>{setPreviewing(false);};
    }catch(e){setError("No se pudo previsualizar el audio.");}
  };

  // Apply effect to blob before upload
  const applyEffectAndGetBlob=async()=>{
    const cfg=EFFECTS[effect];
    if(cfg.rate===1) return new Blob(chunksRef.current,{type:"audio/webm"});
    try{
      const blob=new Blob(chunksRef.current,{type:"audio/webm"});
      const arrayBuf=await blob.arrayBuffer();
      const ctx=new OfflineAudioContext(2,44100*seconds*2,44100);
      const decoded=await new AudioContext().decodeAudioData(arrayBuf);
      const source=ctx.createBufferSource();
      source.buffer=decoded;
      source.playbackRate.value=cfg.rate;
      source.connect(ctx.destination);
      source.start();
      const rendered=await ctx.startRendering();
      // Convert to wav blob
      const wavBlob=audioBufferToWav(rendered);
      return wavBlob;
    }catch(e){
      return new Blob(chunksRef.current,{type:"audio/webm"});
    }
  };

  // Simple AudioBuffer to WAV converter
  const audioBufferToWav=(buffer)=>{
    const ch=buffer.numberOfChannels;
    const len=buffer.length;
    const rate=buffer.sampleRate;
    const arrayBuf=new ArrayBuffer(44+len*ch*2);
    const view=new DataView(arrayBuf);
    const writeStr=(o,s)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};
    writeStr(0,"RIFF");view.setUint32(4,36+len*ch*2,true);writeStr(8,"WAVE");
    writeStr(12,"fmt ");view.setUint32(16,16,true);view.setUint16(20,1,true);
    view.setUint16(22,ch,true);view.setUint32(24,rate,true);
    view.setUint32(28,rate*ch*2,true);view.setUint16(32,ch*2,true);
    view.setUint16(34,16,true);writeStr(36,"data");view.setUint32(40,len*ch*2,true);
    let offset=44;
    for(let i=0;i<len;i++){for(let c=0;c<ch;c++){
      const s=Math.max(-1,Math.min(1,buffer.getChannelData(c)[i]));
      view.setInt16(offset,s<0?s*0x8000:s*0x7FFF,true);offset+=2;
    }}
    return new Blob([arrayBuf],{type:"audio/wav"});
  };

  const save=async()=>{
    stopPreview();
    setSaving(true);
    try{
      const mimeType=chunksRef.current[0]?.type||"audio/webm";
      const ext=mimeType.includes("mp4")?"mp4":"webm";
      const blob=effect==="normal"
        ?new Blob(chunksRef.current,{type:mimeType})
        :await applyEffectAndGetBlob();
      const fn=`${(currentUser.handle||"anon").replace("@","")}_${Date.now()}.${ext}`;
      const audioUrl=await dbUploadAudio(blob,fn);
      let lat=0,lon=0;
      if(city.trim()){
        try{
          const geo=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city)}&format=json&limit=1`);
          const geoData=await geo.json();
          if(geoData[0]){lat=parseFloat(geoData[0].lat);lon=parseFloat(geoData[0].lon);}
        }catch{}
      }
      const lang=(navigator.language||"es").split("-")[0];
      await dbInsertSpit({handle:currentUser.handle,role:"",emotion,category,is_mundial:isMundial,thread_id:threadId,thread_order:threadOrder,duration:seconds,lang,lat,lon,audio_url:audioUrl||"",transcript:"",country:currentUser.country||""});
      setSaving(false);
      onSaved&&onSaved();
      onClose();
    }catch(e){setError("Error al guardar. Intentá de nuevo.");setSaving(false);}
  };

  useEffect(()=>()=>{clearInterval(tRef.current);stopPreview();},[]);

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:1000,display:"flex",alignItems:"flex-end",justifyContent:"center",backdropFilter:"blur(4px)"}}>
      <div style={{background:"#fff",borderRadius:"24px 24px 0 0",padding:"6px 20px 24px",width:"100%",maxWidth:480,boxShadow:"0 -8px 40px rgba(0,0,0,0.12)",animation:"sheetUp 0.3s ease",maxHeight:"96vh",overflowY:"auto"}}>
        <div style={{width:40,height:4,background:"#e0e0e0",borderRadius:2,margin:"12px auto 24px"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div>
            <div style={{fontSize:17,fontWeight:700,color:"#222"}}>Escupí</div>
            <div style={{fontSize:12,color:"#aaa",marginTop:2}}>como {currentUser.handle}</div>
          </div>
          <button onClick={onClose} style={{background:"#f5f5f5",border:"none",borderRadius:"50%",width:32,height:32,cursor:"pointer",fontSize:16,color:"#888"}}>×</button>
        </div>
        {error&&<div style={{fontSize:12,color:RAUSCH,background:"#fff0f3",padding:"8px 12px",borderRadius:8,marginBottom:16}}>{error}</div>}

        {!done?(
          <div style={{textAlign:"center",paddingBottom:8}}>
            <div style={{fontSize:60,fontWeight:700,letterSpacing:-2,color:recording?(60-seconds<10?RAUSCH:"#222"):"#ddd",marginBottom:4,transition:"color 0.3s"}}>
              {String(Math.floor((60-seconds)/60)).padStart(2,"0")}:{String((60-seconds)%60).padStart(2,"0")}
            </div>
            <div style={{fontSize:11,color:"#bbb",marginBottom:4}}>
              {recording?<span style={{color:"#aaa"}}>grabando · {seconds}s</span>:"tiempo disponible"}
            </div>
            <div style={{height:4,background:"#f0f0f0",borderRadius:2,marginBottom:36,overflow:"hidden"}}>
              <div style={{height:"100%",background:60-seconds<10?RAUSCH:"#22c55e",borderRadius:2,width:`${((60-seconds)/90)*100}%`,transition:"width 1s linear"}}/>
            </div>
            <button onClick={recording?stop:start} style={{width:80,height:80,borderRadius:"50%",background:recording?RAUSCH:"#fff",border:recording?"none":"2px solid #e8e8e8",cursor:"pointer",fontSize:28,boxShadow:recording?`0 0 0 12px rgba(255,56,92,0.1),0 4px 20px rgba(255,56,92,0.4)`:"0 2px 12px rgba(0,0,0,0.1)",transition:"all 0.3s"}}>
              {recording?"⏹":"🎙"}
            </button>
            <div style={{fontSize:13,color:"#bbb",marginTop:14}}>{recording?"Tocá para terminar":"Tocá para grabar"}</div>
          </div>
        ):(
          <div style={{paddingBottom:8}}>
            {/* Effect selector */}
            <div style={{marginBottom:20}}>
              <div style={{fontSize:11,fontWeight:600,color:"#555",marginBottom:6,textTransform:"uppercase",letterSpacing:0.5}}>Elegí tu voz</div>
              <div style={{display:"flex",gap:8}}>
                {Object.entries(EFFECTS).map(([key,cfg])=>(

            {/* Preview button */}
            <button onClick={previewing?stopPreview:preview} style={{

                  </button>
                ))}
              </div>
            </div>

            {/* Mundial toggle */}
            <div style={{marginBottom:14}}>
              <button onClick={()=>setIsMundial(p=>!p)} style={{
                width:"100%",padding:"10px 14px",borderRadius:12,cursor:"pointer",
                background:isMundial?"linear-gradient(135deg,#8ab83e,#aed956)":"#f7f7f7",
                border:`1.5px solid ${isMundial?"#aed956":"#e8e8e8"}`,
                display:"flex",alignItems:"center",gap:10,
                transition:"all 0.2s",
              }}>
                <span style={{fontSize:18}}>⚽</span>
                <div style={{textAlign:"left",flex:1}}>
                  <div style={{fontSize:13,fontWeight:700,color:isMundial?"#fff":"#333"}}>Mundial 2026</div>
                  <div style={{fontSize:11,color:isMundial?"rgba(255,255,255,0.6)":"#aaa"}}>Sumá este spit al archivo del Mundial</div>
                </div>
                <div style={{width:20,height:20,borderRadius:"50%",background:isMundial?"#fff":"#e0e0e0",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  {isMundial&&<span style={{fontSize:12,color:"#1a3d1a"}}>✓</span>}
                </div>
              </button>
            </div>

            {/* Thread picker */}
            <div style={{marginBottom:14}}>
              <div style={{fontSize:11,fontWeight:600,color:"#555",marginBottom:6,textTransform:"uppercase",letterSpacing:0.5}}>¿Es parte de un hilo?</div>
              <div style={{display:"flex",gap:8,marginBottom:showThreadPicker?12:0}}>
                <button onClick={()=>{setThreadId(null);setThreadOrder(1);setShowThreadPicker(false);}} style={{flex:1,padding:"8px 6px",borderRadius:10,cursor:"pointer",background:(!threadId&&!showThreadPicker)?"#fff0f3":"#f7f7f7",border:`1.5px solid ${(!threadId&&!showThreadPicker)?RAUSCH:"#e8e8e8"}`,fontSize:12,fontWeight:600,color:(!threadId&&!showThreadPicker)?RAUSCH:"#888"}}>
                  🎙️ Spit nuevo

                <button onClick={async()=>{
                  setShowThreadPicker(true);
                  const{data}=await sb.from("spits").select("*").eq("handle",currentUser.handle).order("created_at",{ascending:false}).limit(20);
                  setMySpitsForThread(data||[]);
                }} style={{flex:1,padding:"8px 6px",borderRadius:10,cursor:"pointer",background:(threadId||showThreadPicker)?"#fff0f3":"#f7f7f7",border:`1.5px solid ${(threadId||showThreadPicker)?RAUSCH:"#e8e8e8"}`,fontSize:12,fontWeight:600,color:(threadId||showThreadPicker)?RAUSCH:"#888"}}>

              {showThreadPicker&&!threadId&&(
                <div style={{background:"#f9f9f9",borderRadius:12,padding:12,maxHeight:180,overflowY:"auto"}}>
                  {mySpitsForThread.length===0?(
                    <div style={{fontSize:12,color:"#bbb",textAlign:"center",padding:12}}>No tenés spits anteriores.</div>
                  ):mySpitsForThread.map(s=>(
                    <div key={s.id} onClick={async()=>{
                      const{data}=await sb.from("spits").select("thread_order").eq("thread_id",s.thread_id||s.id).order("thread_order",{ascending:false}).limit(1);
                        const rootId=s.thread_id||s.id;
                      const nextOrder=data&&data[0]?data[0].thread_order+1:2;
                      // Make sure the root spit also has thread_id pointing to itself
                      if(!s.thread_id){
                        await sb.from("spits").update({thread_id:s.id,thread_order:1}).eq("id",s.id);
                      }
                      setThreadId(rootId);
                      setThreadOrder(nextOrder);
                      setShowThreadPicker(false);
                    }} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:10,cursor:"pointer",marginBottom:6,background:"#fff",border:"1px solid #f0f0f0"}}>
                      <div style={{fontSize:18}}>🎙️</div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:12,color:"#555",fontWeight:600}}>{s.duration}s · {s.category||"sin categoría"}</div>
                        <div style={{fontSize:11,color:"#bbb"}}>{new Date(s.created_at).toLocaleDateString("es-AR")}</div>
                      </div>
                      <span style={{fontSize:11,color:RAUSCH,fontWeight:600}}>+ Agregar</span>
                    </div>
                  ))}
                </div>
              )}
              {threadId&&(
                <div style={{fontSize:12,color:RAUSCH,padding:"6px 12px",background:"#fff0f3",borderRadius:8}}>
                  ✓ Se va a agregar al hilo · parte {threadOrder}
                  <button onClick={()=>{setThreadId(null);setThreadOrder(1);setShowThreadPicker(false);}} style={{background:"none",border:"none",color:"#aaa",fontSize:11,cursor:"pointer",marginLeft:8}}>Cancelar</button>
                </div>
              )}
            </div>

            {/* Category */}
            <div style={{marginBottom:14}}>
              <div style={{fontSize:11,fontWeight:600,color:"#555",marginBottom:6,textTransform:"uppercase",letterSpacing:0.5}}>Categoría <span style={{color:RAUSCH}}>*</span></div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {[{id:"verdad",label:"Verdad",emoji:"🔥"},{id:"bronca",label:"Bronca",emoji:"😤"},{id:"sentimiento",label:"Sentimiento",emoji:"❤️"},{id:"historia",label:"Historia",emoji:"😂"},{id:"momento",label:"Momento",emoji:"⚡"}].map(c=>(
                  <button key={c.id} onClick={()=>setCategory(c.id)} style={{
                    flex:"1 1 calc(33% - 8px)",padding:"10px 8px",borderRadius:12,cursor:"pointer",
                    background:category===c.id?"#fff0f3":"#f7f7f7",
                    border:`1.5px solid ${category===c.id?RAUSCH:"#e8e8e8"}`,
                    transition:"all 0.15s",textAlign:"center",
                  }}>
                    <div style={{fontSize:18,marginBottom:1}}>{c.emoji}</div>
                    <div style={{fontSize:10,fontWeight:600,color:category===c.id?RAUSCH:"#888"}}>{c.label}</div>
                  </button>
                ))}
              </div>
              {!category&&<div style={{fontSize:11,color:"#bbb",marginTop:6}}>Elegí una categoría para publicar</div>}
            </div>

            {/* Publish */}
            <button onClick={()=>{if(!category){setError("Elegí una categoría antes de publicar.");return;}save();}} disabled={saving} style={{
              width:"100%",padding:13,borderRadius:12,
              background:saving?"#ffb3c0":!category?"#e0e0e0":RAUSCH,
              border:"none",color:"#fff",fontSize:15,fontWeight:700,
              cursor:saving||!category?"not-allowed":"pointer",
              boxShadow:category?"0 4px 16px rgba(255,56,92,0.3)":"none",
            }}>
              {saving?"Guardando...":"Escupir 🔥"}
            </button>
            <div style={{fontSize:11,color:"#bbb",textAlign:"center",marginTop:8}}>
              {seconds}s · efecto: {EFFECTS[effect].label}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function CompleteProfile({email,authId,onDone}){
  const[handle,setHandle]=useState("");
  const[error,setError]=useState("");
  const[loading,setLoading]=useState(false);
  const iStyle={width:"100%",padding:"12px 14px",background:"#f7f7f7",border:"1.5px solid #ebebeb",borderRadius:10,fontSize:14,color:"#222",outline:"none"};

  const save=async()=>{
    if(!handle){setError("Elegí un nickname.");return;}
    const h="@"+handle.replace(/^@/,"").toLowerCase().replace(/[^a-z0-9_]/g,"");
    if(h.length<4){setError("El nickname debe tener al menos 3 caracteres.");return;}
    setLoading(true);
    let country="";
    try{const geo=await fetch("https://ipapi.co/json/");const geoData=await geo.json();if(geoData&&geoData.country_code)country=geoData.country_code;}catch{}
    const{error:err}=await sb.from("users").insert([{email,handle:h,role:"",auth_id:authId,country}]);
    if(err){setError("Ese nickname ya está en uso.");setLoading(false);return;}
    setLoading(false);
    onDone({email,handle:h,role:"",country});
  };

  return(
    <div style={{width:"100%",maxWidth:380,background:"#fff",borderRadius:16,boxShadow:"0 4px 32px rgba(0,0,0,0.08)",padding:"32px 28px"}}>
      <div style={{fontSize:16,fontWeight:700,color:"#222",marginBottom:6}}>¿Cómo querés que te llamen?</div>
      <div style={{fontSize:13,color:"#aaa",marginBottom:24}}>Usá un nickname — nadie necesita saber quién sos.</div>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div style={{position:"relative"}}>
          <span style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",color:"#aaa"}}>@</span>
          <input type="text" placeholder="tunickname" value={handle} onChange={e=>setHandle(e.target.value.replace(/^@/,""))} style={{...iStyle,paddingLeft:28}}/>
        </div>
        {error&&<div style={{fontSize:12,color:RAUSCH,background:"#fff0f3",padding:"8px 12px",borderRadius:8}}>{error}</div>}
        <button onClick={save} disabled={loading} style={{width:"100%",padding:16,borderRadius:10,background:loading?"#ffb3c0":RAUSCH,border:"none",color:"#fff",fontSize:15,fontWeight:700,cursor:loading?"not-allowed":"pointer",boxShadow:"0 4px 16px rgba(255,56,92,0.3)"}}>
          {loading?"Guardando...":"Empezar a escupir 🔥"}

      </div>
    </div>
  );
}

            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {spits.map(s=>(
                <div key={s.id} style={{background:"#fff",borderRadius:14,padding:"14px 16px",boxShadow:"0 1px 6px rgba(0,0,0,0.05)"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                    {s.category&&<span style={{fontSize:11,color:RAUSCH,fontWeight:600}}>{CATS[s.category]}</span>}
                    {s.emotion&&<span style={{fontSize:14}}>{s.emotion}</span>}
                    <span style={{fontSize:11,color:"#bbb",marginLeft:"auto"}}>{s.duration}s</span>
                  </div>
                  <Player duration={s.duration} audioUrl={s.audio_url}/>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function MundialCard({onSpit}){
  const[prompts,setPrompts]=useState([]);
  const[currentIdx,setCurrentIdx]=useState(0);
  const[visible,setVisible]=useState(true);

  useEffect(()=>{
    sb.from("mundial_prompt").select("*").eq("active",true).order("order_num").then(({data})=>{
      if(data&&data.length>0)setPrompts(data);
    });
  },[]);

  useEffect(()=>{
    if(prompts.length<=1)return;
    const interval=setInterval(()=>{
      setVisible(false);
      setTimeout(()=>{
        setCurrentIdx(i=>(i+1)%prompts.length);
        setVisible(true);
      },600);
    },4000);
    return()=>clearInterval(interval);
  },[prompts]);

  if(prompts.length===0)return null;

  return(
    <div style={{
      background:"linear-gradient(135deg, #8ab83e 0%, #aed956 50%, #96c445 100%)",
      borderRadius:16,
      padding:"20px 20px 16px",
      marginBottom:16,
      position:"relative",
      overflow:"hidden",
      boxShadow:"0 4px 20px rgba(0,0,0,0.15)",
    }}>
      {/* Grass texture dots */}
      <div style={{position:"absolute",inset:0,opacity:0.06,backgroundImage:"radial-gradient(circle, #fff 1px, transparent 1px)",backgroundSize:"12px 12px"}}/>
      
      {/* Mundial badge */}
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
        <span style={{fontSize:16}}>⚽</span>
        <span style={{fontSize:15,fontWeight:900,color:"#1a1a1a",textTransform:"uppercase",letterSpacing:2}}>Mundial 2026</span>
      </div>

      {/* Rotating question */}
      <div style={{
        fontSize:17,fontWeight:600,color:"#fff",lineHeight:1.4,
        minHeight:52,marginBottom:16,
        opacity:visible?1:0,
        transition:"opacity 0.5s ease",
      }}>
        {prompts[currentIdx]?.question}
      </div>

      {/* Dots indicator */}
      <div style={{display:"flex",gap:5,marginBottom:16}}>
        {prompts.map((_,i)=>(
          <div key={i} style={{
            width:i===currentIdx?16:5,height:5,borderRadius:3,
            background:i===currentIdx?"#fff":"rgba(255,255,255,0.3)",
            transition:"all 0.4s ease",
          }}/>
        ))}
      </div>

      {/* CTA button */}
      <button onClick={onSpit} style={{
        background:"#fff",border:"none",borderRadius:10,
        padding:"10px 20px",fontSize:13,fontWeight:700,
        color:"#3a5a10",cursor:"pointer",
        display:"flex",alignItems:"center",gap:8,
        boxShadow:"0 2px 8px rgba(0,0,0,0.15)",
        transition:"transform 0.15s",
      }}
        onMouseOver={e=>e.currentTarget.style.transform="scale(1.02)"}
        onMouseOut={e=>e.currentTarget.style.transform="scale(1)"}>
        🎙️ Escupí lo que sentís
      </button>
    </div>
  );
}

function App(){
  const[user,setUser]=useState(null);
  const[checking,setChecking]=useState(true);
  const[showAuth,setShowAuth]=useState(false);
  const[showLanding,setShowLanding]=useState(false);
  const[spits,setSpits]=useState([]);
  const[activeSpit,setActiveSpit]=useState(null);
  const[clusterList,setClusterList]=useState(null);
  const[showRecord,setShowRecord]=useState(false);
  const[following,setFollowing]=useState([]);
  const[showProfile,setShowProfile]=useState(false);
  const[mySpits,setMySpits]=useState([]);
  const[showListen,setShowListen]=useState(false);
  const[listenStart,setListenStart]=useState(0);
  const[showTerms,setShowTerms]=useState(false);
  const[showPrivacy,setShowPrivacy]=useState(false);
  const[showCommunity,setShowCommunity]=useState(false);
  const[activeTab,setActiveTab]=useState("global");
  const[editingBio,setEditingBio]=useState(false);
  const[bioText,setBioText]=useState("");
  const[bioError,setBioError]=useState("");
  const[editingHandle,setEditingHandle]=useState(false);
  const[newHandle,setNewHandle]=useState("");
  const[handleError,setHandleError]=useState("");
  const[followerCount,setFollowerCount]=useState(0);
  const[showSearch,setShowSearch]=useState(false);
  const[viewProfile,setViewProfile]=useState(null);
  const[searchQuery,setSearchQuery]=useState("");
  const[searchResults,setSearchResults]=useState([]);
  const[searchLoading,setSearchLoading]=useState(false);
  const[notifications,setNotifications]=useState([]);
  const[showNotifs,setShowNotifs]=useState(false);

  const handleSpitClick=(group)=>{
    if(!group||group.length===0)return;
    if(group.length===1){setActiveSpit(group[0]);setClusterList(null);}
    else{setClusterList(group);setActiveSpit(null);}
  };

  // Restore session
  useEffect(()=>{
    dbGetSession().then(profile=>{
      if(profile)setUser({email:profile.email,handle:profile.handle,role:profile.role,roles:profile.roles||[profile.role],country:profile.country||"",bio:profile.bio||"",handle_changed_at:profile.handle_changed_at||null});
      setChecking(false);
    });
    const{data:{subscription}}=sb.auth.onAuthStateChange(async(event,session)=>{
      if(event==="SIGNED_IN"&&session){
        const{data:profile}=await sb.from("users").select("handle,role,roles,auth_id,email,country,bio,handle_changed_at").eq("auth_id",session.user.id).single();
        if(profile){
          setUser({email:profile.email,handle:profile.handle,role:profile.role,roles:profile.roles||[profile.role]});
        }else{
          setUser({email:session.user.email,handle:null,role:null,needsProfile:true,auth_id:session.user.id});
        }
        setChecking(false);
      }
      if(event==="SIGNED_OUT")setUser(null);
    });
    return()=>subscription.unsubscribe();
  },[]);

  const loadSpits=async()=>{
    const data=await dbGetSpits();
    const positioned=data.map(s=>({...s,
      x:s.lon!=null?((s.lon+180)/360)*80+10:Math.random()*60+20,
      y:s.lat!=null?((90-s.lat)/180)*80+10:Math.random()*60+20
    }));
    setSpits(positioned);
  };

  useEffect(()=>{
    if(!user)return;
    loadSpits();
    if(user.handle){loadFollowing(user.handle);loadNotifications(user.handle);}
    const ch=sb.channel("spits").on("postgres_changes",{event:"INSERT",schema:"public",table:"spits"},p=>{
      const s=p.new;
      const x=s.lon!=null?((s.lon+180)/360)*80+10:Math.random()*60+20;
      const y=s.lat!=null?((90-s.lat)/180)*80+10:Math.random()*60+20;
      setSpits(prev=>[{...s,x,y,reactions:{}},...prev]);
    }).subscribe();
    const chNotif=sb.channel("notifications_"+user.handle)
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:`to_handle=eq.${user.handle}`},p=>{
        setNotifications(prev=>[p.new,...prev]);
      }).subscribe();
    return()=>{sb.removeChannel(ch);sb.removeChannel(chNotif);};
  },[user]);

  // Load my spits when profile opens
  useEffect(()=>{
    if(!showProfile||!user)return;
    sb.from("spits").select("*").eq("handle",user.handle).order("created_at",{ascending:false})
      .then(({data})=>setMySpits(data||[]));
  },[showProfile,user]);

  const deleteSpit=async(id)=>{
    await sb.from("spits").delete().eq("id",id);
    setMySpits(p=>p.filter(s=>s.id!==id));
    loadSpits();
  };

  const updateRoles=async(roles)=>{
    setUser(p=>({...p,roles}));
    await sb.from("users").update({roles:JSON.stringify(roles)}).eq("handle",user.handle);
  };

  const logout=async()=>{await sb.auth.signOut();setUser(null);};
  const loadFollowing=async(handle)=>{
    const{data}=await sb.from("follows").select("following").eq("follower",handle);
    if(data)setFollowing(data.map(f=>f.following));
  };

  const loadNotifications=async(handle)=>{
    const{data}=await sb.from("notifications").select("*").eq("to_handle",handle).order("created_at",{ascending:false}).limit(30);
    if(data)setNotifications(data);
  };

  const markAllRead=async()=>{
    await sb.from("notifications").update({read:true}).eq("to_handle",user.handle).eq("read",false);
    setNotifications(p=>p.map(n=>({...n,read:true})));
  };

  const toggleFollow=async(h)=>{
    if(!user||!user.handle)return;
    const isFollowing=following.includes(h);
    if(isFollowing){
      await sb.from("follows").delete().eq("follower",user.handle).eq("following",h);
      setFollowing(p=>p.filter(x=>x!==h));
    }else{
      await sb.from("follows").insert({follower:user.handle,following:h});
      setFollowing(p=>[...p,h]);
      // Notify the followed user
      if(h!==user.handle)try{await sb.from("notifications").insert({to_handle:h,from_handle:user.handle,type:"follow"});}catch{}
    }
  };

  if(checking)return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#fff"}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:28,fontWeight:800}}><span style={{color:RAUSCH}}>air</span>spit</div>
        <div style={{width:32,height:32,border:`3px solid ${RAUSCH}`,borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite",margin:"16px auto 0"}}/>
      </div>
    </div>
  );

  if(viewProfile)return <PublicProfile handle={viewProfile} currentUser={user} following={following} onFollowToggle={toggleFollow} onClose={()=>setViewProfile(null)}/>;
  if(showTerms)return <TermsPage onClose={()=>setShowTerms(false)}/>;
  if(showPrivacy)return <PrivacyPage onClose={()=>setShowPrivacy(false)}/>;
  if(showCommunity)return <CommunityPage onClose={()=>setShowCommunity(false)}/>;

  if(!user)return <Landing onEnter={()=>setShowAuth(true)} showAuth={showAuth} onLogin={(u)=>{setUser(u);setShowLanding(false);}} onLegal={(p)=>{if(p==="terms")setShowTerms(true);if(p==="privacy")setShowPrivacy(true);if(p==="community")setShowCommunity(true);}}/>;

  if(showLanding)return <Landing onEnter={()=>setShowLanding(false)} showAuth={false} onLogin={(u)=>{setUser(u);setShowLanding(false);}} loggedIn={true} onBack={()=>setShowLanding(false)} onLegal={(p)=>{if(p==="terms")setShowTerms(true);if(p==="privacy")setShowPrivacy(true);if(p==="community")setShowCommunity(true);}}/>;

  // New Google user needs to complete profile
  if(user.needsProfile)return(
    <div style={{minHeight:"100vh",background:"#fff",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{marginBottom:32,textAlign:"center"}}>
        <div style={{fontSize:28,fontWeight:800}}><span style={{color:RAUSCH}}>air</span>spit</div>
        <div style={{fontSize:14,color:"#aaa",marginTop:8}}>Un último paso para empezar</div>
      </div>
      <CompleteProfile email={user.email} authId={user.auth_id} onDone={profile=>setUser({...profile,roles:[profile.role]})}/>
    </div>
  );


  // Mood stats
  const moodStats=()=>{
    const withEmotion=spits.filter(s=>s.emotion);
    if(!withEmotion.length)return null;
    const counts={"😤":0,"😐":0,"😊":0};
    withEmotion.forEach(s=>{if(counts[s.emotion]!==undefined)counts[s.emotion]++;});
    const total=withEmotion.length;
    return Object.entries(counts).map(([e,n])=>({e,pct:Math.round((n/total)*100)}));
  };
  const mood=moodStats();

  // Country flag from lat/lon (approximate)
  const getFlag=(s)=>{
    if(s.country)return countryFlag(s.country);
    return "";
  };

  // SVG icons
  const IconGlobal=({active})=>(
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={active?RAUSCH:"#aaa"} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M3.6 9h16.8M3.6 15h16.8"/>
      <path d="M12 3a14 14 0 0 1 3 9 14 14 0 0 1-3 9 14 14 0 0 1-3-9 14 14 0 0 1 3-9z"/>
    </svg>
  );
  const IconFollowing=({active})=>(
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={active?RAUSCH:"#aaa"} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="7" cy="7" r="3"/>
      <path d="M1 19c0-3.3 2.7-5 6-5"/>
      <circle cx="17" cy="7" r="3"/>
      <path d="M23 19c0-3.3-2.7-5-6-5"/>
      <line x1="12" y1="12" x2="12" y2="16"/>
      <line x1="10" y1="14" x2="14" y2="14"/>
    </svg>
  );
  const IconMic=()=>(
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5 11a7 7 0 0 0 14 0"/>
      <line x1="12" y1="18" x2="12" y2="22"/>
      <line x1="9" y1="22" x2="15" y2="22"/>
    </svg>
  );
  const IconHeart=({active})=>(
    <svg width="24" height="24" viewBox="0 0 24 24" fill={active?RAUSCH:"none"} stroke={active?RAUSCH:"#aaa"} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
    </svg>
  );
  const IconProfile=({active})=>(
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={active?RAUSCH:"#aaa"} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
    </svg>
  );

  // Tab content renderers
  const CATS={verdad:"🔥 Verdad",bronca:"😤 Bronca",sentimiento:"❤️ Sentimiento",historia:"😂 Historia",momento:"⚡ Momento"};

  const groupSpits=(feedSpits)=>{
    const groups=[];
    const seen=new Set();
    feedSpits.forEach((s,i)=>{
      if(s.thread_id&&!seen.has(s.thread_id)){
        const thread=feedSpits.filter(x=>x.thread_id===s.thread_id).sort((a,b)=>a.thread_order-b.thread_order);
        thread.forEach(x=>seen.add(x.thread_id));
        groups.push({type:"thread",id:s.thread_id,spits:thread,firstIndex:i});
      } else if(!s.thread_id&&!seen.has(s.id)){
        seen.add(s.id);
        groups.push({type:"single",id:s.id,spit:s,index:i});
      }
    });
    return groups;
  };

  const ThreadCard=({thread,firstIndex})=>{
    const[expanded,setExpanded]=useState(false);
    const first=thread[0];
    return(
      <div style={{background:"#fff",borderRadius:14,boxShadow:"0 1px 6px rgba(0,0,0,0.05)",overflow:"hidden"}}>

            </div>
            <div style={{fontSize:11,color:"#aaa"}}>{first.category?CATS[first.category]:""}</div>

            <div style={{flex:1}}>
              <div style={{fontSize:11,color:"#888"}}>{s.duration}s{s.audio_url?" · 🔊":""}{s.emotion?" · "+s.emotion:""}</div>
            </div>
            <div style={{width:28,height:28,borderRadius:"50%",background:"rgba(255,56,92,0.08)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <span style={{color:RAUSCH,fontSize:12}}>▶</span>
            </div>
          </div>
        ))}
      </div>

              onClick={()=>{setListenStart(i);setShowListen(true);}}>
              <div style={{width:40,height:40,borderRadius:"50%",background:"#f5f5f5",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{"🙋"}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                  <span onClick={e=>{e.stopPropagation();setViewProfile(s.handle);}} style={{fontSize:13,fontWeight:700,color:"#222",cursor:"pointer"}}>{s.handle}</span>
                  {VERIFIED.includes(s.handle)&&<VerifiedBadge/>}
                  <span style={{fontSize:12}}>{getFlag(s)}</span>
                  {s.emotion&&<span style={{fontSize:12}}>{s.emotion}</span>}
                </div>
                <div style={{fontSize:11,color:"#aaa"}}>{s.duration}s{s.audio_url?" · 🔊":""}{s.category&&CATS[s.category]?" · "+CATS[s.category]:""}</div>
              </div>
              <div style={{width:36,height:36,borderRadius:"50%",background:"rgba(255,56,92,0.08)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <span style={{color:RAUSCH,fontSize:14}}>▶</span>
              </div>
            </div>
          );
        })}
      </div>
    );
  };

  const followingSpits=spits.filter(s=>following.includes(s.handle));
  const likedSpits=spits.filter(s=>s.liked);

  return(
    <div style={{minHeight:"100vh",background:"#f7f7f7",fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",paddingBottom:80}}>

      {/* Header */}
      <header style={{background:"#fff",padding:"0 16px",height:56,display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid #ebebeb",position:"sticky",top:0,zIndex:50}}>
        <div style={{fontSize:18,fontWeight:800,letterSpacing:-0.5,cursor:"pointer"}} onClick={()=>setShowLanding(true)}>
          <span style={{color:RAUSCH}}>air</span>spit
        </div>
        <div style={{display:"flex",alignItems:"center",gap:4}}>
          {activeTab==="global"&&(
            <button onClick={()=>{setShowSearch(p=>!p);setSearchQuery("");setSearchResults([]);}} style={{background:"none",border:"none",padding:6,cursor:"pointer",display:"flex",alignItems:"center"}}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={showSearch?RAUSCH:"#aaa"} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="11" cy="11" r="7"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </button>
          )}
          <button onClick={()=>{setShowNotifs(true);markAllRead();}} style={{background:"none",border:"none",padding:6,cursor:"pointer",position:"relative",display:"flex",alignItems:"center"}}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#aaa" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            {notifications.filter(n=>!n.read).length>0&&(
              <span style={{position:"absolute",top:4,right:4,width:8,height:8,background:RAUSCH,borderRadius:"50%",border:"2px solid #fff"}}/>
            )}
          </button>
        </div>
      </header>

      {/* Tab content */}
      <div style={{maxWidth:600,margin:"0 auto",padding:"16px 16px 16px"}}>

        {/* GLOBAL TAB */}
        {activeTab==="global"&&(
          <div>
            {/* Search bar */}
            {showSearch&&(
              <div style={{marginBottom:12}}>
                <div style={{position:"relative"}}>
                  <svg style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)"}} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#bbb" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                  <input autoFocus type="text" placeholder="Buscar por nickname..." value={searchQuery}
                    onChange={async e=>{
                      const q=e.target.value;

            ):notifications.map(n=>(
              <div key={n.id} style={{padding:"14px 20px",borderBottom:"1px solid #f9f9f9",background:n.read?"#fff":"#fff8f9",display:"flex",alignItems:"center",gap:12}}>
                <div style={{width:36,height:36,borderRadius:"50%",background:"#fff0f3",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>
                  {n.type==="like"?"❤️":"👤"}
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,color:"#222",fontWeight:500}}>
                    <span style={{color:RAUSCH,fontWeight:700}}>{n.from_handle}</span>
                    {n.type==="like"?" likeó tu spit":" empezó a seguirte"}
                  </div>
                  <div style={{fontSize:11,color:"#bbb",marginTop:2}}>{new Date(n.created_at).toLocaleDateString("es-AR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* SpitCard modal */}
      {activeSpit&&(
        <div style={{position:"fixed",inset:0,zIndex:150,display:"flex",alignItems:"center",justifyContent:"center",padding:16,background:"rgba(0,0,0,0.45)"}} onClick={()=>setActiveSpit(null)}>
          <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:460,maxHeight:"85vh",overflowY:"auto",borderRadius:20,background:"#fff",boxShadow:"0 20px 60px rgba(0,0,0,0.25)"}}>
            <SpitCard spit={activeSpit} onClose={()=>setActiveSpit(null)} following={following} onFollowToggle={toggleFollow} currentUser={user}/>
          </div>
        </div>
      )}

      {showRecord&&<RecordModal onClose={()=>setShowRecord(false)} currentUser={user} onSaved={loadSpits}/>}
      {showListen&&spits.length>0&&<ListenMode spits={spits} startIndex={listenStart} onClose={()=>setShowListen(false)} currentUser={user} following={following} onFollowToggle={toggleFollow}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
