const sb=supabase.createClient(

async function dbRegister(email,password,handle,role){
  const{data:a,error:e}=await sb.auth.signUp({email,password});
  if(e)return{error:e.message};
  let country="";try{const geo=await fetch("https://ipapi.co/json/");const geoData=await geo.json();if(geoData&&geoData.country_code)country=geoData.country_code;}catch{}
  await sb.from("users").insert([{email,handle,role,auth_id:a.user?.id,country}]);
  return{ok:true};
}
async function dbLogin(email,password){
  const{data:a,error:e}=await sb.auth.signInWithPassword({email,password});
  if(e)return{error:"Email o contraseña incorrectos."};
  const{data:u}=await sb.from("users").select("handle,role,roles,auth_id,email,country,bio,handle_changed_at").eq("email",email).single();
  return{data:u};
}
async function dbGetSession(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return null;
  const{data}=await sb.from("users").select("handle,role,roles,auth_id,email,country,bio,handle_changed_at").eq("auth_id",session.user.id).single();
  return data||null;
}
async function dbGetSpits(){

async function dbUploadAudio(blob,filename){
  const{error}=await sb.storage.from("audios").upload(filename,blob,{contentType:"audio/webm",upsert:true});

  const{data}=sb.storage.from("audios").getPublicUrl(filename);
  return data.publicUrl;

async function translateText(text,targetLang,sourceLang){
  const src=sourceLang?.split("-")[0],tgt=targetLang?.split("-")[0];
  if(!src||!tgt||src===tgt)return null;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:500,
        messages:[{role:"user",content:`Translate to ${tgt}. Return ONLY the translation:\n\n${text}`}]})
    });
    const d=await res.json();
    return d.content?.[0]?.text?.trim()||null;
  }catch{return null;}
}

const AVATAR_COLORS=["#6C3CE1","#e84393","#FF5733","#f0c030","#7ec850","#F5E642","#4a90d9","#9b59b6","#333333","#888888"];
function handleColor(handle){
  if(!handle)return AVATAR_COLORS[0];
  let hash=0;for(let i=0;i<handle.length;i++)hash=handle.charCodeAt(i)+((hash<<5)-hash);
  return AVATAR_COLORS[Math.abs(hash)%AVATAR_COLORS.length];
}

function Avatar({icon="waves",color="#6C3CE1",size=40}){
  const fn=AVATAR_ICONS[icon]||AVATAR_ICONS.waves;
  return(
    <div style={{width:size,height:size,borderRadius:"50%",overflow:"hidden",flexShrink:0,background:"#f5f5f5",display:"flex",alignItems:"center",justifyContent:"center"}}>
      {fn(color,size)}
    </div>
  );
}

    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:1200,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:"24px 24px 0 0",padding:"6px 20px 36px",width:"100%",maxWidth:480,boxShadow:"0 -8px 40px rgba(0,0,0,0.2)"}}>
        <div style={{width:40,height:4,background:"#e0e0e0",borderRadius:2,margin:"12px auto 20px"}}/>
        {sent?(
          <div style={{textAlign:"center",padding:"24px 0"}}>
            <div style={{fontSize:36,marginBottom:12}}>✅</div>
            <div style={{fontSize:16,fontWeight:700,color:"#222",marginBottom:6}}>Reporte enviado</div>
            <div style={{fontSize:13,color:"#aaa",marginBottom:24}}>Gracias. Revisamos cada reporte en 72 horas.</div>
            <button onClick={onClose} style={{padding:"10px 32px",borderRadius:10,background:RAUSCH,border:"none",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}}>Cerrar</button>
          </div>
        ):(
          <>
            <div style={{fontSize:16,fontWeight:700,color:"#222",marginBottom:4}}>Reportar spit</div>
            <div style={{fontSize:12,color:"#aaa",marginBottom:20}}>¿Por qué querés reportar este audio?</div>
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
              {REPORT_REASONS_LIST.map(r=>(
                <button key={r} onClick={()=>setReason(r)} style={{padding:"12px 16px",borderRadius:12,border:`1.5px solid ${reason===r?RAUSCH:"#ebebeb"}`,background:reason===r?"#fff0f3":"#fafafa",color:reason===r?RAUSCH:"#444",fontSize:13,fontWeight:reason===r?700:400,cursor:"pointer",textAlign:"left",transition:"all 0.15s"}}>
                  {r}
                </button>
              ))}
            </div>
            <button onClick={send} disabled={!reason||loading} style={{width:"100%",padding:14,borderRadius:12,background:reason&&!loading?RAUSCH:"#f0f0f0",border:"none",color:reason&&!loading?"#fff":"#aaa",fontSize:15,fontWeight:700,cursor:reason&&!loading?"pointer":"not-allowed",transition:"all 0.2s"}}>
              {loading?"Enviando...":"Enviar reporte"}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function ListenMode({spits,startIndex,onClose,currentUser,following,onFollowToggle,likedIds=new Set(),onLike=()=>{},onUnlike=()=>{},onViewProfile=()=>{},savedIds=new Set(),onToggleSave=()=>{},onRespit=()=>{}}){
  const[idx,setIdx]=useState(startIndex||0);
  const[animating,setAnimating]=useState(false);
  const[direction,setDirection]=useState(null);
  const[liked,setLiked]=useState(()=>{const m={};likedIds.forEach(id=>{m[id]=true;});return m;});
  const[showReport,setShowReport]=useState(false);
  const[lastTap,setLastTap]=useState(0);
  const[playing,setPlaying]=useState(true);
  const[progress,setProgress]=useState(0);
  const[duration,setDuration]=useState(0);
  const[speed,setSpeed]=useState(1);
  const audioRef=useRef(null);
  const progressRef=useRef(null);
  const touchStartY=useRef(null);
  const touchStartX=useRef(null);

  const spit=spits[idx];

  // Emotion-based background colors
  const emotionBg={
    "😤":{from:"#2d0a0a",to:"#5c1a1a",accent:"#6C3CE1"},
    "😊":{from:"#0a2d1a",to:"#1a5c30",accent:"#F5E642"},
    "😐":{from:"#1a1a2d",to:"#2d2d4a",accent:"#8888cc"},
  };
  const catBg={
    amor:{from:"#2d0a1a",to:"#5c1030",accent:"#e84393"},
    chismes:{from:"#2d1a0a",to:"#5c3010",accent:"#FF5733"},
    jefes:{from:"#0a1a2d",to:"#10305c",accent:"#4a90d9"},
    bronca:{from:"#2d0a0a",to:"#5c1a1a",accent:"#FF385C"},
    anecdotas:{from:"#1a2d0a",to:"#305c10",accent:"#7ec850"},
    injusticias:{from:"#1a0a2d",to:"#30105c",accent:"#9b59b6"},
    opinion:{from:"#001a20",to:"#003040",accent:"#0891b2"},
    alegria:{from:"#2d2500",to:"#5c4a00",accent:"#f0c030"},
  };
  const theme=(spit?.category&&catBg[spit.category])||
              {from:"#0a0a0a",to:"#1a1a2d",accent:"#6C3CE1"};

  // Auto-play
  useEffect(()=>{
    if(audioRef.current){audioRef.current.pause();audioRef.current=null;}
    setProgress(0);setDuration(0);setPlaying(true);setSpeed(1);
    if(!spit?.audio_url)return;
    const a=new Audio(spit.audio_url);
    a.onloadedmetadata=()=>{if(isFinite(a.duration)&&a.duration>0)setDuration(a.duration);};
    a.ondurationchange=()=>{if(isFinite(a.duration)&&a.duration>0)setDuration(a.duration);};
    a.ontimeupdate=()=>{setProgress(a.currentTime);if(isFinite(a.duration)&&a.duration>0)setDuration(a.duration);};
    a.onended=()=>{setPlaying(false);if(idx<spits.length-1)setTimeout(()=>goTo(idx+1,"up"),800);};
    a.play().catch(()=>setPlaying(false));
    audioRef.current=a;
    return()=>{if(audioRef.current){audioRef.current.pause();audioRef.current=null;}};
  },[idx]);

  useEffect(()=>{
    if(!audioRef.current)return;
    if(playing)audioRef.current.play().catch(()=>{});
    else audioRef.current.pause();
  },[playing]);

  useEffect(()=>{if(audioRef.current)audioRef.current.playbackRate=speed;},[speed]);

  const goTo=(newIdx,dir)=>{
    if(animating||newIdx<0||newIdx>=spits.length)return;
    setDirection(dir);setAnimating(true);
    setTimeout(()=>{setIdx(newIdx);setAnimating(false);},320);
  };

  const next=()=>goTo(idx+1,"up");
  const prev=()=>goTo(idx-1,"down");

  const doLike=async()=>{
    if(!liked[spit.id]){
      setLiked(p=>({...p,[spit.id]:true}));
      onLike(spit.id);
      try{await sb.from("reactions").insert([{spit_id:spit.id,handle:currentUser.handle,emoji:"❤️"}]);}catch{}
      if(spit.handle&&spit.handle!==currentUser.handle)
        try{await sb.from("notifications").insert({to_handle:spit.handle,from_handle:currentUser.handle,type:"like",spit_id:spit.id});}catch{}
    }else{
      setLiked(p=>({...p,[spit.id]:false}));
      onUnlike(spit.id);
      try{await sb.from("reactions").delete().eq("spit_id",spit.id).eq("handle",currentUser.handle).eq("emoji","❤️");}catch{}
    }
  };

  const handleTap=async(e)=>{
    const now=Date.now();
    if(now-lastTap<300)doLike();
    setLastTap(now);
  };

  const onTouchStart=e=>{touchStartY.current=e.touches[0].clientY;touchStartX.current=e.touches[0].clientX;};
  const onTouchEnd=e=>{
    if(touchStartY.current===null)return;
    const dy=touchStartY.current-e.changedTouches[0].clientY;
    const dx=Math.abs(touchStartX.current-e.changedTouches[0].clientX);
    if(Math.abs(dy)>50&&dx<80){dy>0?next():prev();}
    touchStartY.current=null;
  };

  useEffect(()=>{
    const k=e=>{if(e.key==="ArrowUp")next();if(e.key==="ArrowDown")prev();if(e.key==="Escape")onClose();if(e.key===" ")setPlaying(p=>!p);};
    window.addEventListener("keydown",k);
    return()=>window.removeEventListener("keydown",k);
  },[idx,animating]);

  if(!spit)return null;
  const isFollowing=following?.includes(spit.handle);
  const pct=duration>0?(progress/duration)*100:0;
  const fmt=s=>isFinite(s)&&s>=0?`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`:"0:00";
  const CATS_SHORT={amor:"Amor",chismes:"Chismes",jefes:"Jefes",bronca:"Quejas",anecdotas:"Anécdotas",injusticias:"Injusticias",opinion:"Opinión",alegria:"Alegrías"};
  const CATS_L={amor:"AMOR / Desamor (Puterío)",chismes:"CHISMES que no puedo guardar",jefes:"JEFES / Trabajo",bronca:"QUEJAS / Broncas / Frustraciones",anecdotas:"ANÉCDOTAS / Pasaron cosas",injusticias:"INJUSTICIAS / Indignación",opinion:"OPINIÓN / Lo que pienso",alegria:"ALEGRÍAS / Todo lo bueno que quiero decir"};

  return(
    <div style={{
      position:"fixed",inset:0,zIndex:1000,overflow:"hidden",userSelect:"none",
      background:`linear-gradient(160deg, ${theme.from} 0%, ${theme.to} 100%)`,
      transition:"background 0.8s ease",
      display:"flex",flexDirection:"column",
    }}
      onTouchStart={onTouchStart} onTouchEnd={onTouchEnd} onClick={handleTap}>

      {/* Top bar */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"52px 24px 0",zIndex:10}}>
        <button onClick={e=>{e.stopPropagation();onClose();}} style={{background:"rgba(255,255,255,0.1)",border:"none",borderRadius:20,padding:"8px 16px",color:"rgba(255,255,255,0.8)",cursor:"pointer",fontSize:13,fontWeight:600,backdropFilter:"blur(8px)"}}>
          ✕
        </button>
        <div style={{fontSize:12,color:"rgba(255,255,255,0.35)",letterSpacing:1}}>{idx+1} / {spits.length}</div>
        {spit.handle!==currentUser?.handle?(
          <button onClick={e=>{e.stopPropagation();onFollowToggle(spit.handle);}} style={{
            background:isFollowing?"rgba(255,255,255,0.08)":"rgba(255,255,255,0.18)",
            border:`1px solid ${isFollowing?"rgba(255,255,255,0.15)":"rgba(255,255,255,0.35)"}`,
            borderRadius:20,padding:"8px 16px",color:"#fff",cursor:"pointer",fontSize:12,fontWeight:600,backdropFilter:"blur(8px)"
          }}>{isFollowing?"Siguiendo":"+ Seguir"}</button>
        ):<div style={{width:80}}/>}
      </div>

      {/* Main content */}
      <div key={idx} style={{
        flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
        padding:"0 32px",
        animation:animating
          ?(direction==="up"?"slideOutToTop 0.32s ease forwards":"slideOutToBottom 0.32s ease forwards")
          :(direction==="up"?"slideInFromBottom 0.32s ease forwards":"slideInFromTop 0.32s ease forwards"),
      }}>

        {/* Category + emotion */}
        <div style={{display:"flex",gap:10,marginBottom:32,alignItems:"center"}}>
          {spit.category&&<span style={{fontSize:13,fontWeight:700,color:theme.accent,background:"rgba(255,255,255,0.08)",padding:"5px 14px",borderRadius:20,backdropFilter:"blur(8px)"}}>{CATS_SHORT[spit.category]||spit.category}</span>}
          {spit.emotion&&<span style={{fontSize:20}}>{spit.emotion}</span>}
        </div>

        {/* Waveform */}
        <div style={{display:"flex",alignItems:"center",gap:4,height:80,marginBottom:40}}>
          {[0.3,0.6,0.9,0.7,1,0.8,0.5,1,0.6,0.9,0.4,0.7,1,0.8,0.6,0.9,0.5,0.8,0.7,1].map((h,i)=>(
            <div key={i} style={{
              width:4,borderRadius:4,
              background:playing?theme.accent:"rgba(255,255,255,0.2)",
              height:playing?`${h*72}px`:"16px",
              transition:"height 0.15s ease, background 0.3s",
              animation:playing?`wave ${0.35+i*0.07}s ease-in-out infinite alternate`:"none",
              opacity:0.7+h*0.3,
            }}/>
          ))}
        </div>

        {/* User info */}
        <div style={{textAlign:"center",marginBottom:40}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,marginBottom:6}}>
            <span onClick={e=>{e.stopPropagation();onViewProfile(spit.handle);}} style={{fontSize:20,fontWeight:800,color:"#fff",letterSpacing:-0.5,cursor:"pointer",textDecoration:"underline",textDecorationColor:"rgba(255,255,255,0.3)",textUnderlineOffset:3}}>{spit.handle}</span>
            {VERIFIED.has(spit.handle)&&<VerifiedBadge/>}
            {spit.handle!==currentUser?.handle&&(
              <button onClick={e=>{e.stopPropagation();setShowReport(true);}} style={{background:"none",border:"none",cursor:"pointer",padding:4,opacity:0.4,display:"flex",alignItems:"center"}}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
              </button>
            )}
          </div>
          <div style={{fontSize:13,color:"rgba(255,255,255,0.35)"}}>{spit.duration}s</div>
        </div>

        {/* Progress bar */}
        <div style={{width:"100%",maxWidth:320,marginBottom:12}}>
          <div style={{height:3,background:"rgba(255,255,255,0.15)",borderRadius:2,overflow:"hidden",cursor:"pointer"}}
            onClick={e=>{
              e.stopPropagation();
              const r=e.currentTarget.getBoundingClientRect();
              const t=((e.clientX-r.left)/r.width)*duration;
              if(audioRef.current)audioRef.current.currentTime=t;
              setProgress(t);
            }}>
            <div style={{height:"100%",background:theme.accent,borderRadius:2,width:`${pct}%`,transition:"width 0.25s linear"}}/>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:6}}>
            <span style={{fontSize:11,color:"rgba(255,255,255,0.3)"}}>{fmt(progress)}</span>
            <span style={{fontSize:11,color:"rgba(255,255,255,0.3)"}}>{fmt(duration)}</span>
          </div>
        </div>

        {/* Controls */}
        <div style={{display:"flex",alignItems:"center",gap:24}} onClick={e=>e.stopPropagation()}>
          <button onClick={()=>goTo(idx-1,"down")} disabled={idx===0} style={{background:"none",border:"none",cursor:idx===0?"not-allowed":"pointer",opacity:idx===0?0.2:0.6,color:"#fff",fontSize:24,display:"flex",alignItems:"center"}}>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="white" strokeWidth="2" strokeLinecap="round"/></svg>
          </button>
          <button onClick={()=>setPlaying(p=>!p)} style={{width:64,height:64,borderRadius:"50%",border:"none",cursor:"pointer",background:theme.accent,boxShadow:`0 0 32px ${theme.accent}66`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,color:"#fff",transition:"transform 0.15s"}}
            onMouseOver={e=>e.currentTarget.style.transform="scale(1.06)"}
            onMouseOut={e=>e.currentTarget.style.transform="scale(1)"}>
            {playing?"⏸":"▶"}
          </button>
          <button onClick={()=>goTo(idx+1,"up")} disabled={idx===spits.length-1} style={{background:"none",border:"none",cursor:idx===spits.length-1?"not-allowed":"pointer",opacity:idx===spits.length-1?0.2:0.6,color:"#fff",fontSize:24,display:"flex",alignItems:"center"}}>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="4" x2="19" y2="20" stroke="white" strokeWidth="2" strokeLinecap="round"/></svg>
          </button>
        </div>

        {/* Speed */}
        <div style={{display:"flex",gap:8,marginTop:20}} onClick={e=>e.stopPropagation()}>
          {[1,1.5,2].map(sp=>(
            <button key={sp} onClick={()=>setSpeed(sp)} style={{padding:"5px 14px",borderRadius:20,border:"none",cursor:"pointer",fontSize:12,fontWeight:700,background:speed===sp?"rgba(255,255,255,0.25)":"rgba(255,255,255,0.08)",color:speed===sp?"#fff":"rgba(255,255,255,0.45)",transition:"all 0.2s"}}>
              {sp===1?"1×":sp+"×"}
            </button>
          ))}
        </div>
      </div>

      {/* Like + Save + Respit */}
      <div style={{display:"flex",justifyContent:"center",alignItems:"center",gap:20,paddingBottom:36,zIndex:10}} onClick={e=>e.stopPropagation()}>
        <button onClick={e=>{e.stopPropagation();doLike();}} style={{background:"none",border:"none",cursor:"pointer",padding:10,display:"flex",alignItems:"center",justifyContent:"center",transition:"transform 0.15s",outline:"none",WebkitTapHighlightColor:"transparent"}}
          onMouseOver={e=>e.currentTarget.style.transform="scale(1.1)"}
          onMouseOut={e=>e.currentTarget.style.transform="scale(1)"}>
          <svg width="36" height="36" viewBox="0 0 24 24" fill={liked[spit.id]?theme.accent:"none"} stroke={liked[spit.id]?theme.accent:"rgba(255,255,255,0.5)"} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{transition:"all 0.2s"}}>
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
          </svg>
        </button>
        <button onClick={e=>{e.stopPropagation();onRespit(spit.id);onClose();}} style={{background:"rgba(255,255,255,0.12)",border:"none",borderRadius:24,cursor:"pointer",padding:"8px 18px",display:"flex",alignItems:"center",gap:6,outline:"none",WebkitTapHighlightColor:"transparent",transition:"transform 0.15s"}}
          onMouseOver={e=>e.currentTarget.style.transform="scale(1.05)"}
          onMouseOut={e=>e.currentTarget.style.transform="scale(1)"}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
          <span style={{color:"rgba(255,255,255,0.8)",fontSize:13,fontWeight:600}}>Respit</span>
        </button>
        <button onClick={e=>{e.stopPropagation();onToggleSave(spit.id);}} style={{background:"none",border:"none",cursor:"pointer",padding:10,display:"flex",alignItems:"center",justifyContent:"center",transition:"transform 0.15s",outline:"none",WebkitTapHighlightColor:"transparent"}}
          onMouseOver={e=>e.currentTarget.style.transform="scale(1.1)"}
          onMouseOut={e=>e.currentTarget.style.transform="scale(1)"}>
          <svg width="32" height="32" viewBox="0 0 24 24" fill={savedIds.has(spit.id)?theme.accent:"none"} stroke={savedIds.has(spit.id)?theme.accent:"rgba(255,255,255,0.5)"} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{transition:"all 0.2s"}}>
            <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/>
          </svg>
        </button>
      </div>

      {showReport&&<div style={{position:"fixed",inset:0,zIndex:1200}} onClick={e=>e.stopPropagation()}><ReportModalStandalone spitId={spit.id} reporterHandle={currentUser?.handle} onClose={()=>setShowReport(false)}/></div>}
      <style>{`@keyframes wave{from{transform:scaleY(0.3)}to{transform:scaleY(1)}}`}</style>
    </div>
  );
}

function Player({duration,audioUrl,playingId,setPlayingId,spitId}){
  const[playing,setPlaying]=useState(false);
  const[cur,setCur]=useState(0);
  const[speed,setSpeed]=useState(1);
  const[loaded,setLoaded]=useState(false);
  const[realDur,setRealDur]=useState(duration||30);
  const audioRef=useRef(null);
  const intRef=useRef(null);
  const barRef=useRef(null);

  useEffect(()=>{
    if(audioRef.current){audioRef.current.pause();audioRef.current.src="";}
    setPlaying(false);setCur(0);setLoaded(false);setRealDur(duration||30);
    if(!audioUrl)return;
    const a=new Audio();
    a.preload="metadata";
    a.src=audioUrl;
    a.onloadedmetadata=()=>{if(a.duration&&!isNaN(a.duration)&&isFinite(a.duration))setRealDur(Math.round(a.duration));setLoaded(true);};
    a.oncanplay=()=>setLoaded(true);
    a.onended=()=>{setPlaying(false);setCur(0);};
    a.onerror=()=>{console.error("Audio error",a.error);setLoaded(false);};
    audioRef.current=a;
    return()=>{a.pause();a.src="";};
  },[audioUrl]);

  useEffect(()=>{
    const a=audioRef.current;
    if(!a)return;
    if(playing){
      if(spitId&&setPlayingId)setPlayingId(spitId);
      a.playbackRate=speed;
      a.play().catch(()=>setPlaying(false));
      intRef.current=setInterval(()=>{setCur(a.currentTime||0);if(a.ended){setPlaying(false);setCur(0);if(setPlayingId)setPlayingId(null);}},250);
    }else{
      a.pause();
      clearInterval(intRef.current);
    }
    return()=>clearInterval(intRef.current);
  },[playing,speed]);

  const skip=d=>{const a=audioRef.current;const t=Math.min(realDur,Math.max(0,cur+d));setCur(t);if(a)a.currentTime=t;};
  const fmt=s=>(!s||!isFinite(s)||isNaN(s))?"0:00":`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
  const pct=realDur>0?(cur/realDur)*100:0;
  const seek=e=>{const r=barRef.current.getBoundingClientRect();const t=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*realDur;setCur(t);if(audioRef.current)audioRef.current.currentTime=t;};
  const canPlay=!audioUrl||(audioUrl&&loaded);
  const btnS={background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,color:"#999",padding:"4px 6px"};

  return(
    <div style={{background:"#F3F0FF",borderRadius:12,padding:"12px 14px"}}>
      {audioUrl&&!loaded&&<div style={{fontSize:11,color:"#bbb",textAlign:"center",marginBottom:8}}>Cargando audio…</div>}
      {!audioUrl&&<div style={{fontSize:11,color:"#bbb",textAlign:"center",marginBottom:8}}>Audio no disponible</div>}
      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:10}}>
        <button onClick={()=>skip(-10)} style={btnS}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
          <span style={{fontSize:8,color:"#bbb"}}>10</span>
        </button>
        <button onClick={()=>canPlay&&setPlaying(p=>!p)} style={{width:40,height:40,borderRadius:"50%",border:"none",cursor:canPlay?"pointer":"not-allowed",background:playing?RAUSCH:"#fff",boxShadow:playing?`0 2px 10px rgba(255,56,92,0.4)`:"0 1px 4px rgba(0,0,0,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,color:playing?"#fff":"#333",transition:"all 0.2s",flexShrink:0,opacity:canPlay?1:0.5}}>
          {playing?"⏸":"▶"}
        </button>
        <button onClick={()=>skip(10)} style={btnS}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-4.5"/></svg>
          <span style={{fontSize:8,color:"#bbb"}}>10</span>
        </button>

          {speed===1?"1x":speed===1.5?"1.5x":"2x"}
        </button>

      <div ref={barRef} onClick={seek} style={{height:4,background:"#e8e8e8",borderRadius:2,cursor:"pointer",position:"relative"}}>
        <div style={{height:"100%",background:RAUSCH,borderRadius:2,width:`${pct}%`,pointerEvents:"none"}}/>
        <div style={{position:"absolute",top:"50%",left:`${pct}%`,transform:"translate(-50%,-50%)",width:12,height:12,borderRadius:"50%",background:RAUSCH,opacity:cur>0?1:0,pointerEvents:"none"}}/>
      </div>
    </div>
  );
}

// ── SpitCard ──────────────────────────────────────────────────────────────────
function SpitCard({spit,onClose,following,onFollowToggle,currentUser}){
  const[myR,setMyR]=useState([]);
  const[reactions,setReactions]=useState({});
  const[translated,setTranslated]=useState(null);
  const[translating,setTranslating]=useState(false);
  const[showFull,setShowFull]=useState(false);
  const userLang=(navigator.language||"es").split("-")[0];
  const spitLang=spit.lang||"es";
  const needsTr=spitLang!==userLang;
  const isFollowing=following&&following.includes(spit.handle);

  // Load reactions from Supabase
  useEffect(()=>{
    setTranslated(null);setTranslating(false);setShowFull(false);setMyR([]);setReactions({});
    // Load all reactions for this spit
    sb.from("reactions").select("emoji,handle").eq("spit_id",spit.id).then(({data})=>{
      if(!data)return;
      const counts={};
      const mine=[];
      data.forEach(r=>{
        counts[r.emoji]=(counts[r.emoji]||0)+1;
        if(r.handle===currentUser?.handle)mine.push(r.emoji);
      });
      setReactions(counts);
      setMyR(mine);
    });
    if(needsTr&&spit.transcript){
      setTranslating(true);
      translateText(spit.transcript||spit.text||"",userLang,spitLang).then(t=>{setTranslated(t);setTranslating(false);});
    }
  },[spit.id]);

  const react=async(emoji)=>{
    const has=myR.includes(emoji);
    if(has){
      setMyR(r=>r.filter(e=>e!==emoji));
      setReactions(p=>({...p,[emoji]:Math.max(0,(p[emoji]||0)-1)}));
      await sb.from("reactions").delete().eq("spit_id",spit.id).eq("handle",currentUser.handle).eq("emoji",emoji);
    }else{
      if(myR.length>=MAX_REACTIONS)return;
      setMyR(r=>[...r,emoji]);
      setReactions(p=>({...p,[emoji]:(p[emoji]||0)+1}));
      await sb.from("reactions").insert([{spit_id:spit.id,handle:currentUser.handle,emoji}]);
    }
  };

  const txt=needsTr?(translated||(spit.transcript||"")):( spit.transcript||spit.text||"");
  const preview=txt.length>110?txt.slice(0,110)+"…":txt;
  const total=Object.values(reactions).reduce((a,b)=>a+b,0);
  const left=MAX_REACTIONS-myR.length;

  return(
    <div style={{position:"absolute",bottom:16,left:"50%",transform:"translateX(-50%)",width:"min(460px,92vw)",background:"#fff",borderRadius:16,boxShadow:"0 8px 40px rgba(0,0,0,0.12)",zIndex:100,animation:"slideUp 0.25s ease",overflow:"hidden"}}>
      <div style={{height:3,background:`linear-gradient(90deg,${RAUSCH},#ff7a8a)`}}/>
      <div style={{padding:"18px 20px 20px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:40,height:40,borderRadius:"50%",background:"#f5f5f5",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{icon}</div>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <span style={{fontSize:14,fontWeight:700,color:"#222"}}>{spit.handle||"@usuario"}</span>
                  {VERIFIED.has(spit.handle)&&<VerifiedBadge/>}
                {spit.handle&&spit.handle!==currentUser?.handle&&onFollowToggle&&(
                  <button onClick={()=>onFollowToggle(spit.handle)} style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:600,cursor:"pointer",background:isFollowing?"#fff":RAUSCH,border:`1.5px solid ${isFollowing?"#e0e0e0":RAUSCH}`,color:isFollowing?"#888":"#fff",transition:"all 0.2s"}}>
                    {isFollowing?"Siguiendo":"+ Seguir"}
                  </button>
                )}
              </div>
              <div style={{fontSize:11,color:"#aaa",marginTop:2}}>{spit.role}{spit.gender&&spit.gender!=="No especifico"?` · ${spit.gender}`:""}{spit.age?` · ${spit.age}a`:""} · {spit.duration}s</div>
            </div>
          </div>
          <button onClick={onClose} style={{background:"#f5f5f5",border:"none",borderRadius:"50%",width:30,height:30,cursor:"pointer",fontSize:15,color:"#888",display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
        </div>
        <div style={{height:1,background:"#f5f5f5",marginBottom:12}}/>
        <div style={{marginBottom:14}}>
          {translating?(
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:15,height:15,border:`2px solid ${RAUSCH}`,borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
              <span style={{fontSize:13,color:"#aaa"}}>Traduciendo…</span>
            </div>
          ):(
            <>
              {txt?(
                <>
                  <p style={{fontSize:14,color:"#333",lineHeight:1.65,margin:0}}>{showFull?txt:preview}</p>
                  {txt.length>110&&<button onClick={()=>setShowFull(p=>!p)} style={{background:"none",border:"none",color:RAUSCH,fontSize:12,fontWeight:600,cursor:"pointer",padding:0,marginTop:6}}>{showFull?"Ver menos":"Ver todo"}</button>}
                </>
              ):(
                <p style={{fontSize:13,color:"#bbb",fontStyle:"italic"}}>Audio sin transcripción</p>
              )}
              {needsTr&&translated&&<div style={{fontSize:11,color:"#ccc",marginTop:6}}>Traducido del {LANG_NAMES[spitLang]||spitLang}</div>}
            </>
          )}
        </div>
        <div style={{marginBottom:14}}><Player duration={spit.duration||30} audioUrl={spit.audio_url}/></div>
        <div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <span style={{fontSize:11,color:"#bbb"}}>{total} reacciones</span>
            <span style={{fontSize:11,color:left===0?RAUSCH:"#ccc"}}>{left>0?`podés agregar ${left} más`:"máximo alcanzado"}</span>
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {EMOJIS.map(e=>{
              const a=myR.includes(e),dis=!a&&myR.length>=MAX_REACTIONS;
              return<button key={e} onClick={()=>react(e)} style={{background:a?"#fff0f3":"#f7f7f7",border:`1.5px solid ${a?RAUSCH:"#ebebeb"}`,borderRadius:20,padding:"5px 10px",cursor:dis?"not-allowed":"pointer",fontSize:15,display:"flex",alignItems:"center",gap:5,opacity:dis?0.35:1,transition:"all 0.15s",transform:a?"scale(1.05)":"scale(1)"}}>
                <span>{e}</span><span style={{fontSize:11,fontWeight:600,color:a?RAUSCH:"#aaa"}}>{reactions[e]||0}</span>
              </button>;
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Record Modal ──────────────────────────────────────────────────────────────
function RecordModal({onClose,currentUser,onSaved,mundialDefault=false,respitOf=null}){
  const[recording,setRecording]=useState(false);
  const[seconds,setSeconds]=useState(0);
  const[done,setDone]=useState(false);
  const[saving,setSaving]=useState(false);
  const[error,setError]=useState("");
  const[effect,setEffect]=useState("normal");
  const[spitRole,setSpitRole]=useState("");
  const[emotion,setEmotion]=useState("");
  const[category,setCategory]=useState("");
  const[threadId,setThreadId]=useState(null);
  const[isMundial,setIsMundial]=useState(mundialDefault);
  const[threadOrder,setThreadOrder]=useState(1);
  const[showThreadPicker,setShowThreadPicker]=useState(false);
  const[mySpitsForThread,setMySpitsForThread]=useState([]);
  const[city,setCity]=useState("");
  const[previewing,setPreviewing]=useState(false);
  const tRef=useRef(null);
  const mrRef=useRef(null);
  const chunksRef=useRef([]);
  const audioCtxRef=useRef(null);
  const sourceRef=useRef(null);

  const EFFECTS={
    normal:{label:"Normal",emoji:"",desc:"Tu voz tal cual",rate:1,pitch:1},
    ardilla:{label:"Ardilla",emoji:"",desc:"Aguda y divertida",rate:1.4,pitch:1.4},
    grave:{label:"Grave",emoji:"",desc:"Grave y profunda",rate:0.8,pitch:0.7},
  };

  const start=async()=>{
    setError("");
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      // Use format compatible with all browsers
      const mimeType=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
        ?"audio/webm;codecs=opus"
        :MediaRecorder.isTypeSupported("audio/mp4")
        ?"audio/mp4"
        :"audio/webm";
      const mr=new MediaRecorder(stream,{mimeType});
      chunksRef.current=[];
      mr.ondataavailable=e=>{if(e.data&&e.data.size>0)chunksRef.current.push(e.data);};
      mr.start(1000); // collect data every 1 second
      mrRef.current=mr;
      setRecording(true);
      tRef.current=setInterval(()=>setSeconds(s=>{if(s>=60){stop();return s;}return s+1;}),1000);
    }catch(e){setError("No se pudo acceder al micrófono.");}
  };

  const stop=()=>{
    setRecording(false);
    clearInterval(tRef.current);
    if(mrRef.current&&mrRef.current.state!=="inactive"){
      mrRef.current.onstop=()=>{
        if(seconds>=3)setDone(true);
      };
      // Request final data chunk before stopping
      mrRef.current.requestData();
      mrRef.current.stop();
      mrRef.current.stream.getTracks().forEach(t=>t.stop());
    }else if(seconds>=3)setDone(true);
  };

  const stopPreview=()=>{
    if(sourceRef.current){
      try{sourceRef.current.stop();}catch(e){}
    }
    if(audioCtxRef.current){try{audioCtxRef.current.close();}catch(e){}}
    sourceRef.current=null;
    audioCtxRef.current=null;
    setPreviewing(false);
  };

  const preview=async()=>{
    stopPreview();
    try{
      const mimeType=chunksRef.current[0]?.type||"audio/webm";
      const blob=new Blob(chunksRef.current,{type:mimeType});

      // For Normal effect — use simple Audio element (works on iOS)
      if(effect==="normal"){
        const url=URL.createObjectURL(blob);
        const audio=new Audio(url);
        audio.onended=()=>{setPreviewing(false);URL.revokeObjectURL(url);};
        audio.onerror=()=>{setPreviewing(false);setError("No se pudo previsualizar.");};
        await audio.play();
        sourceRef.current={stop:()=>{audio.pause();URL.revokeObjectURL(url);}};
        setPreviewing(true);
        return;
      }

      // For Ardilla/Sombra — use AudioContext with playbackRate
      const arrayBuf=await blob.arrayBuffer();
      const ctx=new (window.AudioContext||window.webkitAudioContext)();
      audioCtxRef.current=ctx;
      const decoded=await ctx.decodeAudioData(arrayBuf);
      const source=ctx.createBufferSource();
      source.buffer=decoded;
      const cfg=EFFECTS[effect];
      source.playbackRate.value=cfg.rate;
      source.connect(ctx.destination);
      source.start();
      sourceRef.current=source;
      setPreviewing(true);
      source.onended=()=>{setPreviewing(false);};
    }catch(e){setError("No se pudo previsualizar el audio.");}
  };

  // Apply effect to blob before upload
  const applyEffectAndGetBlob=async()=>{
    const cfg=EFFECTS[effect];
    if(cfg.rate===1) return new Blob(chunksRef.current,{type:"audio/webm"});
    try{
      const blob=new Blob(chunksRef.current,{type:"audio/webm"});
      const arrayBuf=await blob.arrayBuffer();
      const ctx=new OfflineAudioContext(2,44100*seconds*2,44100);
      const decoded=await new AudioContext().decodeAudioData(arrayBuf);
      const source=ctx.createBufferSource();
      source.buffer=decoded;
      source.playbackRate.value=cfg.rate;
      source.connect(ctx.destination);
      source.start();
      const rendered=await ctx.startRendering();
      // Convert to wav blob
      const wavBlob=audioBufferToWav(rendered);
      return wavBlob;
    }catch(e){
      return new Blob(chunksRef.current,{type:"audio/webm"});
    }
  };

  // Simple AudioBuffer to WAV converter
  const audioBufferToWav=(buffer)=>{
    const ch=buffer.numberOfChannels;
    const len=buffer.length;
    const rate=buffer.sampleRate;
    const arrayBuf=new ArrayBuffer(44+len*ch*2);
    const view=new DataView(arrayBuf);
    const writeStr=(o,s)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};
    writeStr(0,"RIFF");view.setUint32(4,36+len*ch*2,true);writeStr(8,"WAVE");
    writeStr(12,"fmt ");view.setUint32(16,16,true);view.setUint16(20,1,true);
    view.setUint16(22,ch,true);view.setUint32(24,rate,true);
    view.setUint32(28,rate*ch*2,true);view.setUint16(32,ch*2,true);
    view.setUint16(34,16,true);writeStr(36,"data");view.setUint32(40,len*ch*2,true);
    let offset=44;
    for(let i=0;i<len;i++){for(let c=0;c<ch;c++){
      const s=Math.max(-1,Math.min(1,buffer.getChannelData(c)[i]));
      view.setInt16(offset,s<0?s*0x8000:s*0x7FFF,true);offset+=2;
    }}
    return new Blob([arrayBuf],{type:"audio/wav"});
  };

  const save=async()=>{
    stopPreview();
    setSaving(true);
    try{
      const mimeType=chunksRef.current[0]?.type||"audio/webm";
      const ext=mimeType.includes("mp4")?"mp4":"webm";
      const blob=effect==="normal"
        ?new Blob(chunksRef.current,{type:mimeType})
        :await applyEffectAndGetBlob();
      const fn=`${(currentUser.handle||"anon").replace("@","")}_${Date.now()}.${ext}`;
      const audioUrl=await dbUploadAudio(blob,fn);
      let lat=0,lon=0;
      if(city.trim()){
        try{
          const geo=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city)}&format=json&limit=1`);
          const geoData=await geo.json();
          if(geoData[0]){lat=parseFloat(geoData[0].lat);lon=parseFloat(geoData[0].lon);}
        }catch{}
      }
      const lang=(navigator.language||"es").split("-")[0];
      const spitData={handle:currentUser.handle,role:"",emotion,category,is_mundial:isMundial,thread_id:threadId,thread_order:threadOrder,duration:seconds,lang,lat,lon,audio_url:audioUrl||"",transcript:"",country:currentUser.country||"",respit_of:respitOf||null};
      // If country missing, try to fetch it
      if(!spitData.country){
        const{data:uData}=await sb.from("users").select("country").eq("handle",currentUser.handle).single();
        if(uData?.country)spitData.country=uData.country;
      }
      await dbInsertSpit(spitData);
      if(respitOf){
        try{
          const{data:orig}=await sb.from("spits").select("handle").eq("id",respitOf).single();
          if(orig?.handle&&orig.handle!==currentUser.handle)
            await sb.from("notifications").insert({to_handle:orig.handle,from_handle:currentUser.handle,type:"respit",spit_id:respitOf});
        }catch{}
      }
      setSaving(false);
      onSaved&&onSaved();
      onClose();
    }catch(e){setError("Error al guardar. Intentá de nuevo.");setSaving(false);}
  };

  useEffect(()=>()=>{clearInterval(tRef.current);stopPreview();},[]);

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:1000,display:"flex",alignItems:"flex-end",justifyContent:"center",backdropFilter:"blur(4px)"}}>
      <div style={{background:"#fff",borderRadius:"24px 24px 0 0",padding:"6px 20px 24px",width:"100%",maxWidth:480,boxShadow:"0 -8px 40px rgba(0,0,0,0.12)",animation:"sheetUp 0.3s ease",maxHeight:"96vh",overflowY:"auto"}}>
        <div style={{width:40,height:4,background:"#e0e0e0",borderRadius:2,margin:"12px auto 24px"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div>
            <div style={{fontSize:17,fontWeight:700,color:"#222"}}>{respitOf?"Respit":"Escupí"}</div>
            <div style={{fontSize:12,color:"#aaa",marginTop:2}}>como {currentUser.handle}</div>
          </div>
          <button onClick={onClose} style={{background:"#f5f5f5",border:"none",borderRadius:"50%",width:32,height:32,cursor:"pointer",fontSize:16,color:"#888"}}>×</button>
        </div>
        {error&&<div style={{fontSize:12,color:RAUSCH,background:"#fff0f3",padding:"8px 12px",borderRadius:8,marginBottom:16}}>{error}</div>}

        {!done?(
          <div style={{textAlign:"center",paddingBottom:8}}>
            <div style={{fontSize:60,fontWeight:700,letterSpacing:-2,color:recording?(60-seconds<10?RAUSCH:"#222"):"#ddd",marginBottom:4,transition:"color 0.3s"}}>
              {String(Math.floor((60-seconds)/60)).padStart(2,"0")}:{String((60-seconds)%60).padStart(2,"0")}
            </div>
            <div style={{fontSize:11,color:"#bbb",marginBottom:4}}>
              {recording?<span style={{color:"#aaa"}}>grabando · {seconds}s</span>:"tiempo disponible"}
            </div>
            <div style={{height:4,background:"#f0f0f0",borderRadius:2,marginBottom:36,overflow:"hidden"}}>
              <div style={{height:"100%",background:RAUSCH,borderRadius:2,width:`${((60-seconds)/60)*100}%`,transition:"width 1s linear"}}/>
            </div>
            <button onClick={recording?stop:start} style={{width:80,height:80,borderRadius:"50%",background:recording?RAUSCH:"#fff",border:recording?"none":"2px solid #e8e8e8",cursor:"pointer",fontSize:28,boxShadow:recording?`0 0 0 12px rgba(255,56,92,0.1),0 4px 20px rgba(255,56,92,0.4)`:"0 2px 12px rgba(0,0,0,0.1)",transition:"all 0.3s"}}>
              {recording?"⏹":"🎙"}
            </button>
            <div style={{fontSize:13,color:"#bbb",marginTop:14}}>{recording?"Tocá para terminar":"Tocá para grabar"}</div>
          </div>
        ):(
          <div style={{paddingBottom:8}}>
            {/* Effect selector */}
            <div style={{marginBottom:8}}>
              <div style={{fontSize:11,fontWeight:600,color:"#555",marginBottom:6,textTransform:"uppercase",letterSpacing:0.5}}>Elegí tu voz</div>
              <div style={{display:"flex",gap:8}}>
                {Object.entries(EFFECTS).map(([key,cfg])=>(
                  <button key={key} onClick={()=>{stopPreview();setEffect(key);}} style={{
                    flex:1,padding:"10px 6px",borderRadius:10,cursor:"pointer",
                    background:effect===key?"#fff0f3":"#f7f7f7",
                    border:`1.5px solid ${effect===key?RAUSCH:"#e8e8e8"}`,
                    transition:"all 0.15s",textAlign:"center",
                  }}>
                    <div style={{fontSize:13,fontWeight:600,color:effect===key?RAUSCH:"#333"}}>{cfg.label}</div>
                  </button>
                ))}
              </div>
            </div>

            {/* Preview button */}
            <button onClick={previewing?stopPreview:preview} style={{
              width:"100%",padding:8,borderRadius:10,marginBottom:4,
              background:previewing?"#f0f0f0":"#f7f7f7",
              border:`1.5px solid ${previewing?RAUSCH:"#e8e8e8"}`,

              display:"flex",alignItems:"center",justifyContent:"center",gap:8,
            }}>
              {previewing?(
                <><span style={{fontSize:14}}>⏹</span> Parar preview</>
              ):(
                <><span style={{fontSize:14}}>▶</span> Escuchar antes de publicar</>
              )}
            </button>

            {/* Emotion */}
            <div style={{marginBottom:14}}>
              <div style={{fontSize:11,fontWeight:600,color:"#555",marginBottom:6,textTransform:"uppercase",letterSpacing:0.5}}>¿Cómo te sentís?</div>
              <div style={{display:"flex",gap:8}}>
                {[{e:"😤",label:"Enojado"},{e:"😐",label:"Normal"},{e:"😊",label:"Contento"}].map(({e,label})=>(
                  <button key={e} onClick={()=>setEmotion(e)} style={{flex:1,padding:"8px 6px",borderRadius:10,cursor:"pointer",background:emotion===e?"#fff0f3":"#f7f7f7",border:`1.5px solid ${emotion===e?RAUSCH:"#e8e8e8"}`,transition:"all 0.15s",textAlign:"center"}}>
                    <div style={{fontSize:20,marginBottom:2}}>{e}</div>

                  {isMundial&&<span style={{fontSize:12,color:"#1a3d1a"}}>✓</span>}
                </div>

            {/* Thread picker */}
            <div style={{marginBottom:14}}>
              <div style={{fontSize:11,fontWeight:600,color:"#555",marginBottom:6,textTransform:"uppercase",letterSpacing:0.5}}>¿Es parte de un hilo?</div>
              <div style={{display:"flex",gap:8,marginBottom:showThreadPicker?12:0}}>
                <button onClick={()=>{setThreadId(null);setThreadOrder(1);setShowThreadPicker(false);}} style={{flex:1,padding:"8px 6px",borderRadius:10,cursor:"pointer",background:(!threadId&&!showThreadPicker)?"#fff0f3":"#f7f7f7",border:`1.5px solid ${(!threadId&&!showThreadPicker)?RAUSCH:"#e8e8e8"}`,fontSize:12,fontWeight:600,color:(!threadId&&!showThreadPicker)?RAUSCH:"#888"}}>
                  🎙️ Spit nuevo
                </button>
                <button onClick={async()=>{
                  setShowThreadPicker(true);
                  const{data}=await sb.from("spits").select("*").eq("handle",currentUser.handle).order("created_at",{ascending:false}).limit(20);
                  setMySpitsForThread(data||[]);
                }} style={{flex:1,padding:"8px 6px",borderRadius:10,cursor:"pointer",background:(threadId||showThreadPicker)?"#fff0f3":"#f7f7f7",border:`1.5px solid ${(threadId||showThreadPicker)?RAUSCH:"#e8e8e8"}`,fontSize:12,fontWeight:600,color:(threadId||showThreadPicker)?RAUSCH:"#888"}}>
                  🧵 Continuar hilo
                </button>
              </div>
              {showThreadPicker&&!threadId&&(
                <div style={{background:"#f9f9f9",borderRadius:12,padding:12,maxHeight:180,overflowY:"auto"}}>
                  {mySpitsForThread.length===0?(
                    <div style={{fontSize:12,color:"#bbb",textAlign:"center",padding:12}}>No tenés spits anteriores.</div>
                  ):mySpitsForThread.map(s=>(
                    <div key={s.id} onClick={async()=>{
                      const{data}=await sb.from("spits").select("thread_order").eq("thread_id",s.thread_id||s.id).order("thread_order",{ascending:false}).limit(1);
                        const rootId=s.thread_id||s.id;
                      const nextOrder=data&&data[0]?data[0].thread_order+1:2;
                      // Make sure the root spit also has thread_id pointing to itself
                      if(!s.thread_id){
                        await sb.from("spits").update({thread_id:s.id,thread_order:1}).eq("id",s.id);
                      }
                      setThreadId(rootId);
                      setThreadOrder(nextOrder);
                      setShowThreadPicker(false);
                    }} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:10,cursor:"pointer",marginBottom:6,background:"#fff",border:"1px solid #f0f0f0"}}>
                      <div style={{fontSize:18}}>🎙️</div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:12,color:"#555",fontWeight:600}}>{s.duration}s · {s.category||"sin categoría"}</div>
                        <div style={{fontSize:11,color:"#bbb"}}>{new Date(s.created_at).toLocaleDateString("es-AR")}</div>
                      </div>
                      <span style={{fontSize:11,color:RAUSCH,fontWeight:600}}>+ Agregar</span>
                    </div>
                  ))}
                </div>
              )}
              {threadId&&(
                <div style={{fontSize:12,color:RAUSCH,padding:"6px 12px",background:"#fff0f3",borderRadius:8}}>
                  ✓ Se va a agregar al hilo · parte {threadOrder}
                  <button onClick={()=>{setThreadId(null);setThreadOrder(1);setShowThreadPicker(false);}} style={{background:"none",border:"none",color:"#aaa",fontSize:11,cursor:"pointer",marginLeft:8}}>Cancelar</button>
                </div>
              )}
            </div>

            {/* Category */}
            <div style={{marginBottom:14}}>
              <div style={{fontSize:11,fontWeight:600,color:"#555",marginBottom:6,textTransform:"uppercase",letterSpacing:0.5}}>Categoría <span style={{color:RAUSCH}}>*</span></div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {[
                  {id:"amor",label:"AMOR / Desamor (Puterío)"},
                  {id:"chismes",label:"CHISMES que no puedo guardar"},
                  {id:"jefes",label:"JEFES / Trabajo"},
                  {id:"bronca",label:"QUEJAS / Broncas / Frustraciones"},
                  {id:"anecdotas",label:"ANÉCDOTAS / Pasaron cosas"},
                  {id:"injusticias",label:"INJUSTICIAS / Indignación"},
                  {id:"alegria",label:"ALEGRÍAS / Todo lo bueno que quiero decir"},
                  {id:"opinion",label:"OPINIÓN / Lo que pienso"},
                ].map(c=>(
                  <button key={c.id} onClick={()=>setCategory(c.id)} style={{
                    flex:"1 1 calc(50% - 4px)",padding:"10px 8px",borderRadius:12,cursor:"pointer",
                    background:category===c.id?"#fff0f3":"#f7f7f7",
                    border:`1.5px solid ${category===c.id?RAUSCH:"#e8e8e8"}`,
                    transition:"all 0.15s",textAlign:"center",
                  }}>
                    <div style={{fontSize:11,fontWeight:600,color:category===c.id?RAUSCH:"#555",lineHeight:1.3}}>{c.label}</div>
                  </button>
                ))}
              </div>
              {!category&&<div style={{fontSize:11,color:"#bbb",marginTop:6}}>Elegí una categoría para publicar</div>}
            </div>

            {/* Publish */}
            <button onClick={()=>{if(!category){setError("Elegí una categoría antes de publicar.");return;}save();}} disabled={saving} style={{
              width:"100%",padding:13,borderRadius:12,
              background:saving?"#ffb3c0":!category?"#e0e0e0":RAUSCH,
              border:"none",color:"#fff",fontSize:15,fontWeight:700,
              cursor:saving||!category?"not-allowed":"pointer",
              boxShadow:category?"0 4px 16px rgba(255,56,92,0.3)":"none",
            }}>
              {saving?"Guardando...":"Publicar"}
            </button>
            <div style={{fontSize:11,color:"#bbb",textAlign:"center",marginTop:8}}>
              {seconds}s · efecto: {EFFECTS[effect].label}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function CompleteProfile({email,authId,onDone}){
  const[showLegalForReg,setShowLegalForReg]=useState(false);
  const[handle,setHandle]=useState("");
  const[error,setError]=useState("");
  const[loading,setLoading]=useState(false);
  const iStyle={width:"100%",padding:"12px 14px",background:"#F3F0FF",border:"1.5px solid #ebebeb",borderRadius:10,fontSize:14,color:"#222",outline:"none"};

  const doSave=async()=>{
    const h="@"+handle.replace(/^@/,"").toLowerCase().replace(/[^a-z0-9_]/g,"");
    const RESERVED=["@spit", "@spititapp", "@airspit", "@admin", "@soporte", "@support", "@oficial", "@official", "@spit.app", "@spititapp.app"];
    if(RESERVED.includes(h)){setError("Ese nickname no está disponible.");return;}
    setLoading(true);
    let country="";
    try{const geo=await fetch("https://ipapi.co/json/");const geoData=await geo.json();if(geoData&&geoData.country_code)country=geoData.country_code;}catch{}
    const{error:err}=await sb.from("users").insert([{email,handle:h,role:"",auth_id:authId,country}]);
    if(err){setError("Ese nickname ya está en uso.");setLoading(false);return;}
    setLoading(false);
    onDone({email,handle:h,role:"",country});
  };
  const save=async()=>{
    if(!handle){setError("Elegí un nickname.");return;}
    const h="@"+handle.replace(/^@/,"").toLowerCase().replace(/[^a-z0-9_]/g,"");
    if(h.length<4){setError("El nickname debe tener al menos 3 caracteres.");return;}
    setShowLegalForReg(true);
    return;
    setLoading(true);
    let country="";
    try{const geo=await fetch("https://ipapi.co/json/");const geoData=await geo.json();if(geoData&&geoData.country_code)country=geoData.country_code;}catch{}
    const{error:err}=await sb.from("users").insert([{email,handle:h,role:"",auth_id:authId,country}]);
    if(err){setError("Ese nickname ya está en uso.");setLoading(false);return;}
    setLoading(false);
    onDone({email,handle:h,role:"",country});
  };

  if(showLegalForReg)return <LegalUnified onClose={()=>setShowLegalForReg(false)} onAccept={doSave} requireAccept={true}/>;
  return(
    <div style={{width:"100%",maxWidth:380,background:"#fff",borderRadius:16,boxShadow:"0 4px 32px rgba(0,0,0,0.08)",padding:"32px 28px"}}>
      <div style={{fontSize:16,fontWeight:700,color:"#222",marginBottom:6}}>¿Cómo querés que te llamen?</div>
      <div style={{fontSize:13,color:"#aaa",marginBottom:24}}>Creá tu usuario.</div>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div style={{position:"relative"}}>
          <span style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",color:"#aaa"}}>@</span>
          <input type="text" placeholder="tunickname" value={handle} onChange={e=>setHandle(e.target.value.replace(/^@/,""))} style={{...iStyle,paddingLeft:28}}/>
        </div>
        {error&&<div style={{fontSize:12,color:RAUSCH,background:"#fff0f3",padding:"8px 12px",borderRadius:8}}>{error}</div>}
        <button onClick={save} disabled={loading} style={{width:"100%",padding:16,borderRadius:10,background:loading?"#ffb3c0":RAUSCH,border:"none",color:"#fff",fontSize:15,fontWeight:700,cursor:loading?"not-allowed":"pointer",boxShadow:"0 4px 16px rgba(255,56,92,0.3)"}}>
          {loading?"Guardando...":"Empezar a escupir 🔥"}
        </button>
      </div>
    </div>
  );
}

function MundialCard({onSpit}){
  const[prompts,setPrompts]=useState([]);
  const[currentIdx,setCurrentIdx]=useState(0);
  const[visible,setVisible]=useState(true);

  useEffect(()=>{
    sb.from("mundial_prompt").select("*").eq("active",true).order("order_num").then(({data})=>{
      if(data&&data.length>0)setPrompts(data);
    });
  },[]);

  useEffect(()=>{
    if(prompts.length<=1)return;
    const interval=setInterval(()=>{
      setVisible(false);
      setTimeout(()=>{
        setCurrentIdx(i=>(i+1)%prompts.length);
        setVisible(true);
      },600);
    },4000);
    return()=>clearInterval(interval);
  },[prompts]);

  if(prompts.length===0)return null;

  return(
    <div style={{
      background:"linear-gradient(135deg, #8ab83e 0%, #aed956 50%, #96c445 100%)",

        fontSize:17,fontWeight:600,color:"#fff",lineHeight:1.4,

        opacity:visible?1:0,
        transition:"opacity 0.5s ease",
      }}>

        onMouseOut={e=>e.currentTarget.style.transform="scale(1)"}>
        🎙️ Escupí lo que sentís
      </button>
    </div>
  );
}

    const fmt=t=>{const m=Math.floor(t/60);const sc=Math.floor(t%60);return`${m}:${sc<10?"0":""}${sc}`;};

    return(
      <div style={{marginBottom:4}}>
        <div style={{background:"#fff",borderRadius:14,padding:"12px 16px",boxShadow:"0 1px 6px rgba(0,0,0,0.05)"}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <Avatar icon="waves" color={handleColor(s.handle)} size={40}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                <span onClick={e=>{e.stopPropagation();setViewProfile(s.handle);}} style={{fontSize:13,fontWeight:700,color:"#222",cursor:"pointer"}}>{s.handle}</span>
                {VERIFIED.has(s.handle)&&<VerifiedBadge/>}
                <span style={{fontSize:12}}>{getFlag(s)}</span>
                {s.emotion&&<span style={{fontSize:12}}>{s.emotion}</span>}
              </div>
              <div style={{fontSize:11,color:"#aaa"}}>{s.duration}s{s.audio_url?" · 🔊":""}{s.category&&CATS[s.category]?" · "+CATS[s.category]:""}</div>
            </div>
            <button onClick={e=>{e.stopPropagation();toggleSave(s.id);}} style={{background:"none",border:"none",cursor:"pointer",padding:6,display:"flex",alignItems:"center",flexShrink:0}}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill={savedIds.has(s.id)?RAUSCH:"none"} stroke={savedIds.has(s.id)?RAUSCH:"#ccc"} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/>
              </svg>
            </button>
            {currentUser&&s.handle!==currentUser?.handle&&<button onClick={e=>{e.stopPropagation();onToggleLike&&onToggleLike(s.id);}} style={{background:"none",border:"none",cursor:"pointer",padding:6,display:"flex",alignItems:"center",flexShrink:0}}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill={likedIds?.has(s.id)?RAUSCH:"none"} stroke={likedIds?.has(s.id)?RAUSCH:"#ccc"} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </button>}
            {playing&&<button onClick={e=>{e.stopPropagation();setSpeed(s=>{const i=SPEEDS.indexOf(s);const next=SPEEDS[(i+1)%SPEEDS.length];if(audioRef.current)audioRef.current.playbackRate=next;return next;});}} style={{background:speed!==1?"#fff0f3":"#f0f0f0",border:`1.5px solid ${speed!==1?RAUSCH:"#e8e8e8"}`,borderRadius:6,padding:"3px 7px",cursor:"pointer",fontSize:11,fontWeight:700,color:speed!==1?RAUSCH:"#888",flexShrink:0}}>
              {speed===1?"1x":speed===1.5?"1.5x":"2x"}
            </button>}
            <button onClick={togglePlay} style={{width:36,height:36,borderRadius:"50%",background:"rgba(255,56,92,0.08)",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <span style={{color:RAUSCH,fontSize:14}}>{playing?"⏸":"▶"}</span>
            </button>
          </div>
          {playing&&(
            <div style={{marginTop:10,paddingLeft:52}}>
              <div style={{height:3,background:"#f0f0f0",borderRadius:2,overflow:"hidden"}}>
                <div style={{height:"100%",background:RAUSCH,borderRadius:2,width:`${pct}%`,transition:"width 0.25s linear"}}/>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",marginTop:4}}>
                <span style={{fontSize:10,color:"#bbb"}}>{fmt(progress)}</span>
                <span style={{fontSize:10,color:"#bbb"}}>{fmt(dur)}</span>
              </div>
            </div>
          )}
          {/* Respit + Report buttons */}
          <div style={{paddingLeft:52,marginTop:10,display:"flex",alignItems:"center",gap:8}}>
            <button onClick={e=>{e.stopPropagation();onRespit(s.id);}} style={{background:"none",border:"1px solid #ebebeb",borderRadius:20,padding:"4px 12px",fontSize:11,color:"#888",cursor:"pointer",fontWeight:600,display:"flex",alignItems:"center",gap:4}}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#888" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
              Respit {respits.length>0&&<span style={{background:"#f0f0f0",borderRadius:10,padding:"0 6px",fontSize:10}}>{respits.length}</span>}
            </button>
            {s.handle!==currentUser?.handle&&(
              <button onClick={e=>{e.stopPropagation();setShowReport(true);}} style={{background:"none",border:"none",padding:"4px 6px",cursor:"pointer",display:"flex",alignItems:"center"}}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ccc" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
              </button>
            )}
          </div>
          {showReport&&<ReportModalStandalone spitId={s.id} reporterHandle={currentUser?.handle} onClose={()=>setShowReport(false)}/>}
        </div>
        {/* Respits */}
        {respits.length>0&&(
          <div style={{marginLeft:24,marginTop:2,display:"flex",flexDirection:"column",gap:2}}>
            {respits.map(r=><RespitCard key={r.id} r={r} setViewProfile={setViewProfile}/>)}
          </div>
        )}
      </div>
    );
  };

  const renderFeed=(feedSpits,emptyMsg)=>{
    if(feedSpits.length===0)return <div style={{background:"#fff",borderRadius:16,padding:32,textAlign:"center",color:"#bbb",fontSize:14}}>{emptyMsg}</div>;
    const originalSpits=feedSpits.filter(s=>!s.respit_of);
    const groups=groupSpits(originalSpits);
    return(
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {groups.map(g=>{
          if(g.type==="thread")return <ThreadCard key={g.id} thread={g.spits} firstIndex={g.firstIndex}/>;
          const s=g.spit;const i=g.index;
          return <FeedCard key={s.id} s={s} i={i} savedIds={savedIds} toggleSave={toggleSave} setListenStart={setListenStart} setShowListen={setShowListen} setViewProfile={setViewProfile} allSpits={feedSpits} onRespit={(id)=>{setRespitOf(id);setShowRecord(true);}} currentUser={user} playingId={playingId} setPlayingId={setPlayingId} likedIds={likedIds} onToggleLike={async(id)=>{if(likedIds.has(id)){await sb.from("reactions").delete().eq("spit_id",id).eq("handle",user.handle).eq("emoji","❤️");setLikedIds(p=>{const s=new Set(p);s.delete(id);return s;});}else{await sb.from("reactions").insert([{spit_id:id,handle:user.handle,emoji:"❤️"}]);setLikedIds(p=>new Set([...p,id]));}}} />;
        })}
      </div>
    );
  };

  const followingSpits=spits.filter(s=>following.includes(s.handle));

  return(
    <div style={{minHeight:"100vh",background:"#F3F0FF",fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",paddingBottom:80}}>

      {/* Header */}
      <header style={{background:"#fff",padding:"0 16px",height:56,display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid #ebebeb",position:"sticky",top:0,zIndex:50}}>
        <div style={{fontSize:18,fontWeight:800,letterSpacing:-0.5,cursor:"pointer"}} onClick={()=>setShowLanding(true)}>
          <span style={{fontFamily:"'DM Sans', sans-serif",fontStyle:"italic",fontWeight:900,color:"#fff",letterSpacing:"-2px"}}>spit</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:4}}>
          {activeTab==="global"&&(
            <button onClick={()=>{setShowSearch(p=>!p);setSearchQuery("");setSearchResults([]);}} style={{background:"none",border:"none",padding:6,cursor:"pointer",display:"flex",alignItems:"center"}}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={showSearch?RAUSCH:"#aaa"} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="11" cy="11" r="7"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </button>
          )}
          <button onClick={()=>{setShowNotifs(true);markAllRead();}} style={{background:"none",border:"none",padding:6,cursor:"pointer",position:"relative",display:"flex",alignItems:"center"}}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#aaa" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            {notifications.filter(n=>!n.read).length>0&&(
              <span style={{position:"absolute",top:4,right:4,width:8,height:8,background:RAUSCH,borderRadius:"50%",border:"2px solid #fff"}}/>
            )}
          </button>
        </div>
      </header>

      {/* Tab content */}
      <div style={{maxWidth:600,margin:"0 auto",padding:"16px 16px 16px"}}>

        {/* GLOBAL TAB */}
        {activeTab==="global"&&(
          <div>
            {/* Search bar */}
            {showSearch&&(
              <div style={{marginBottom:12}}>
                <div style={{position:"relative"}}>
                  <svg style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)"}} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#bbb" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                  <input autoFocus type="text" placeholder="Buscar por nickname..." value={searchQuery}
                    onChange={async e=>{
                      const q=e.target.value;
                      setSearchQuery(q);
                      if(q.length<2){setSearchResults([]);return;}
                      setSearchLoading(true);
                      const handle=q.startsWith("@")?q:"@"+q;
                      const{data}=await sb.from("users").select("handle,country,bio").ilike("handle",`%${handle.replace("@","")}%`).limit(8);
                      setSearchResults(data||[]);
                      setSearchLoading(false);
                    }}
                    style={{width:"100%",padding:"10px 14px 10px 36px",borderRadius:12,border:"1.5px solid #ebebeb",fontSize:14,color:"#222",background:"#fff",outline:"none",boxSizing:"border-box",boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}
                  />
                </div>
                {searchLoading&&<div style={{fontSize:12,color:"#bbb",textAlign:"center",padding:12}}>Buscando...</div>}
                {!searchLoading&&searchQuery.length>=2&&searchResults.length===0&&(
                  <div style={{fontSize:12,color:"#bbb",textAlign:"center",padding:12}}>No se encontraron usuarios.</div>
                )}
                {searchResults.length>0&&(
                  <div style={{background:"#fff",borderRadius:12,boxShadow:"0 2px 12px rgba(0,0,0,0.08)",overflow:"hidden",marginTop:4}}>
                    {searchResults.map(u=>(
                      <div key={u.handle} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",borderBottom:"1px solid #f5f5f5"}}>
                        <Avatar icon={u.avatar_icon||"waves"} color={u.avatar_color||handleColor(u.handle)} size={40}/>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{display:"flex",alignItems:"center",gap:6}}>
                            <span style={{fontSize:14,fontWeight:700,color:"#222"}}>{u.handle}</span>
                            {VERIFIED.has(u.handle)&&<VerifiedBadge/>}
                          </div>
                          {u.bio&&<div style={{fontSize:16,marginTop:2,letterSpacing:2}}>{u.bio}</div>}
                        </div>
                        <button onClick={()=>toggleFollow(u.handle)} style={{background:following.includes(u.handle)?"none":RAUSCH,border:following.includes(u.handle)?"1.5px solid #ebebeb":"none",borderRadius:20,padding:"6px 14px",fontSize:12,fontWeight:600,color:following.includes(u.handle)?"#888":"#fff",cursor:"pointer",flexShrink:0}}>
                          {following.includes(u.handle)?"Siguiendo":"Seguir"}
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
            <MundialCard onSpit={()=>{setMundialDefault(true);setShowRecord(true);}}/>

            {/* Mundial filter toggle */}
            <div style={{display:"flex",gap:8,marginBottom:12}}>
              <button onClick={()=>setMundialFilter(false)} style={{
                flex:1,padding:"8px 0",borderRadius:10,border:"none",cursor:"pointer",fontSize:13,fontWeight:600,
                background:!mundialFilter?"#222":"#f0f0f0",
                color:!mundialFilter?"#fff":"#888",
                transition:"all 0.2s",
              }}>Todos los spits</button>
              <button onClick={()=>setMundialFilter(true)} style={{
                flex:1,padding:"8px 0",borderRadius:10,border:"none",cursor:"pointer",fontSize:13,fontWeight:600,
                background:mundialFilter?"#aed956":"#f0f0f0",
                color:mundialFilter?"#1a1a1a":"#888",
                display:"flex",alignItems:"center",justifyContent:"center",gap:6,
                transition:"all 0.2s",
              }}>⚽ Mundial 2026</button>
            </div>

            <div style={{background:"#fff",borderRadius:16,padding:"20px",boxShadow:"0 2px 12px rgba(0,0,0,0.06)",marginBottom:16}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                <div>
                  <div style={{fontSize:12,color:"#aaa",fontWeight:600,textTransform:"uppercase",letterSpacing:0.5}}>Voces en el mundo</div>
                  <div style={{fontSize:36,fontWeight:800,letterSpacing:-1.5,color:"#222",lineHeight:1}}>{spits.length}</div>
                </div>
                <button onClick={()=>setShowListenPicker(true)} style={{background:RAUSCH,border:"none",color:"#fff",padding:"12px 20px",borderRadius:12,cursor:"pointer",fontSize:14,fontWeight:700,boxShadow:"0 4px 12px rgba(255,56,92,0.35)",display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:18}}>▶</span> Escuchar
                </button>
              </div>
              {mood&&mood.some(m=>m.pct>0)&&(
                <div>
                  <div style={{fontSize:11,color:"#bbb",marginBottom:6}}>Ánimo global</div>
                  <div style={{display:"flex",borderRadius:8,overflow:"hidden",height:8,marginBottom:8}}>
                    {mood.map(({e,pct})=>(
                      <div key={e} style={{width:`${pct}%`,background:e==="😤"?RAUSCH:e==="😐"?"#aaa":BABU,transition:"width 0.5s ease"}}/>
                    ))}
                  </div>
                  <div style={{display:"flex",gap:12}}>
                    {mood.map(({e,pct})=>(
                      <div key={e} style={{display:"flex",alignItems:"center",gap:4,fontSize:12,color:"#888"}}>
                        <span>{e}</span><span style={{fontWeight:600}}>{pct}%</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
            <div style={{fontSize:12,fontWeight:600,color:"#aaa",textTransform:"uppercase",letterSpacing:0.5,marginBottom:10,paddingLeft:4}}>Últimos spits</div>
            {renderFeed(mundialFilter?spits.filter(s=>s.is_mundial):spits,mundialFilter?"Todavía no hay spits del Mundial. ¡Sé el primero!":"Nadie ha escupido todavía. ¡Sé el primero!")}
          </div>
        )}

        {/* FOLLOWING TAB */}
        {activeTab==="following"&&(
          <div>
            <div style={{fontSize:12,fontWeight:600,color:"#aaa",textTransform:"uppercase",letterSpacing:0.5,marginBottom:12,paddingLeft:4}}>Voces que seguís</div>
            {following.length===0?(
              <div style={{background:"#fff",borderRadius:16,padding:32,textAlign:"center",color:"#bbb",fontSize:14}}>
                Todavía no seguís a nadie. Explorá el feed global y seguí voces que te interesen.
              </div>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {following.map(handle=>{
                  const userData=followingUsers.find(u=>u.handle===handle);
                  const country=userData?.country||"";
                  return(
                    <div key={handle} style={{background:"#fff",borderRadius:14,padding:"16px 20px",boxShadow:"0 1px 6px rgba(0,0,0,0.05)",display:"flex",alignItems:"center",gap:14,cursor:"pointer"}} onClick={()=>setViewProfile(handle)}>
                      <Avatar icon={userData?.avatar_icon||"waves"} color={userData?.avatar_color||handleColor(handle)} size={48}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:"flex",alignItems:"center",gap:6}}>
                          <span style={{fontSize:15,fontWeight:700,color:"#222"}}>{handle}</span>
                          {VERIFIED.has(handle)&&<VerifiedBadge/>}
                        </div>
                        {userData?.bio&&<div style={{fontSize:16,marginTop:2,letterSpacing:2}}>{userData.bio}</div>}
                      </div>
                      <button onClick={e=>{e.stopPropagation();toggleFollow(handle);}} style={{background:"none",border:"1.5px solid #ebebeb",borderRadius:20,padding:"6px 16px",fontSize:12,fontWeight:600,color:RAUSCH,cursor:"pointer",flexShrink:0,whiteSpace:"nowrap"}}>
                        Dejar de seguir
                      </button>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {/* LIKED TAB */}
        {activeTab==="saved"&&(
          <div>
            <div style={{fontSize:12,fontWeight:600,color:"#aaa",textTransform:"uppercase",letterSpacing:0.5,marginBottom:10,paddingLeft:4}}>Guardados</div>
            {renderFeed(savedSpits,<span style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,color:"#bbb",fontSize:13}}>Todavía no guardaste ningún spit. Tocá el <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#bbb" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg> en el feed o en el modo escucha.</span>)}
          </div>
        )}

        {/* PROFILE TAB */}
        {activeTab==="profile"&&(
          <div>
            <div style={{background:"#fff",borderRadius:16,padding:24,boxShadow:"0 2px 12px rgba(0,0,0,0.06)",marginBottom:16}}>

              {/* Header: avatar + info + gear */}
              <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:16}}>
                <Avatar icon={user?.avatar_icon||"waves"} color={user?.avatar_color||handleColor(user?.handle||"")} size={56}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:18,fontWeight:700,color:"#222",display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                    {user.handle}{VERIFIED.has(user.handle)&&<VerifiedBadge/>}
                  </div>
                  {/* Bio inline, smaller */}
                  {!editingBio&&(
                    <div style={{display:"flex",alignItems:"center",gap:6,marginTop:4}}>
                      {user.bio?(
                        <>
                          <span style={{fontSize:16,letterSpacing:2}}>{user.bio}</span>
                          <button onClick={()=>{setBioText(user.bio||"");setEditingBio(true);}} style={{background:"none",border:"none",fontSize:10,color:"#ccc",cursor:"pointer",textDecoration:"underline",padding:0}}>Editar</button>
                        </>
                      ):(
                        <button onClick={()=>setEditingBio(true)} style={{background:"none",border:"none",fontSize:11,color:"#bbb",cursor:"pointer",textDecoration:"underline",padding:0}}>+ Agregar emojis</button>
                      )}
                    </div>
                  )}
                </div>
                <button onClick={()=>{setShowSettings(true);setSettingsView(null);}} style={{background:"none",border:"none",cursor:"pointer",padding:8,display:"flex",alignItems:"center",flexShrink:0}}>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#aaa" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                  </svg>
                </button>
              </div>

              {/* Bio editing mode */}
              {editingBio&&(
                <div style={{marginBottom:12,paddingTop:12,borderTop:"1px solid #f5f5f5"}}>
                  <div style={{fontSize:12,color:"#aaa",marginBottom:8}}>Solo emojis · máximo 10</div>
                  <input type="text" value={bioText}
                    onChange={e=>{
                      const val=e.target.value;
                      const hasText=/[a-zA-Z0-9áéíóúüñÁÉÍÓÚÜÑ#@.,!?¿¡\s]/.test(val);
                      if(hasText){setBioError("Solo se permiten emojis.");return;}
                      const segs=[...new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(val)];
                      if(segs.length>10){setBioError("Máximo 10 emojis.");return;}
                      setBioError("");setBioText(val);
                    }}
                    placeholder="😤🔥❤️..."
                    style={{width:"100%",padding:"12px 14px",borderRadius:10,border:"1.5px solid #ebebeb",fontSize:22,color:"#222",background:"#f9f9f9",outline:"none",boxSizing:"border-box",letterSpacing:4}}
                  />
                  {bioError&&<div style={{fontSize:11,color:RAUSCH,marginTop:4}}>{bioError}</div>}
                  <div style={{fontSize:11,color:"#bbb",marginTop:4,textAlign:"right"}}>{[...new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(bioText)].length}/10</div>
                  <div style={{display:"flex",gap:8,marginTop:8}}>
                    <button onClick={async()=>{const{error}=await sb.from("users").update({bio:bioText}).eq("handle",user.handle);if(error){setBioError("Error al guardar: "+error.message);return;}setUser(p=>({...p,bio:bioText}));setEditingBio(false);}} style={{flex:1,padding:"10px",borderRadius:10,background:RAUSCH,border:"none",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>Guardar</button>
                    <button onClick={()=>{setEditingBio(false);setBioText(user.bio||"");setBioError("");}} style={{flex:1,padding:"10px",borderRadius:10,background:"#f5f5f5",border:"none",color:"#555",fontSize:13,cursor:"pointer"}}>Cancelar</button>
                  </div>
                </div>
              )}

              {/* Stats */}
              <div style={{display:"flex",gap:24,paddingTop:12,borderTop:"1px solid #f5f5f5"}}>
                <div style={{textAlign:"center"}}>
                  <div style={{fontSize:20,fontWeight:700,color:"#222"}}>{mySpits.length}</div>

                  <div style={{fontSize:15,fontWeight:700,color:"#222"}}>Cambiar contraseña</div>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:12}}>
                  <input type="password" placeholder="Nueva contraseña" value={newPassword} onChange={e=>setNewPassword(e.target.value)}
                    style={{width:"100%",padding:"12px 14px",borderRadius:10,border:"1.5px solid #ebebeb",fontSize:14,color:"#222",background:"#f9f9f9",outline:"none",boxSizing:"border-box"}}/>
                  <input type="password" placeholder="Repetir contraseña" value={newPassword2} onChange={e=>setNewPassword2(e.target.value)}
                    style={{width:"100%",padding:"12px 14px",borderRadius:10,border:"1.5px solid #ebebeb",fontSize:14,color:"#222",background:"#f9f9f9",outline:"none",boxSizing:"border-box"}}/>
                </div>
                {passwordMsg&&<div style={{fontSize:11,color:passwordMsg.includes("✅")?BABU:RAUSCH,marginBottom:8}}>{passwordMsg}</div>}
                <button onClick={async()=>{
                  if(newPassword.length<6){setPasswordMsg("Mínimo 6 caracteres.");return;}
                  if(newPassword!==newPassword2){setPasswordMsg("Las contraseñas no coinciden.");return;}
                  const{error}=await sb.auth.updateUser({password:newPassword});
                  if(error){setPasswordMsg("Error: "+error.message);return;}
                  setPasswordMsg("✅ Contraseña actualizada.");
                  setNewPassword("");setNewPassword2("");
                  setTimeout(()=>{setShowSettings(false);setSettingsView(null);setPasswordMsg("");},1500);
                }} style={{width:"100%",padding:14,borderRadius:12,background:RAUSCH,border:"none",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}}>Guardar</button>
              </>
            )}
          </div>
        </div>
      )}
      {/* Followers modal */}
      {showFollowers&&(
        <UserListModal title="Seguidores" handles={followersList} onClose={()=>setShowFollowers(false)} onViewProfile={(h)=>{setShowFollowers(false);setViewProfile(h);}} following={following} onToggleFollow={toggleFollow} currentUser={user}/>
      )}

      {/* Following modal */}
      {showFollowing&&(
        <UserListModal title="Siguiendo" handles={following} onClose={()=>setShowFollowing(false)} onViewProfile={(h)=>{setShowFollowing(false);setViewProfile(h);}} following={following} onToggleFollow={toggleFollow} currentUser={user}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(rs=>{for(let r of rs)r.unregister();});}</script>
</body>
</html>
