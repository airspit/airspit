async function dbRegister(email,password,handle,role){
  const{data:a,error:e}=await sb.auth.signUp({email,password});
  if(e)return{error:e.message};
  await sb.from("users").insert([{email,handle,role,auth_id:a.user?.id}]);
  return{ok:true};
}
async function dbLogin(email,password){
  const{data:a,error:e}=await sb.auth.signInWithPassword({email,password});
  if(e)return{error:"Email o contraseña incorrectos."};
  const{data:u}=await sb.from("users").select("*").eq("email",email).single();
  return{data:u};
}
async function dbGetSession(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return null;
  const{data}=await sb.from("users").select("*").eq("auth_id",session.user.id).single();
  return data||null;
}
async function dbGetSpits(){
  const{data}=await sb.from("spits").select("*").order("created_at",{ascending:false});
  return(data||[]).map(s=>({...s,reactions:{}}));
}
async function dbInsertSpit(spit){
  const{data,error}=await sb.from("spits").insert([spit]).select().single();
  return{data,error};
}
async function dbUploadAudio(blob,filename){
  const{error}=await sb.storage.from("audios").upload(filename,blob,{contentType:"audio/webm",upsert:true});
  if(error)return null;
  const{data}=sb.storage.from("audios").getPublicUrl(filename);
  return data.publicUrl;
}
async function translateText(text,targetLang,sourceLang){
  const src=sourceLang?.split("-")[0],tgt=targetLang?.split("-")[0];
  if(!src||!tgt||src===tgt)return null;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:500,
        messages:[{role:"user",content:`Translate to ${tgt}. Return ONLY the translation:\n\n${text}`}]})
    });
    const d=await res.json();
    return d.content?.[0]?.text?.trim()||null;
  }catch{return null;}
}

// ── Canvas World Map ──────────────────────────────────────────────────────────
function GlobeSVG({spits,onSpitClick,activeSpit}){
  const canvasRef=useRef(null);
  const[worldData,setWorldData]=useState(null);
  const[size,setSize]=useState({w:800,h:400});
  const containerRef=useRef(null);

  // Cluster spits
  const CLUSTER_DIST=2.5;
  const used=new Set();
  const clusters=[];
  spits.forEach((s,i)=>{
    if(used.has(i))return;
    const group=[s];
    used.add(i);
    spits.forEach((s2,j)=>{
      if(used.has(j))return;
      const dx=(s.x||50)-(s2.x||50),dy=(s.y||50)-(s2.y||50);
      if(Math.sqrt(dx*dx+dy*dy)<CLUSTER_DIST){group.push(s2);used.add(j);}
    });
    clusters.push(group);
  });

  // Load world data once
  useEffect(()=>{
    fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json")
      .then(r=>r.json())
      .then(world=>{
        const countries=topojson.feature(world,world.objects.countries);
        const borders=topojson.mesh(world,world.objects.countries,(a,b)=>a!==b);
        setWorldData({countries,borders});
      }).catch(()=>{});
  },[]);

  // Update canvas size
  useEffect(()=>{
    const el=containerRef.current;
    if(!el)return;
    const update=()=>setSize({w:el.clientWidth,h:el.clientHeight});
    update();
    const ro=new ResizeObserver(update);
    ro.observe(el);
    return()=>ro.disconnect();
  },[]);

  // Draw map on canvas
  useEffect(()=>{
    const canvas=canvasRef.current;
    if(!canvas||!worldData)return;
    const {w,h}=size;
    canvas.width=w*window.devicePixelRatio;
    canvas.height=h*window.devicePixelRatio;
    canvas.style.width=w+"px";
    canvas.style.height=h+"px";
    const ctx=canvas.getContext("2d");
    ctx.scale(window.devicePixelRatio,window.devicePixelRatio);

    // Mercator-like projection
    const proj=(lon,lat)=>{
      const x=(lon+180)/360*w;
      const latR=Math.max(-85,Math.min(85,lat))*Math.PI/180;
      const y=h/2-w/(2*Math.PI)*Math.log(Math.tan(Math.PI/4+latR/2));
      return[x,y];
    };

    // Background
    ctx.fillStyle="#f0f4f8";
    ctx.fillRect(0,0,w,h);

    // Ocean tint
    ctx.fillStyle="#dce8f5";
    ctx.fillRect(0,0,w,h);

    // Draw countries
    const drawGeo=(geom,fill,stroke,lineWidth)=>{
      const drawRing=(ring)=>{
        ring.forEach(([lon,lat],i)=>{
          const[x,y]=proj(lon,lat);
          if(i===0)ctx.moveTo(x,y);
          else ctx.lineTo(x,y);
        });
        ctx.closePath();
      };
      ctx.beginPath();
      if(geom.type==="Polygon"){
        geom.coordinates.forEach(drawRing);
      } else if(geom.type==="MultiPolygon"){
        geom.coordinates.forEach(poly=>poly.forEach(drawRing));
      }
      if(fill){ctx.fillStyle=fill;ctx.fill();}
      if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lineWidth||0.5;ctx.stroke();}
    };

    // Fill countries
    worldData.countries.features.forEach(f=>{
      drawGeo(f.geometry,"#e8eef5",null);
    });

    // Country borders
    const drawMesh=(mesh,stroke,lw)=>{
      ctx.beginPath();
      const drawCoords=(coords)=>{
        coords.forEach((ring,ri)=>{
          ring.forEach(([lon,lat],i)=>{
            const[x,y]=proj(lon,lat);
            if(i===0)ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
          });
        });
      };
      if(mesh.type==="MultiLineString")mesh.coordinates.forEach(line=>{
        line.forEach(([lon,lat],i)=>{
          const[x,y]=proj(lon,lat);
          if(i===0)ctx.moveTo(x,y);
          else ctx.lineTo(x,y);
        });
      });
      ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();
    };
    drawMesh(worldData.borders,"#c8d4e0",0.6);

    // Coastline / outer border
    worldData.countries.features.forEach(f=>{
      drawGeo(f.geometry,null,"#b0c0d0",0.3);
    });

    // Subtle grid
    ctx.strokeStyle="rgba(180,200,220,0.3)";
    ctx.lineWidth=0.5;
    ctx.setLineDash([3,4]);
    // Equator
    ctx.beginPath();
    const[x0,y0]=proj(-180,0);const[x1,y1]=proj(180,0);
    ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
    ctx.setLineDash([]);

  },[worldData,size]);

  return(
    <div ref={containerRef} style={{position:"relative",width:"100%",height:"100%",borderRadius:12,overflow:"hidden"}}>
      <canvas ref={canvasRef} style={{position:"absolute",top:0,left:0,borderRadius:12}}/>

      {/* Dots */}
      {clusters.map((group,i)=>{
        const cx=group.reduce((a,s)=>a+(s.x||50),0)/group.length;
        const cy=group.reduce((a,s)=>a+(s.y||50),0)/group.length;
        const isCluster=group.length>1;
        const isActive=!isCluster&&activeSpit?.id===group[0].id;
        return(
          <button key={i} onClick={()=>onSpitClick(group)}
            style={{position:"absolute",left:`${cx}%`,top:`${cy}%`,transform:"translate(-50%,-50%)",background:"none",border:"none",cursor:"pointer",padding:0,zIndex:10}}>
            {isCluster?(
              <div style={{width:28,height:28,borderRadius:"50%",background:RAUSCH,border:"2.5px solid #fff",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 2px 12px rgba(255,56,92,0.45)",fontSize:11,fontWeight:700,color:"#fff",animation:"pulse 2.5s ease-in-out infinite"}}>
                {group.length}
              </div>
            ):(
              <div style={{width:isActive?16:11,height:isActive?16:11,borderRadius:"50%",background:roleColor(group[0].role),boxShadow:isActive?`0 0 0 4px rgba(0,0,0,0.1),0 0 16px rgba(0,0,0,0.2)`:`0 0 0 3px rgba(0,0,0,0.08),0 2px 8px rgba(0,0,0,0.15)`,transition:"all 0.3s ease",animation:"pulse 2.5s ease-in-out infinite"}}/>
            )}
          </button>
        );
      })}
    </div>
  );
}

// ── Player ────────────────────────────────────────────────────────────────────
function Player({duration,audioUrl}){
  const[playing,setPlaying]=useState(false);
  const[cur,setCur]=useState(0);
  const[speed,setSpeed]=useState(1);
  const[loaded,setLoaded]=useState(false);
  const[realDur,setRealDur]=useState(duration||30);
  const audioRef=useRef(null);
  const intRef=useRef(null);
  const barRef=useRef(null);

  useEffect(()=>{
    if(audioRef.current){audioRef.current.pause();audioRef.current.src="";}
    setPlaying(false);setCur(0);setLoaded(false);setRealDur(duration||30);
    if(!audioUrl)return;
    const a=new Audio();
    a.preload="metadata";
    a.src=audioUrl;
    a.onloadedmetadata=()=>{if(a.duration&&!isNaN(a.duration))setRealDur(Math.round(a.duration));setLoaded(true);};
    a.oncanplay=()=>setLoaded(true);
    a.onended=()=>{setPlaying(false);setCur(0);};
    a.onerror=()=>{console.error("Audio error",a.error);setLoaded(false);};
    audioRef.current=a;
    return()=>{a.pause();a.src="";};
  },[audioUrl]);

  useEffect(()=>{
    const a=audioRef.current;
    if(!a)return;
    if(playing){
      a.playbackRate=speed;
      a.play().catch(()=>setPlaying(false));
      intRef.current=setInterval(()=>{setCur(a.currentTime||0);if(a.ended){setPlaying(false);setCur(0);}},250);
    }else{
      a.pause();
      clearInterval(intRef.current);
    }
    return()=>clearInterval(intRef.current);
  },[playing,speed]);

  const skip=d=>{const a=audioRef.current;const t=Math.min(realDur,Math.max(0,cur+d));setCur(t);if(a)a.currentTime=t;};
  const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
  const pct=realDur>0?(cur/realDur)*100:0;
  const seek=e=>{const r=barRef.current.getBoundingClientRect();const t=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*realDur;setCur(t);if(audioRef.current)audioRef.current.currentTime=t;};
  const canPlay=!audioUrl||(audioUrl&&loaded);
  const btnS={background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,color:"#999",padding:"4px 6px"};

  return(
    <div style={{background:"#fafafa",borderRadius:12,padding:"12px 14px"}}>
      {audioUrl&&!loaded&&<div style={{fontSize:11,color:"#bbb",textAlign:"center",marginBottom:8}}>Cargando audio…</div>}
      {!audioUrl&&<div style={{fontSize:11,color:"#bbb",textAlign:"center",marginBottom:8}}>Audio no disponible</div>}
      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:10}}>
        <button onClick={()=>skip(-10)} style={btnS}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
          <span style={{fontSize:8,color:"#bbb"}}>10</span>
        </button>
        <button onClick={()=>canPlay&&setPlaying(p=>!p)} style={{width:40,height:40,borderRadius:"50%",border:"none",cursor:canPlay?"pointer":"not-allowed",background:playing?RAUSCH:"#fff",boxShadow:playing?`0 2px 10px rgba(255,56,92,0.4)`:"0 1px 4px rgba(0,0,0,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,color:playing?"#fff":"#333",transition:"all 0.2s",flexShrink:0,opacity:canPlay?1:0.5}}>
          {playing?"⏸":"▶"}
        </button>
        <button onClick={()=>skip(10)} style={btnS}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-4.5"/></svg>
          <span style={{fontSize:8,color:"#bbb"}}>10</span>
        </button>
        <div style={{display:"flex",alignItems:"center",gap:2,height:24,flex:1}}>
          {[0.6,1,0.8,1.2,0.7,1.1,0.9].map((h,i)=>(
            <div key={i} style={{width:3,borderRadius:2,background:RAUSCH,height:playing?`${h*20}px`:"4px",transition:"height 0.15s ease",animation:playing?`wave ${0.4+i*0.1}s ease-in-out infinite alternate`:"none"}}/>
          ))}
        </div>
        <span style={{fontSize:11,color:"#aaa",flexShrink:0}}>{fmt(cur)}/{fmt(realDur)}</span>
        <button onClick={()=>setSpeed(s=>{const i=SPEEDS.indexOf(s);return SPEEDS[(i+1)%SPEEDS.length];})} style={{background:speed!==1?"#fff0f3":"#f0f0f0",border:`1.5px solid ${speed!==1?RAUSCH:"#e8e8e8"}`,borderRadius:6,padding:"3px 7px",cursor:"pointer",fontSize:11,fontWeight:700,color:speed!==1?RAUSCH:"#888",flexShrink:0}}>
          {speed===1?"1x":speed===1.5?"1.5x":"2x"}
        </button>
      </div>
      <div ref={barRef} onClick={seek} style={{height:4,background:"#e8e8e8",borderRadius:2,cursor:"pointer",position:"relative"}}>
        <div style={{height:"100%",background:RAUSCH,borderRadius:2,width:`${pct}%`,pointerEvents:"none"}}/>
        <div style={{position:"absolute",top:"50%",left:`${pct}%`,transform:"translate(-50%,-50%)",width:12,height:12,borderRadius:"50%",background:RAUSCH,opacity:cur>0?1:0,pointerEvents:"none"}}/>
      </div>
    </div>
  );
}

// ── SpitCard ──────────────────────────────────────────────────────────────────
function SpitCard({spit,onClose,following,onFollowToggle,currentUser}){
  const[myR,setMyR]=useState([]);
  const[reactions,setReactions]=useState({});
  const[translated,setTranslated]=useState(null);
  const[translating,setTranslating]=useState(false);
  const[showFull,setShowFull]=useState(false);
  const userLang=(navigator.language||"es").split("-")[0];
  const spitLang=spit.lang||"es";
  const needsTr=spitLang!==userLang;
  const isFollowing=following&&following.includes(spit.handle);

  // Load reactions from Supabase
  useEffect(()=>{
    setTranslated(null);setTranslating(false);setShowFull(false);setMyR([]);setReactions({});
    // Load all reactions for this spit
    sb.from("reactions").select("emoji,handle").eq("spit_id",spit.id).then(({data})=>{
      if(!data)return;
      const counts={};
      const mine=[];
      data.forEach(r=>{
        counts[r.emoji]=(counts[r.emoji]||0)+1;
        if(r.handle===currentUser?.handle)mine.push(r.emoji);
      });
      setReactions(counts);
      setMyR(mine);
    });
    if(needsTr&&spit.transcript){
      setTranslating(true);
      translateText(spit.transcript||spit.text||"",userLang,spitLang).then(t=>{setTranslated(t);setTranslating(false);});
    }
  },[spit.id]);

  const react=async(emoji)=>{
    const has=myR.includes(emoji);
    if(has){
      setMyR(r=>r.filter(e=>e!==emoji));
      setReactions(p=>({...p,[emoji]:Math.max(0,(p[emoji]||0)-1)}));
      await sb.from("reactions").delete().eq("spit_id",spit.id).eq("handle",currentUser.handle).eq("emoji",emoji);
    }else{
      if(myR.length>=MAX_REACTIONS)return;
      setMyR(r=>[...r,emoji]);
      setReactions(p=>({...p,[emoji]:(p[emoji]||0)+1}));
      await sb.from("reactions").insert([{spit_id:spit.id,handle:currentUser.handle,emoji}]);
    }
  };

  const txt=needsTr?(translated||(spit.transcript||"")):( spit.transcript||spit.text||"");
  const preview=txt.length>110?txt.slice(0,110)+"…":txt;
  const total=Object.values(reactions).reduce((a,b)=>a+b,0);
  const left=MAX_REACTIONS-myR.length;
  const icon=spit.role==="Anfitrión"?"🏠":spit.role==="Huésped"?"🧳":"🗂️";

  return(
    <div style={{position:"absolute",bottom:16,left:"50%",transform:"translateX(-50%)",width:"min(460px,92vw)",background:"#fff",borderRadius:16,boxShadow:"0 8px 40px rgba(0,0,0,0.12)",zIndex:100,animation:"slideUp 0.25s ease",overflow:"hidden"}}>
      <div style={{height:3,background:`linear-gradient(90deg,${RAUSCH},#ff7a8a)`}}/>
      <div style={{padding:"18px 20px 20px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:40,height:40,borderRadius:"50%",background:"#f5f5f5",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{icon}</div>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <span style={{fontSize:14,fontWeight:700,color:"#222"}}>{spit.handle||"@anónimo"}</span>
                {spit.handle&&spit.handle!==currentUser?.handle&&onFollowToggle&&(
                  <button onClick={()=>onFollowToggle(spit.handle)} style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:600,cursor:"pointer",background:isFollowing?"#fff":RAUSCH,border:`1.5px solid ${isFollowing?"#e0e0e0":RAUSCH}`,color:isFollowing?"#888":"#fff",transition:"all 0.2s"}}>
                    {isFollowing?"Siguiendo":"+ Seguir"}
                  </button>
                )}
              </div>
              <div style={{fontSize:11,color:"#aaa",marginTop:2}}>{spit.role}{spit.gender&&spit.gender!=="No especifico"?` · ${spit.gender}`:""}{spit.age?` · ${spit.age}a`:""} · {spit.duration}s</div>
            </div>
          </div>
          <button onClick={onClose} style={{background:"#f5f5f5",border:"none",borderRadius:"50%",width:30,height:30,cursor:"pointer",fontSize:15,color:"#888",display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
        </div>
        <div style={{height:1,background:"#f5f5f5",marginBottom:12}}/>
        <div style={{marginBottom:14}}>
          {translating?(
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:15,height:15,border:`2px solid ${RAUSCH}`,borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
              <span style={{fontSize:13,color:"#aaa"}}>Traduciendo…</span>
            </div>
          ):(
            <>
              {txt?(
                <>
                  <p style={{fontSize:14,color:"#333",lineHeight:1.65,margin:0}}>{showFull?txt:preview}</p>
                  {txt.length>110&&<button onClick={()=>setShowFull(p=>!p)} style={{background:"none",border:"none",color:RAUSCH,fontSize:12,fontWeight:600,cursor:"pointer",padding:0,marginTop:6}}>{showFull?"Ver menos":"Ver todo"}</button>}
                </>
              ):(
                <p style={{fontSize:13,color:"#bbb",fontStyle:"italic"}}>Audio sin transcripción</p>
              )}
              {needsTr&&translated&&<div style={{fontSize:11,color:"#ccc",marginTop:6}}>Traducido del {LANG_NAMES[spitLang]||spitLang}</div>}
            </>
          )}
        </div>
        <div style={{marginBottom:14}}><Player duration={spit.duration||30} audioUrl={spit.audio_url}/></div>
        <div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <span style={{fontSize:11,color:"#bbb"}}>{total} reacciones</span>
            <span style={{fontSize:11,color:left===0?RAUSCH:"#ccc"}}>{left>0?`podés agregar ${left} más`:"máximo alcanzado"}</span>
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {EMOJIS.map(e=>{
              const a=myR.includes(e),dis=!a&&myR.length>=MAX_REACTIONS;
              return<button key={e} onClick={()=>react(e)} style={{background:a?"#fff0f3":"#f7f7f7",border:`1.5px solid ${a?RAUSCH:"#ebebeb"}`,borderRadius:20,padding:"5px 10px",cursor:dis?"not-allowed":"pointer",fontSize:15,display:"flex",alignItems:"center",gap:5,opacity:dis?0.35:1,transition:"all 0.15s",transform:a?"scale(1.05)":"scale(1)"}}>
                <span>{e}</span><span style={{fontSize:11,fontWeight:600,color:a?RAUSCH:"#aaa"}}>{reactions[e]||0}</span>
              </button>;
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Record Modal ──────────────────────────────────────────────────────────────
function RecordModal({onClose,currentUser,onSaved}){
  const[recording,setRecording]=useState(false);
  const[seconds,setSeconds]=useState(0);
  const[done,setDone]=useState(false);
  const[saving,setSaving]=useState(false);
  const[error,setError]=useState("");
  const[effect,setEffect]=useState("normal"); // normal | ardilla | sombra
  const[previewing,setPreviewing]=useState(false);
  const tRef=useRef(null);
  const mrRef=useRef(null);
  const chunksRef=useRef([]);
  const audioCtxRef=useRef(null);
  const sourceRef=useRef(null);

  const EFFECTS={
    normal:{label:"Normal",emoji:"🎙",desc:"Tu voz tal cual",rate:1,pitch:1},
    ardilla:{label:"Ardilla",emoji:"🐿️",desc:"Aguda y divertida",rate:1.4,pitch:1.4},
    sombra:{label:"Sombra",emoji:"👤",desc:"Grave y anónima",rate:0.8,pitch:0.7},
  };

  const start=async()=>{
    setError("");
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      // Use format compatible with all browsers
      const mimeType=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
        ?"audio/webm;codecs=opus"
        :MediaRecorder.isTypeSupported("audio/mp4")
        ?"audio/mp4"
        :"audio/webm";
      const mr=new MediaRecorder(stream,{mimeType});
      chunksRef.current=[];
      mr.ondataavailable=e=>{if(e.data&&e.data.size>0)chunksRef.current.push(e.data);};
      mr.start(1000); // collect data every 1 second
      mrRef.current=mr;
      setRecording(true);
      tRef.current=setInterval(()=>setSeconds(s=>{if(s>=90){stop();return s;}return s+1;}),1000);
    }catch(e){setError("No se pudo acceder al micrófono.");}
  };

  const stop=()=>{
    setRecording(false);
    clearInterval(tRef.current);
    if(mrRef.current&&mrRef.current.state!=="inactive"){
      mrRef.current.onstop=()=>{
        if(seconds>=3)setDone(true);
      };
      // Request final data chunk before stopping
      mrRef.current.requestData();
      mrRef.current.stop();
      mrRef.current.stream.getTracks().forEach(t=>t.stop());
    }else if(seconds>=3)setDone(true);
  };

  const stopPreview=()=>{
    if(sourceRef.current){try{sourceRef.current.stop();}catch(e){}}
    if(audioCtxRef.current){try{audioCtxRef.current.close();}catch(e){}}
    sourceRef.current=null;
    audioCtxRef.current=null;
    setPreviewing(false);
  };

  const preview=async()=>{
    stopPreview();
    try{
      const blob=new Blob(chunksRef.current,{type:"audio/webm"});
      const arrayBuf=await blob.arrayBuffer();
      const ctx=new AudioContext();
      audioCtxRef.current=ctx;
      const decoded=await ctx.decodeAudioData(arrayBuf);
      const source=ctx.createBufferSource();
      source.buffer=decoded;
      const cfg=EFFECTS[effect];
      source.playbackRate.value=cfg.rate;
      source.connect(ctx.destination);
      source.start();
      sourceRef.current=source;
      setPreviewing(true);
      source.onended=()=>{setPreviewing(false);};
    }catch(e){setError("No se pudo previsualizar el audio.");}
  };

  // Apply effect to blob before upload
  const applyEffectAndGetBlob=async()=>{
    const cfg=EFFECTS[effect];
    if(cfg.rate===1) return new Blob(chunksRef.current,{type:"audio/webm"});
    try{
      const blob=new Blob(chunksRef.current,{type:"audio/webm"});
      const arrayBuf=await blob.arrayBuffer();
      const ctx=new OfflineAudioContext(2,44100*seconds*2,44100);
      const decoded=await new AudioContext().decodeAudioData(arrayBuf);
      const source=ctx.createBufferSource();
      source.buffer=decoded;
      source.playbackRate.value=cfg.rate;
      source.connect(ctx.destination);
      source.start();
      const rendered=await ctx.startRendering();
      // Convert to wav blob
      const wavBlob=audioBufferToWav(rendered);
      return wavBlob;
    }catch(e){
      return new Blob(chunksRef.current,{type:"audio/webm"});
    }
  };

  // Simple AudioBuffer to WAV converter
  const audioBufferToWav=(buffer)=>{
    const ch=buffer.numberOfChannels;
    const len=buffer.length;
    const rate=buffer.sampleRate;
    const arrayBuf=new ArrayBuffer(44+len*ch*2);
    const view=new DataView(arrayBuf);
    const writeStr=(o,s)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};
    writeStr(0,"RIFF");view.setUint32(4,36+len*ch*2,true);writeStr(8,"WAVE");
    writeStr(12,"fmt ");view.setUint32(16,16,true);view.setUint16(20,1,true);
    view.setUint16(22,ch,true);view.setUint32(24,rate,true);
    view.setUint32(28,rate*ch*2,true);view.setUint16(32,ch*2,true);
    view.setUint16(34,16,true);writeStr(36,"data");view.setUint32(40,len*ch*2,true);
    let offset=44;
    for(let i=0;i<len;i++){for(let c=0;c<ch;c++){
      const s=Math.max(-1,Math.min(1,buffer.getChannelData(c)[i]));
      view.setInt16(offset,s<0?s*0x8000:s*0x7FFF,true);offset+=2;
    }}
    return new Blob([arrayBuf],{type:"audio/wav"});
  };

  const save=async()=>{
    stopPreview();
    setSaving(true);
    try{
      const mimeType=chunksRef.current[0]?.type||"audio/webm";
      const ext=mimeType.includes("mp4")?"mp4":"webm";
      const blob=effect==="normal"
        ?new Blob(chunksRef.current,{type:mimeType})
        :await applyEffectAndGetBlob();
      const fn=`${(currentUser.handle||"anon").replace("@","")}_${Date.now()}.${ext}`;
      const audioUrl=await dbUploadAudio(blob,fn);
      let lat=0,lon=0;
      try{
        const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000}));
        lat=pos.coords.latitude;lon=pos.coords.longitude;
      }catch{}
      const lang=(navigator.language||"es").split("-")[0];
      await dbInsertSpit({handle:currentUser.handle,role:currentUser.role,duration:seconds,lang,lat,lon,audio_url:audioUrl||"",transcript:""});
      setSaving(false);
      onSaved&&onSaved();
      onClose();
    }catch(e){setError("Error al guardar. Intentá de nuevo.");setSaving(false);}
  };

  useEffect(()=>()=>{clearInterval(tRef.current);stopPreview();},[]);

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:200,display:"flex",alignItems:"flex-end",justifyContent:"center",backdropFilter:"blur(4px)"}}>
      <div style={{background:"#fff",borderRadius:"24px 24px 0 0",padding:"8px 28px 40px",width:"100%",maxWidth:480,boxShadow:"0 -8px 40px rgba(0,0,0,0.12)",animation:"sheetUp 0.3s ease"}}>
        <div style={{width:40,height:4,background:"#e0e0e0",borderRadius:2,margin:"12px auto 24px"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
          <div>
            <div style={{fontSize:20,fontWeight:700,color:"#222"}}>Escupí</div>
            <div style={{fontSize:12,color:"#aaa",marginTop:2}}>como {currentUser.handle}</div>
          </div>
          <button onClick={onClose} style={{background:"#f5f5f5",border:"none",borderRadius:"50%",width:32,height:32,cursor:"pointer",fontSize:16,color:"#888"}}>×</button>
        </div>
        {error&&<div style={{fontSize:12,color:RAUSCH,background:"#fff0f3",padding:"8px 12px",borderRadius:8,marginBottom:16}}>{error}</div>}

        {!done?(
          <div style={{textAlign:"center",paddingBottom:8}}>
            <div style={{fontSize:60,fontWeight:700,letterSpacing:-2,color:recording?(90-seconds<10?RAUSCH:"#222"):"#ddd",marginBottom:4,transition:"color 0.3s"}}>
              {String(Math.floor((90-seconds)/60)).padStart(2,"0")}:{String((90-seconds)%60).padStart(2,"0")}
            </div>
            <div style={{fontSize:11,color:"#bbb",marginBottom:4}}>
              {recording?<span style={{color:"#aaa"}}>grabando · {seconds}s</span>:"tiempo disponible"}
            </div>
            <div style={{height:4,background:"#f0f0f0",borderRadius:2,marginBottom:36,overflow:"hidden"}}>
              <div style={{height:"100%",background:90-seconds<10?RAUSCH:"#22c55e",borderRadius:2,width:`${((90-seconds)/90)*100}%`,transition:"width 1s linear"}}/>
            </div>
            <button onClick={recording?stop:start} style={{width:80,height:80,borderRadius:"50%",background:recording?RAUSCH:"#fff",border:recording?"none":"2px solid #e8e8e8",cursor:"pointer",fontSize:28,boxShadow:recording?`0 0 0 12px rgba(255,56,92,0.1),0 4px 20px rgba(255,56,92,0.4)`:"0 2px 12px rgba(0,0,0,0.1)",transition:"all 0.3s"}}>
              {recording?"⏹":"🎙"}
            </button>
            <div style={{fontSize:13,color:"#bbb",marginTop:14}}>{recording?"Tocá para terminar":"Tocá para grabar"}</div>
          </div>
        ):(
          <div style={{paddingBottom:8}}>
            {/* Effect selector */}
            <div style={{marginBottom:20}}>
              <div style={{fontSize:12,fontWeight:600,color:"#555",marginBottom:10,textTransform:"uppercase",letterSpacing:0.5}}>Elegí tu voz</div>
              <div style={{display:"flex",gap:8}}>
                {Object.entries(EFFECTS).map(([key,cfg])=>(
                  <button key={key} onClick={()=>{stopPreview();setEffect(key);}} style={{
                    flex:1,padding:"12px 8px",borderRadius:12,cursor:"pointer",
                    background:effect===key?"#fff0f3":"#f7f7f7",
                    border:`1.5px solid ${effect===key?RAUSCH:"#e8e8e8"}`,
                    transition:"all 0.15s",textAlign:"center",
                  }}>
                    <div style={{fontSize:22,marginBottom:4}}>{cfg.emoji}</div>
                    <div style={{fontSize:12,fontWeight:600,color:effect===key?RAUSCH:"#333"}}>{cfg.label}</div>
                    <div style={{fontSize:10,color:"#aaa",marginTop:2}}>{cfg.desc}</div>
                  </button>
                ))}
              </div>
            </div>

            {/* Preview button */}
            <button onClick={previewing?stopPreview:preview} style={{
              width:"100%",padding:14,borderRadius:12,marginBottom:10,
              background:previewing?"#f0f0f0":"#f7f7f7",
              border:`1.5px solid ${previewing?RAUSCH:"#e8e8e8"}`,
              color:previewing?RAUSCH:"#555",fontSize:14,fontWeight:600,cursor:"pointer",
              display:"flex",alignItems:"center",justifyContent:"center",gap:8,
            }}>
              {previewing?(
                <><span style={{fontSize:16}}>⏹</span> Parar preview</>
              ):(
                <><span style={{fontSize:16}}>▶</span> Escuchar antes de publicar</>
              )}
            </button>

            {/* Publish */}
            <button onClick={save} disabled={saving} style={{
              width:"100%",padding:16,borderRadius:12,
              background:saving?"#ffb3c0":RAUSCH,
              border:"none",color:"#fff",fontSize:15,fontWeight:700,
              cursor:saving?"not-allowed":"pointer",
              boxShadow:"0 4px 16px rgba(255,56,92,0.3)",
            }}>
              {saving?"Guardando...":"Publicar en el globo 🌍"}
            </button>
            <div style={{fontSize:11,color:"#bbb",textAlign:"center",marginTop:8}}>
              {seconds}s · efecto: {EFFECTS[effect].label}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Landing texts ─────────────────────────────────────────────────────────────
const TEXTS={
  es:{

    title2:"Escupí",
    title3:"lo que sentís.",

function CompleteProfile({email,authId,onDone}){
  const[handle,setHandle]=useState("");
  const[role,setRole]=useState("");
  const[error,setError]=useState("");
  const[loading,setLoading]=useState(false);
  const iStyle={width:"100%",padding:"12px 14px",background:"#f7f7f7",border:"1.5px solid #ebebeb",borderRadius:10,fontSize:14,color:"#222",outline:"none"};

  const save=async()=>{
    if(!handle){setError("Elegí un nickname.");return;}
    if(!role){setError("Seleccioná tu rol.");return;}
    const h="@"+handle.replace(/^@/,"").toLowerCase().replace(/[^a-z0-9_]/g,"");
    if(h.length<4){setError("El nickname debe tener al menos 3 caracteres.");return;}
    setLoading(true);
    const{error:err}=await sb.from("users").insert([{email,handle:h,role,auth_id:authId}]);
    if(err){setError("Ese nickname ya está en uso.");setLoading(false);return;}
    setLoading(false);
    onDone({email,handle:h,role});
  };

  return(
    <div style={{width:"100%",maxWidth:380,background:"#fff",borderRadius:16,boxShadow:"0 4px 32px rgba(0,0,0,0.08)",padding:"32px 28px"}}>
      <div style={{fontSize:16,fontWeight:700,color:"#222",marginBottom:6}}>¿Cómo querés que te llamen?</div>
      <div style={{fontSize:13,color:"#aaa",marginBottom:24}}>Usá un nickname — nadie necesita saber quién sos.</div>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div style={{position:"relative"}}>
          <span style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",color:"#aaa"}}>@</span>
          <input type="text" placeholder="tunickname" value={handle} onChange={e=>setHandle(e.target.value.replace(/^@/,""))} style={{...iStyle,paddingLeft:28}}/>
        </div>
        <div>
          <div style={{fontSize:12,fontWeight:600,color:"#555",marginBottom:8,textTransform:"uppercase",letterSpacing:0.5}}>Soy</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {["Anfitrión","Huésped","Property Manager"].map(r=>(
              <button key={r} onClick={()=>setRole(r)} style={{padding:"8px 14px",borderRadius:8,fontSize:12,fontWeight:500,cursor:"pointer",background:role===r?RAUSCH:"#f7f7f7",border:role===r?"none":"1.5px solid #e8e8e8",color:role===r?"#fff":"#555",transition:"all 0.15s"}}>{r}</button>
            ))}
          </div>
        </div>
        {error&&<div style={{fontSize:12,color:RAUSCH,background:"#fff0f3",padding:"8px 12px",borderRadius:8}}>{error}</div>}
        <button onClick={save} disabled={loading} style={{width:"100%",padding:16,borderRadius:10,background:loading?"#ffb3c0":RAUSCH,border:"none",color:"#fff",fontSize:15,fontWeight:700,cursor:loading?"not-allowed":"pointer",boxShadow:"0 4px 16px rgba(255,56,92,0.3)"}}>
          {loading?"Guardando...":"Empezar a escupir 🔥"}
        </button>
      </div>
    </div>
  );
}

function App(){
  const[user,setUser]=useState(null);
  const[checking,setChecking]=useState(true);
  const[showAuth,setShowAuth]=useState(false);
  const[spits,setSpits]=useState([]);
  const[activeSpit,setActiveSpit]=useState(null);
  const[clusterList,setClusterList]=useState(null);
  const[showRecord,setShowRecord]=useState(false);
  const[following,setFollowing]=useState([]);
  const[showProfile,setShowProfile]=useState(false);
  const[mySpits,setMySpits]=useState([]);

  const handleSpitClick=(group)=>{
    if(!group||group.length===0)return;
    if(group.length===1){setActiveSpit(group[0]);setClusterList(null);}
    else{setClusterList(group);setActiveSpit(null);}
  };

  // Restore session
  useEffect(()=>{
    dbGetSession().then(profile=>{
      if(profile)setUser({email:profile.email,handle:profile.handle,role:profile.role,roles:profile.roles||[profile.role]});
      setChecking(false);
    });
    const{data:{subscription}}=sb.auth.onAuthStateChange(async(event,session)=>{
      if(event==="SIGNED_IN"&&session){
        const{data:profile}=await sb.from("users").select("*").eq("auth_id",session.user.id).single();
        if(profile){
          setUser({email:profile.email,handle:profile.handle,role:profile.role,roles:profile.roles||[profile.role]});
        }else{
          setUser({email:session.user.email,handle:null,role:null,needsProfile:true,auth_id:session.user.id});
        }
        setChecking(false);
      }
      if(event==="SIGNED_OUT")setUser(null);
    });
    return()=>subscription.unsubscribe();
  },[]);

  const loadSpits=()=>dbGetSpits().then(data=>{
    const positioned=data.map(s=>({...s,
      x:s.lon!=null?((s.lon+180)/360)*80+10:Math.random()*60+20,
      y:s.lat!=null?((90-s.lat)/180)*80+10:Math.random()*60+20
    }));
    setSpits(positioned);
  });

  useEffect(()=>{
    if(!user)return;
    loadSpits();
    const ch=sb.channel("spits").on("postgres_changes",{event:"INSERT",schema:"public",table:"spits"},p=>{
      const s=p.new;
      const x=s.lon!=null?((s.lon+180)/360)*80+10:Math.random()*60+20;
      const y=s.lat!=null?((90-s.lat)/180)*80+10:Math.random()*60+20;
      setSpits(prev=>[{...s,x,y,reactions:{}},...prev]);
    }).subscribe();
    return()=>sb.removeChannel(ch);
  },[user]);

  // Load my spits when profile opens
  useEffect(()=>{
    if(!showProfile||!user)return;
    sb.from("spits").select("*").eq("handle",user.handle).order("created_at",{ascending:false})
      .then(({data})=>setMySpits(data||[]));
  },[showProfile,user]);

  const deleteSpit=async(id)=>{
    await sb.from("spits").delete().eq("id",id);
    setMySpits(p=>p.filter(s=>s.id!==id));
    loadSpits();
  };

  const updateRoles=async(roles)=>{
    setUser(p=>({...p,roles}));
    await sb.from("users").update({roles:JSON.stringify(roles)}).eq("handle",user.handle);
  };

  const logout=async()=>{await sb.auth.signOut();setUser(null);};
  const toggleFollow=h=>setFollowing(p=>p.includes(h)?p.filter(x=>x!==h):[...p,h]);

  if(checking)return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#fff"}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:28,fontWeight:800}}><span style={{color:RAUSCH}}>air</span>spit</div>
        <div style={{width:32,height:32,border:`3px solid ${RAUSCH}`,borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite",margin:"16px auto 0"}}/>
      </div>
    </div>
  );

  if(!user)return <Landing onEnter={()=>setShowAuth(true)} showAuth={showAuth} onLogin={setUser}/>;

  // New Google user needs to complete profile
  if(user.needsProfile)return(
    <div style={{minHeight:"100vh",background:"#fff",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{marginBottom:32,textAlign:"center"}}>
        <div style={{fontSize:28,fontWeight:800}}><span style={{color:RAUSCH}}>air</span>spit</div>
        <div style={{fontSize:14,color:"#aaa",marginTop:8}}>Un último paso para empezar</div>
      </div>
      <CompleteProfile email={user.email} authId={user.auth_id} onDone={profile=>setUser({...profile,roles:[profile.role]})}/>
    </div>
  );

        <button onClick={()=>setShowProfile(false)} style={{background:"none",border:"none",fontSize:14,color:RAUSCH,cursor:"pointer",fontWeight:600,display:"flex",alignItems:"center",gap:6}}>

      </header>

        {/* Profile card */}

          <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:20}}>
            <div style={{width:56,height:56,borderRadius:"50%",background:"#fff0f3",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>
              {(user.roles||[user.role]).includes("Anfitrión")&&(user.roles||[user.role]).includes("Huésped")?"🏠🧳":(user.roles||[user.role]).includes("Anfitrión")?"🏠":(user.roles||[user.role]).includes("Huésped")?"🧳":"🗂️"}
            </div>
            <div>

              <div style={{fontSize:12,color:"#aaa",marginTop:2}}>{user.email}</div>

            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {ROLES.map(r=>{
                const active=(user.roles||[user.role]).includes(r);
                return(
                  <button key={r} onClick={()=>{
                    const current=user.roles||[user.role];

            </div>
          ):(
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {mySpits.map(s=>(
                <div key={s.id} style={{background:"#fff",borderRadius:14,padding:"14px 16px",boxShadow:"0 1px 6px rgba(0,0,0,0.05)"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                    <div>
                      <span style={{fontSize:11,color:RAUSCH,fontWeight:600,textTransform:"uppercase",letterSpacing:1}}>{s.role}</span>
                      <span style={{fontSize:11,color:"#bbb",marginLeft:8}}>{s.duration}s</span>
                      {s.audio_url&&<span style={{fontSize:11,color:"#bbb",marginLeft:8}}>🔊</span>}
                    </div>
                    <button onClick={()=>deleteSpit(s.id)} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,color:"#ddd",padding:"2px 6px",borderRadius:6,transition:"all 0.15s"}}
                      onMouseOver={e=>e.currentTarget.style.color=RAUSCH}
                      onMouseOut={e=>e.currentTarget.style.color="#ddd"}>
                      🗑
                    </button>
                  </div>
                  <Player duration={s.duration} audioUrl={s.audio_url}/>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );

  return(
    <div style={{background:"#f7f7f7",minHeight:"100vh",display:"flex",flexDirection:"column",fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",color:"#222"}}>
      <header style={{background:"#fff",padding:"0 24px",height:64,display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid #ebebeb",position:"sticky",top:0,zIndex:50}}>
        <div style={{fontSize:20,fontWeight:800,letterSpacing:-0.5}}>
          <span style={{color:RAUSCH}}>air</span>spit
        </div>
        <div style={{display:"flex",gap:12,alignItems:"center"}}>
          <div style={{textAlign:"center",lineHeight:1}}>
            <div style={{fontSize:16,fontWeight:800,color:RAUSCH,letterSpacing:-0.5}}>{spits.length.toLocaleString()}</div>
            <div style={{fontSize:9,color:"#bbb",textTransform:"uppercase",letterSpacing:1}}>spits globales</div>
          </div>
          <div style={{width:1,height:28,background:"#ebebeb"}}/>
          <button onClick={()=>setShowProfile(true)} style={{fontSize:12,color:"#555",background:"#f5f5f5",padding:"6px 12px",borderRadius:20,border:"none",cursor:"pointer",fontWeight:600,transition:"all 0.15s"}}
            onMouseOver={e=>e.currentTarget.style.background="#ffe8ec"}
            onMouseOut={e=>e.currentTarget.style.background="#f5f5f5"}>
            {user.handle}
          </button>
          <button onClick={()=>setShowRecord(true)} style={{background:RAUSCH,border:"none",color:"#fff",padding:"10px 18px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600,boxShadow:`0 2px 8px rgba(255,56,92,0.3)`}}>+ Escupir</button>
        </div>
      </header>
      <main style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px 0 160px",position:"relative"}}>
        <div style={{background:"#fff",borderRadius:20,boxShadow:"0 4px 24px rgba(0,0,0,0.06)",padding:20,width:"min(800px,96vw)"}}>
          <div style={{width:"100%",height:"min(400px,50vw)",minHeight:220,position:"relative"}}>
            <GlobeSVG spits={spits} onSpitClick={handleSpitClick} activeSpit={activeSpit}/>
          </div>
        </div>
        <p style={{fontSize:12,color:"#bbb",marginTop:14}}>Tocá un punto para escuchar</p>
        <div style={{display:"flex",gap:16,marginTop:8,flexWrap:"wrap",justifyContent:"center"}}>
          {[{color:RAUSCH,label:"Anfitrión"},{color:BABU,label:"Huésped"},{color:ARCHES,label:"Property Manager"}].map(({color,label})=>(
            <div key={label} style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"#aaa"}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:color}}/>
              {label}
            </div>
          ))}
        </div>
        {activeSpit&&<SpitCard spit={activeSpit} onClose={()=>setActiveSpit(null)} following={following} onFollowToggle={toggleFollow} currentUser={user}/>}
        {clusterList&&(
          <div style={{position:"absolute",bottom:16,left:"50%",transform:"translateX(-50%)",width:"min(460px,92vw)",background:"#fff",borderRadius:16,boxShadow:"0 8px 40px rgba(0,0,0,0.12)",zIndex:100,overflow:"hidden",animation:"slideUp 0.25s ease"}}>
            <div style={{height:3,background:`linear-gradient(90deg,${RAUSCH},#ff7a8a)`}}/>
            <div style={{padding:"16px 20px 20px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                <span style={{fontSize:15,fontWeight:700,color:"#222"}}>{clusterList.length} spits en esta zona</span>
                <button onClick={()=>setClusterList(null)} style={{background:"#f5f5f5",border:"none",borderRadius:"50%",width:28,height:28,cursor:"pointer",fontSize:14,color:"#888"}}>×</button>
              </div>
              <div style={{maxHeight:260,overflowY:"auto",display:"flex",flexDirection:"column",gap:2}}>
                {clusterList.map(s=>(
                  <div key={s.id} onClick={()=>{setActiveSpit(s);setClusterList(null);}}
                    style={{display:"flex",alignItems:"center",gap:12,padding:"10px 8px",borderRadius:10,cursor:"pointer",transition:"background 0.15s"}}
                    onMouseOver={e=>e.currentTarget.style.background="#f9f9f9"}
                    onMouseOut={e=>e.currentTarget.style.background="transparent"}>
                    <div style={{width:36,height:36,borderRadius:"50%",background:"#f5f5f5",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>
                      {s.role==="Anfitrión"?"🏠":s.role==="Huésped"?"🧳":"🗂️"}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:600,color:"#222"}}>{s.handle}</div>
                      <div style={{fontSize:11,color:"#aaa"}}>{s.role} · {s.duration}s{s.audio_url?" · 🔊":""}</div>
                    </div>
                    <span style={{color:RAUSCH,fontSize:16}}>▶</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </main>
      {showRecord&&<RecordModal onClose={()=>setShowRecord(false)} currentUser={user} onSaved={loadSpits}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
